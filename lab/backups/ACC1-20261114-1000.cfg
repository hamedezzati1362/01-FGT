! SAMPLE backup (lab-only).
! ===== ACC1 : BASE (lab-only, sample password) =====
hostname ACC1
service timestamps log datetime msec
service timestamps debug datetime msec
no ip domain-lookup
ip domain-name lab.local
enable secret Lab-Only-123
username netadmin privilege 15 secret Lab-Only-123
!
vtp domain lab.local
vtp mode client
vtp version 2
vtp password Lab-Only-123
!
spanning-tree mode pvst
!
ip access-list standard VTY-ACL
 permit 192.168.100.0 0.0.0.255
 permit 192.168.102.0 0.0.0.255
 permit 192.168.90.0 0.0.0.255
!
banner motd # LAB ONLY - authorized use #
! WEAKNESS (as in the real network): STP root is an access switch
spanning-tree vlan 1,2,89,90,97,100-105,107-108 priority 4096
!
interface GigabitEthernet0/0
 description UP-DIS-Gi1/0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 2,90,97,100-105,107-108
 no shutdown
interface GigabitEthernet0/1
 description PC-Ali+Phone
 switchport mode access
 switchport access vlan 101
 switchport voice vlan 97
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
interface GigabitEthernet0/2
 description UNUSED
 switchport mode access
 switchport access vlan 101
 switchport voice vlan 97
 spanning-tree portfast
 shutdown
interface GigabitEthernet0/3
 description AP-Wifi
 switchport mode access
 switchport access vlan 105
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0
 description UNUSED
 switchport mode access
 switchport access vlan 101
 shutdown
interface GigabitEthernet1/2
 description UNUSED
 switchport mode access
 switchport access vlan 101
 shutdown
interface GigabitEthernet1/3
 description UNUSED
 switchport mode access
 switchport access vlan 101
 shutdown
interface GigabitEthernet1/1
 description DISABLED
 switchport mode access
 switchport access vlan 101
 shutdown
!
interface Vlan100
 description MGMT-ACC1
 ip address 192.168.100.11 255.255.255.0
 no shutdown
no ip routing
ip default-gateway 192.168.100.254
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 access-class VTY-ACL in
 login local
 transport input ssh
 exec-timeout 30 0
!
! generate the SSH key AFTER hostname/domain are set (takes ~10 s):
crypto key generate rsa modulus 2048
ip ssh version 2
end
! write memory
