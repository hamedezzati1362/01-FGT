subnet 192.168.107.0 netmask 255.255.255.0 {
  range 192.168.107.50 192.168.107.200;
  option routers 192.168.107.254;
  host pc1-v107 { hardware ethernet 02:aa:00:00:01:01; fixed-address 192.168.107.61; }
  host pc2-v107 { hardware ethernet 02:aa:00:00:02:01; fixed-address 192.168.107.62; }
  host pc3-v107 { hardware ethernet 02:aa:00:00:03:01; fixed-address 192.168.107.63; }
