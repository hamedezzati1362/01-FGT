# SRV1: ISC dhcpd (lab-only). Subnets selected via relay giaddr.
authoritative;
default-lease-time 600;      # short lease for the lab (real: hours/days)
max-lease-time 1200;
option domain-name "lab.local";
option domain-name-servers 192.168.90.11;
subnet 192.168.90.0 netmask 255.255.255.0 { }   # SRV1 own subnet (required, no range)
subnet 192.168.2.0 netmask 255.255.255.0 {
  range 192.168.2.50 192.168.2.200;
  option routers 192.168.2.254;
}
subnet 192.168.97.0 netmask 255.255.255.0 {
  range 192.168.97.50 192.168.97.200;
  option routers 192.168.97.254;
  host phone1-v97 { hardware ethernet 02:bb:00:00:01:97; fixed-address 192.168.97.61; }
  host phone2-v97 { hardware ethernet 02:bb:00:00:02:97; fixed-address 192.168.97.62; }
  host phone3-v97 { hardware ethernet 02:bb:00:00:03:97; fixed-address 192.168.97.63; }
}
subnet 192.168.101.0 netmask 255.255.255.0 {
  range 192.168.101.50 192.168.101.200;
  option routers 192.168.101.254;
  host pc1-v101 { hardware ethernet 02:aa:00:00:01:01; fixed-address 192.168.101.61; }
  host pc2-v101 { hardware ethernet 02:aa:00:00:02:01; fixed-address 192.168.101.62; }
  host pc3-v101 { hardware ethernet 02:aa:00:00:03:01; fixed-address 192.168.101.63; }
}
subnet 192.168.102.0 netmask 255.255.255.0 {
  range 192.168.102.50 192.168.102.200;
  option routers 192.168.102.254;
}
subnet 192.168.103.0 netmask 255.255.255.0 {
  range 192.168.103.50 192.168.103.200;
  option routers 192.168.103.254;
  host pc1-v103 { hardware ethernet 02:aa:00:00:01:01; fixed-address 192.168.103.61; }
  host pc3-v103 { hardware ethernet 02:aa:00:00:03:01; fixed-address 192.168.103.63; }
}
subnet 192.168.104.0 netmask 255.255.255.0 {
  range 192.168.104.50 192.168.104.200;
  option routers 192.168.104.254;
  host pc2-v104 { hardware ethernet 02:aa:00:00:02:01; fixed-address 192.168.104.62; }
}
subnet 192.168.105.0 netmask 255.255.255.0 {
  range 192.168.105.50 192.168.105.200;
  option routers 192.168.105.254;
