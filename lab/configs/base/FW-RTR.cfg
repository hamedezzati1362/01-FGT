! ===== FW-RTR : Router-on-a-Stick (acts as the firewall/gateway) =====
hostname FW-RTR
no ip domain-lookup
enable secret Lab-Only-123
username netadmin privilege 15 secret Lab-Only-123
!
interface GigabitEthernet0/0
 description TRUNK-to-CORE-Gi0/0
 no ip address
 no shutdown
interface GigabitEthernet0/0.2
 description GW-VLAN2-CAMERA
 encapsulation dot1Q 2
 ip address 192.168.2.254 255.255.255.0
 ip helper-address 192.168.90.11
interface GigabitEthernet0/0.90
 description GW-VLAN90-SERVERS
 encapsulation dot1Q 90
 ip address 192.168.90.254 255.255.255.0
interface GigabitEthernet0/0.97
 description GW-VLAN97-VOICE
 encapsulation dot1Q 97
 ip address 192.168.97.254 255.255.255.0
 ip helper-address 192.168.90.11
interface GigabitEthernet0/0.100
 description GW-VLAN100-MGMT-DEV
 encapsulation dot1Q 100
 ip address 192.168.100.254 255.255.255.0
interface GigabitEthernet0/0.101
 description GW-VLAN101-FIN-ADMIN
 encapsulation dot1Q 101
 ip address 192.168.101.254 255.255.255.0
 ip helper-address 192.168.90.11
interface GigabitEthernet0/0.102
 description GW-VLAN102-IT
 encapsulation dot1Q 102
 ip address 192.168.102.254 255.255.255.0
 ip helper-address 192.168.90.11
interface GigabitEthernet0/0.103
 description GW-VLAN103-CALLCENTER
 encapsulation dot1Q 103
 ip address 192.168.103.254 255.255.255.0
 ip helper-address 192.168.90.11
interface GigabitEthernet0/0.104
 description GW-VLAN104-CEO
 encapsulation dot1Q 104
 ip address 192.168.104.254 255.255.255.0
 ip helper-address 192.168.90.11
interface GigabitEthernet0/0.105
 description GW-VLAN105-WIFI-AP
 encapsulation dot1Q 105
 ip address 192.168.105.254 255.255.255.0
 ip helper-address 192.168.90.11
interface GigabitEthernet0/0.107
 description GW-VLAN107-USERS-GEN
 encapsulation dot1Q 107
 ip address 192.168.107.254 255.255.255.0
 ip helper-address 192.168.90.11
interface GigabitEthernet0/0.108
 description GW-VLAN108-WIFI-CLIENT
 encapsulation dot1Q 108
 ip address 192.168.108.254 255.255.255.0
 ip helper-address 192.168.90.11
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
end
! write memory
