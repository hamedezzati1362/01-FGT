! ===== MINI-SW : BASE (lab-only, sample password) =====
hostname MINI-SW
service timestamps log datetime msec
service timestamps debug datetime msec
no ip domain-lookup
ip domain-name lab.local
enable secret Lab-Only-123
username netadmin privilege 15 secret Lab-Only-123
!
vtp domain lab.local
vtp mode transparent
vtp version 2
vtp password Lab-Only-123
!
spanning-tree mode pvst
!
ip access-list standard VTY-ACL
 permit 192.168.100.0 0.0.0.255
 permit 192.168.102.0 0.0.0.255
 permit 192.168.90.0 0.0.0.255
!
banner motd # LAB ONLY - authorized use #
!
interface range GigabitEthernet0/0 - 3
 switchport mode access
 switchport access vlan 107
 no shutdown
!
!
interface Vlan100
 description MGMT-MINI
 ip address 192.168.100.99 255.255.255.0
 no shutdown
no ip routing
ip default-gateway 192.168.100.254
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 access-class VTY-ACL in
 login local
 transport input ssh
 exec-timeout 30 0
!
! generate the SSH key AFTER hostname/domain are set (takes ~10 s):
crypto key generate rsa modulus 2048
ip ssh version 2
end
! write memory
