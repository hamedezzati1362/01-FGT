! ===== DIST : BASE (lab-only, sample password) =====
hostname DIST
service timestamps log datetime msec
service timestamps debug datetime msec
no ip domain-lookup
ip domain-name lab.local
enable secret Lab-Only-123
username netadmin privilege 15 secret Lab-Only-123
!
vtp domain lab.local
vtp mode client
vtp version 2
vtp password Lab-Only-123
!
spanning-tree mode pvst
!
ip access-list standard VTY-ACL
 permit 192.168.100.0 0.0.0.255
 permit 192.168.102.0 0.0.0.255
 permit 192.168.90.0 0.0.0.255
!
banner motd # LAB ONLY - authorized use #
!
interface GigabitEthernet0/0
 description UP-CORE-Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 2,90,97,100-105,107-108
 no shutdown
interface GigabitEthernet0/1
 description DN-ACC1-Gi0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 2,90,97,100-105,107-108
 no shutdown
interface GigabitEthernet0/2
 description DN-ACC2-Gi0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 2,90,97,100-105,107-108
 no shutdown
interface GigabitEthernet0/3
 description DN-ACC3-Gi0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 2,90,97,100-105,107-108
 no shutdown
interface GigabitEthernet1/0
 description SRV1-DHCP-TFTP
 switchport mode access
 switchport access vlan 90
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/1
 description DISABLED
 switchport mode access
 switchport access vlan 90
 shutdown
interface GigabitEthernet1/2
 description DISABLED
 switchport mode access
 switchport access vlan 90
 shutdown
interface GigabitEthernet1/3
 description DISABLED
 switchport mode access
 switchport access vlan 90
 shutdown
!
interface Vlan100
 description MGMT-DIST
 ip address 192.168.100.2 255.255.255.0
 no shutdown
no ip routing
ip default-gateway 192.168.100.254
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 access-class VTY-ACL in
 login local
 transport input ssh
 exec-timeout 30 0
!
! generate the SSH key AFTER hostname/domain are set (takes ~10 s):
crypto key generate rsa modulus 2048
ip ssh version 2
end
! write memory
