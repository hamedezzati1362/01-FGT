<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="sans-serif" font-size="13"><rect width="700" height="340" fill="#ffffff" stroke="#888"/><text x="16" y="26" fill="#111" font-size="15" font-weight="bold" text-anchor="start">FGCP HA: heartbeat, sync and split-brain</text><rect x="60" y="50" width="170" height="60" rx="6" fill="#e6f4ea" stroke="#335"/><text x="145" y="80" text-anchor="middle" fill="#111">FGT-1 (Primary)</text><text x="145" y="96" text-anchor="middle" fill="#111" font-size="11">priority 200</text><rect x="500" y="50" width="170" height="60" rx="6" fill="#e8f0fe" stroke="#335"/><text x="585" y="80" text-anchor="middle" fill="#111">FGT-2 (Secondary)</text><text x="585" y="96" text-anchor="middle" fill="#111" font-size="11">priority 100</text><line x1="230" y1="70" x2="500" y2="70" stroke="#222" stroke-width="2"/><polygon points="500,70 491,73 491,66" fill="#222"/><text x="365" y="64" text-anchor="middle" fill="#111" font-size="11">heartbeat + config/session sync (TCP/UDP 703)</text><line x1="500" y1="95" x2="230" y2="95" stroke="#222" stroke-width="2"/><polygon points="230,95 238,91 238,98" fill="#222"/><rect x="60" y="150" width="170" height="40" rx="6" fill="#fff7e0" stroke="#335"/><text x="145" y="175" text-anchor="middle" fill="#111">port1 / port2 monitored</text><rect x="500" y="150" width="170" height="40" rx="6" fill="#fff7e0" stroke="#335"/><text x="585" y="175" text-anchor="middle" fill="#111">port1 / port2 monitored</text><text x="16" y="222" fill="#111" font-size="12" text-anchor="start">Election (default): monitored ports -> uptime -> priority -> serial   (override: priority before uptime)  [details Unverified]</text><rect x="60" y="240" width="610" height="56" rx="6" fill="#fde8e8" stroke="#335"/><text x="365" y="268" text-anchor="middle" fill="#111">Split-brain: heartbeat lost but both units alive -> both become Primary</text><text x="365" y="284" text-anchor="middle" fill="#111" font-size="11">duplicate MAC/IP, conflicting sessions. Prevent: redundant back-to-back heartbeat links</text><text x="16" y="320" fill="#111" font-size="12" text-anchor="start">HA protects against device failure, not against ISP failure (use SD-WAN / link health checks).</text></svg>