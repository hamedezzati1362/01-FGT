</style><rect x="0" y="0" width="720" height="240" fill="#ffffff"/><rect class="net" height="56" rx="8" width="200" x="40" y="30"></rect><text class="on" text-anchor="middle" x="140" y="56">Management plane</text><text class="cap" text-anchor="middle" x="140" y="72">SSH, AAA, SNMP, logs</text><rect class="hst" height="56" rx="8" width="200" x="260" y="30"></rect><text class="on" text-anchor="middle" x="360" y="56">Control plane</text><text class="cap" text-anchor="middle" x="360" y="72">OSPF, STP, HSRP</text><rect class="wrn" height="56" rx="8" width="200" x="480" y="30"></rect><text class="on" text-anchor="middle" x="580" y="56">Data plane</text><text class="cap" text-anchor="middle" x="580" y="72">user traffic</text><rect class="bx" height="60" rx="8" width="460" x="130" y="150"></rect><text text-anchor="middle" x="360" y="178">Hardening = protect each plane</text><text class="cap" text-anchor="middle" x="360" y="194">least privilege, disable unused, log everything</text></svg>