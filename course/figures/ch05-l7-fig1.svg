<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="sans-serif" font-size="13"><rect width="760" height="230" fill="#ffffff" stroke="#888"/><text x="16" y="26" fill="#111" font-size="15" font-weight="bold" text-anchor="start">Convergence = Detect + Propagate + Compute + Install</text><rect x="16" y="50" width="300" height="56" rx="6" fill="#fde8e8" stroke="#335"/><text x="166" y="78" text-anchor="middle" fill="#111">Detect</text><text x="166" y="94" text-anchor="middle" fill="#111" font-size="11">dead timer 40 s / BFD under 1 s</text><rect x="326" y="50" width="130" height="56" rx="6" fill="#e8f0fe" stroke="#335"/><text x="391" y="78" text-anchor="middle" fill="#111">Propagate</text><text x="391" y="94" text-anchor="middle" fill="#111" font-size="11">LSA flood / BGP update</text><rect x="466" y="50" width="130" height="56" rx="6" fill="#e6f4ea" stroke="#335"/><text x="531" y="78" text-anchor="middle" fill="#111">Compute</text><text x="531" y="94" text-anchor="middle" fill="#111" font-size="11">SPF / best-path</text><rect x="606" y="50" width="130" height="56" rx="6" fill="#fff7e0" stroke="#335"/><text x="671" y="78" text-anchor="middle" fill="#111">Install</text><text x="671" y="94" text-anchor="middle" fill="#111" font-size="11">RIB -> FIB</text><text x="16" y="140" fill="#111" font-size="12" text-anchor="start">Detect usually dominates. A layer-2 switch between routers hides link failure: only the dead timer or BFD detects it.</text><text x="16" y="164" fill="#111" font-size="12" text-anchor="start">Default OSPF: hello 10 s, dead 40 s  |  BFD 300 ms x 3 = 0.9 s</text><text x="16" y="200" fill="#111" font-size="12" text-anchor="start">Black hole: from failure until detection. Micro-loop: during transition when routers update at different times.</text></svg>