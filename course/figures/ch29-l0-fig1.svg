<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" font-family="sans-serif" font-size="13"><rect width="780" height="170" fill="#ffffff" stroke="#888"/><text x="16" y="26" fill="#111" font-size="15" font-weight="bold" text-anchor="start">Incident response lifecycle (NIST SP 800-61)</text><rect x="16" y="60" width="115" height="50" rx="6" fill="#e8f0fe" stroke="#335"/><text x="73" y="90" text-anchor="middle" fill="#111">Preparation</text><line x1="131" y1="85" x2="141" y2="85" stroke="#222" stroke-width="2"/><polygon points="141,85 132,88 132,81" fill="#222"/><rect x="141" y="60" width="115" height="50" rx="6" fill="#fff7e0" stroke="#335"/><text x="198" y="90" text-anchor="middle" fill="#111">Detection / Analysis</text><line x1="256" y1="85" x2="266" y2="85" stroke="#222" stroke-width="2"/><polygon points="266,85 257,88 257,81" fill="#222"/><rect x="266" y="60" width="115" height="50" rx="6" fill="#fde8e8" stroke="#335"/><text x="323" y="90" text-anchor="middle" fill="#111">Containment</text><line x1="381" y1="85" x2="391" y2="85" stroke="#222" stroke-width="2"/><polygon points="391,85 382,88 382,81" fill="#222"/><rect x="391" y="60" width="115" height="50" rx="6" fill="#fde8e8" stroke="#335"/><text x="448" y="90" text-anchor="middle" fill="#111">Eradication</text><line x1="506" y1="85" x2="516" y2="85" stroke="#222" stroke-width="2"/><polygon points="516,85 507,88 507,81" fill="#222"/><rect x="516" y="60" width="115" height="50" rx="6" fill="#e6f4ea" stroke="#335"/><text x="573" y="90" text-anchor="middle" fill="#111">Recovery</text><line x1="631" y1="85" x2="641" y2="85" stroke="#222" stroke-width="2"/><polygon points="641,85 632,88 632,81" fill="#222"/><rect x="641" y="60" width="115" height="50" rx="6" fill="#e8f0fe" stroke="#335"/><text x="698" y="90" text-anchor="middle" fill="#111">Lessons learned</text><text x="16" y="150" fill="#111" font-size="12" text-anchor="start">Preserve evidence before containment. Lessons learned feed back into preparation (new playbooks, controls).</text></svg>