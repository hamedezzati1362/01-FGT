<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 250" font-family="sans-serif" font-size="13"><rect width="810" height="250" fill="#ffffff" stroke="#888"/><text x="16" y="26" fill="#111" font-size="15" font-weight="bold" text-anchor="start">Two-firewall sandwich with DMZ</text><rect x="16" y="60" width="110" height="50" rx="6" fill="#fde8e8" stroke="#335"/><text x="71" y="90" text-anchor="middle" fill="#111">Internet</text><rect x="176" y="60" width="120" height="50" rx="6" fill="#fff7e0" stroke="#335"/><text x="236" y="85" text-anchor="middle" fill="#111">FW-EDGE</text><text x="236" y="101" text-anchor="middle" fill="#111" font-size="11">VIP, SNAT, IPS</text><rect x="346" y="60" width="130" height="50" rx="6" fill="#e8f0fe" stroke="#335"/><text x="411" y="90" text-anchor="middle" fill="#111">DMZ switch</text><rect x="526" y="60" width="120" height="50" rx="6" fill="#fff7e0" stroke="#335"/><text x="586" y="85" text-anchor="middle" fill="#111">FW-INT</text><text x="586" y="101" text-anchor="middle" fill="#111" font-size="11">no NAT</text><rect x="690" y="60" width="100" height="50" rx="6" fill="#e6f4ea" stroke="#335"/><text x="740" y="90" text-anchor="middle" fill="#111">Internal LAN</text><line x1="126" y1="85" x2="176" y2="85" stroke="#222" stroke-width="2"/><polygon points="176,85 167,88 167,81" fill="#222"/><line x1="296" y1="85" x2="346" y2="85" stroke="#222" stroke-width="2"/><polygon points="346,85 337,88 337,81" fill="#222"/><line x1="476" y1="85" x2="526" y2="85" stroke="#222" stroke-width="2"/><polygon points="526,85 517,88 517,81" fill="#222"/><line x1="646" y1="85" x2="690" y2="85" stroke="#222" stroke-width="2"/><polygon points="690,85 681,88 681,81" fill="#222"/><rect x="346" y="150" width="130" height="44" rx="6" fill="#e8f0fe" stroke="#335"/><text x="411" y="177" text-anchor="middle" fill="#111">web / mail / proxy</text><line x1="411" y1="110" x2="411" y2="150" stroke="#222" stroke-width="2"/><polygon points="411,150 407,141 414,141" fill="#222"/><text x="16" y="230" fill="#111" font-size="12" text-anchor="start">No direct Internet -> Internal path. DMZ -> Internal only on required ports. Keep replies on the same path (symmetric).</text></svg>