<svg xmlns="http://www.w3.org/2000/svg" aria-label="send decision flow" role="img" viewBox="0 0 720 330"><style>
text{font-family:Tahoma,Arial,sans-serif;font-size:13px;fill:#1b2430}
.cap{font-size:12px;fill:#5b687a}
.bx{fill:#eef2f8;stroke:#9aa7b8}
.net{fill:#7fb8f2}.hst{fill:#8fdcb8}.wrn{fill:#f3cf7a}
.on{fill:#0b1018;font-weight:700}
.ln{stroke:#5b687a;stroke-width:1.6;fill:none}
.rq{stroke:#1d6fd8;stroke-width:2.2;fill:none}.rp{stroke:#0f9d6b;stroke-width:2.2;fill:none}
text.on+text.cap{fill:#0b1018}
</style><rect x="0" y="0" width="720" height="330" fill="#ffffff"/><rect class="bx" height="44" rx="8" width="220" x="250" y="10"></rect><text text-anchor="middle" x="360" y="37">Host wants to send a packet</text><path class="ln" d="M360 54 V80"></path><rect class="wrn" height="52" rx="8" width="260" x="230" y="80"></rect><text class="on" text-anchor="middle" x="360" y="103">Destination in my subnet?</text><text class="cap" text-anchor="middle" x="360" y="119">IP AND Mask = same network ?</text><path class="rp" d="M230 106 H120 V150"></path><text class="cap" x="150" y="98">YES</text><path class="rq" d="M490 106 H600 V150"></path><text class="cap" x="540" y="98">NO</text><rect class="hst" height="56" rx="8" width="200" x="20" y="150"></rect><text class="on" text-anchor="middle" x="120" y="175">ARP for destination MAC</text><text class="cap" text-anchor="middle" x="120" y="191">then send directly</text><rect class="wrn" height="52" rx="8" width="200" x="500" y="150"></rect><text class="on" text-anchor="middle" x="600" y="181">Default Gateway set?</text><path class="ln" d="M600 202 V232"></path><path class="rq" d="M500 176 H430 V250"></path><text class="cap" x="460" y="168">YES</text><text class="cap" x="612" y="222">NO</text><rect class="net" height="56" rx="8" width="200" x="330" y="250"></rect><text class="on" text-anchor="middle" x="430" y="275">ARP for gateway MAC</text><text class="cap" text-anchor="middle" x="430" y="291">send to gateway (router)</text><rect class="bx" height="56" rx="8" width="150" x="560" y="232"></rect><text text-anchor="middle" x="635" y="257">No route</text><text class="cap" text-anchor="middle" x="635" y="273">send fails</text></svg>