<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" font-family="sans-serif" font-size="13"><rect width="780" height="290" fill="#ffffff" stroke="#888"/><text x="16" y="26" fill="#111" font-size="15" font-weight="bold" text-anchor="start">BGP best-path (Cisco IOS): first deciding step wins</text><rect x="16" y="48" width="236" height="52" rx="6" fill="#e8f0fe" stroke="#335"/><text x="134" y="79" text-anchor="middle" fill="#111">1 Weight (highest, local)</text><rect x="266" y="48" width="236" height="52" rx="6" fill="#e8f0fe" stroke="#335"/><text x="384" y="79" text-anchor="middle" fill="#111">2 Local-Pref (highest, AS-wide)</text><rect x="516" y="48" width="236" height="52" rx="6" fill="#e8f0fe" stroke="#335"/><text x="634" y="79" text-anchor="middle" fill="#111">3 Locally originated</text><rect x="16" y="118" width="236" height="52" rx="6" fill="#e8f0fe" stroke="#335"/><text x="134" y="149" text-anchor="middle" fill="#111">4 AS_PATH (shortest)</text><rect x="266" y="118" width="236" height="52" rx="6" fill="#e8f0fe" stroke="#335"/><text x="384" y="149" text-anchor="middle" fill="#111">5 Origin (IGP, EGP, incomplete)</text><rect x="516" y="118" width="236" height="52" rx="6" fill="#e8f0fe" stroke="#335"/><text x="634" y="149" text-anchor="middle" fill="#111">6 MED (lowest, same neighbor AS)</text><rect x="16" y="188" width="236" height="52" rx="6" fill="#fff7e0" stroke="#335"/><text x="134" y="219" text-anchor="middle" fill="#111">7 eBGP over iBGP</text><rect x="266" y="188" width="236" height="52" rx="6" fill="#fff7e0" stroke="#335"/><text x="384" y="219" text-anchor="middle" fill="#111">8 Lowest IGP metric to next hop</text><rect x="516" y="188" width="236" height="52" rx="6" fill="#fff7e0" stroke="#335"/><text x="634" y="219" text-anchor="middle" fill="#111">9 Oldest / Router-ID / neighbor addr</text><text x="16" y="270" fill="#111" font-size="12" text-anchor="start">Blue: documented order in Cisco guide. Yellow: later tie-breakers vary by platform (Unverified).</text></svg>