<svg xmlns="http://www.w3.org/2000/svg" aria-label="troubleshooting ladder" role="img" viewBox="0 0 720 250"><style>
text{font-family:Tahoma,Arial,sans-serif;font-size:13px;fill:#1b2430}
.cap{font-size:12px;fill:#5b687a}
.bx{fill:#eef2f8;stroke:#9aa7b8}
.net{fill:#7fb8f2}.hst{fill:#8fdcb8}.wrn{fill:#f3cf7a}
.on{fill:#0b1018;font-weight:700}
.ln{stroke:#5b687a;stroke-width:1.6;fill:none}
.rq{stroke:#1d6fd8;stroke-width:2.2;fill:none}.rp{stroke:#0f9d6b;stroke-width:2.2;fill:none}
text.on+text.cap{fill:#0b1018}
</style><rect x="0" y="0" width="720" height="250" fill="#ffffff"/><rect class="net" height="44" rx="8" width="160" x="30" y="20"></rect><text class="on" text-anchor="middle" x="110" y="47">L1 Physical</text><text class="cap" x="210" y="37">link up? cable, port shutdown</text><text x="210" y="54">show interfaces status</text><rect class="net" height="44" rx="8" width="160" x="30" y="75"></rect><text class="on" text-anchor="middle" x="110" y="102">L2 Data-link</text><text class="cap" x="210" y="92">VLAN, trunk, MAC</text><text x="210" y="109">show vlan brief / trunk / mac</text><rect class="hst" height="44" rx="8" width="160" x="30" y="130"></rect><text class="on" text-anchor="middle" x="110" y="157">L3 Network</text><text class="cap" x="210" y="147">IP, mask, gateway, route</text><text x="210" y="164">show ip int brief / route</text><rect class="wrn" height="44" rx="8" width="160" x="30" y="185"></rect><text class="on" text-anchor="middle" x="110" y="212">L4+ Service</text><text class="cap" x="210" y="202">port, firewall, app</text><text x="210" y="219">telnet/ssh test, logs</text></svg>