<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 372" font-family="sans-serif" font-size="13"><rect width="730" height="372" fill="#ffffff" stroke="#888"/><text x="16" y="26" fill="#111" font-size="15" font-weight="bold" text-anchor="start">IKEv2 negotiation (simplified)</text><rect x="60" y="44" width="150" height="40" rx="6" fill="#e8f0fe" stroke="#335"/><text x="135" y="69" text-anchor="middle" fill="#111">Initiator (FGT-A)</text><rect x="520" y="44" width="150" height="40" rx="6" fill="#e8f0fe" stroke="#335"/><text x="595" y="69" text-anchor="middle" fill="#111">Responder (FGT-B)</text><line x1="135" y1="84" x2="135" y2="330" stroke="#888" stroke-dasharray="4"/><line x1="595" y1="84" x2="595" y2="330" stroke="#888" stroke-dasharray="4"/><line x1="135" y1="110" x2="595" y2="110" stroke="#222" stroke-width="2"/><polygon points="595,110 586,113 586,106" fill="#222"/><text x="365" y="104" fill="#111" font-size="11" text-anchor="middle">IKE_SA_INIT: proposals, DH public, nonce</text><line x1="595" y1="150" x2="135" y2="150" stroke="#222" stroke-width="2"/><polygon points="135,150 143,146 143,153" fill="#222"/><text x="365" y="144" fill="#111" font-size="11" text-anchor="middle">IKE_SA_INIT response: chosen proposal, DH, nonce</text><line x1="135" y1="190" x2="595" y2="190" stroke="#222" stroke-width="2"/><polygon points="595,190 586,193 586,186" fill="#222"/><text x="365" y="184" fill="#111" font-size="11" text-anchor="middle">IKE_AUTH: identity, auth (PSK/cert), child proposal + selectors</text><line x1="595" y1="230" x2="135" y2="230" stroke="#222" stroke-width="2"/><polygon points="135,230 143,226 143,233" fill="#222"/><text x="365" y="224" fill="#111" font-size="11" text-anchor="middle">IKE_AUTH response: auth, chosen child proposal, selectors</text><line x1="135" y1="280" x2="595" y2="280" stroke="#222" stroke-width="2"/><polygon points="595,280 586,283 586,276" fill="#222"/><text x="365" y="274" fill="#111" font-size="11" text-anchor="middle">ESP traffic (UDP 4500 if NAT-T) / rekey: CREATE_CHILD_SA (+PFS DH)</text><text x="16" y="350" fill="#111" font-size="12" text-anchor="start">Typical failures: NO_PROPOSAL_CHOSEN (proposal/DH), AUTH_FAILED (PSK/cert/ID), TS_UNACCEPTABLE (selectors).</text></svg>