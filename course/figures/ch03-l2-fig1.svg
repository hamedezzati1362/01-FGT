<svg xmlns="http://www.w3.org/2000/svg" aria-label="vlan on one switch" role="img" viewBox="0 0 720 260"><style>
text{font-family:Tahoma,Arial,sans-serif;font-size:13px;fill:#1b2430}
.cap{font-size:12px;fill:#5b687a}
.bx{fill:#eef2f8;stroke:#9aa7b8}
.net{fill:#7fb8f2}.hst{fill:#8fdcb8}.wrn{fill:#f3cf7a}
.on{fill:#0b1018;font-weight:700}
.ln{stroke:#5b687a;stroke-width:1.6;fill:none}
.rq{stroke:#1d6fd8;stroke-width:2.2;fill:none}.rp{stroke:#0f9d6b;stroke-width:2.2;fill:none}
text.on+text.cap{fill:#0b1018}
</style><rect x="0" y="0" width="720" height="260" fill="#ffffff"/><rect class="bx" height="90" rx="10" width="460" x="130" y="20"></rect><text text-anchor="middle" x="360" y="42">One physical switch (SW1)</text><rect class="net" height="42" rx="6" width="100" x="150" y="55"></rect><text class="on" text-anchor="middle" x="200" y="81">Gi0/1</text><rect class="net" height="42" rx="6" width="100" x="290" y="55"></rect><text class="on" text-anchor="middle" x="340" y="81">Gi0/2</text><rect class="hst" height="42" rx="6" width="100" x="430" y="55"></rect><text class="on" text-anchor="middle" x="480" y="81">Gi0/3</text><rect class="hst" height="42" rx="6" width="40" x="540" y="55"></rect><text class="on" text-anchor="middle" x="560" y="81">Gi0/4</text><text class="cap" text-anchor="middle" x="200" y="130">VLAN 20</text><text class="cap" text-anchor="middle" x="340" y="130">VLAN 20</text><text class="cap" text-anchor="middle" x="480" y="130">VLAN 30</text><text class="cap" text-anchor="middle" x="560" y="130">VLAN 30</text><rect class="net" height="44" rx="8" width="80" x="150" y="170"></rect><text class="on" text-anchor="middle" x="190" y="198">PC1</text><path class="ln" d="M190 170 V100"></path><rect class="net" height="44" rx="8" width="80" x="290" y="170"></rect><text class="on" text-anchor="middle" x="330" y="198">PC2</text><path class="ln" d="M330 170 V100"></path><rect class="hst" height="44" rx="8" width="80" x="430" y="170"></rect><text class="on" text-anchor="middle" x="470" y="198">Srv1</text><path class="ln" d="M470 170 V100"></path><rect class="hst" height="44" rx="8" width="80" x="530" y="170"></rect><text class="on" text-anchor="middle" x="570" y="198">Srv2</text><path class="ln" d="M570 170 V100"></path><text class="cap" text-anchor="middle" x="360" y="245">PC1 and PC2 talk freely. PC1 and Srv1 cannot, without a router.</text></svg>