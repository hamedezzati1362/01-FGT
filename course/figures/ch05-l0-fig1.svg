<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="14">
<rect width="760" height="330" fill="#ffffff" stroke="#888"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111">Control Plane vs Data Plane</text>
<rect x="20" y="45" width="330" height="120" fill="#e8f0fe" stroke="#335" />
<text x="30" y="68" fill="#111" font-weight="bold">Control Plane (CPU, slow, smart)</text>
<text x="30" y="92" fill="#111">OSPF / BGP / Static / ARP</text>
<text x="30" y="114" fill="#111">builds RIB (best routes)</text>
<text x="30" y="136" fill="#111">RIB -> FIB + Adjacency</text>
<rect x="410" y="45" width="330" height="120" fill="#e6f4ea" stroke="#353"/>
<text x="420" y="68" fill="#111" font-weight="bold">Data Plane (fast path)</text>
<text x="420" y="92" fill="#111">1. receive frame, strip L2</text>
<text x="420" y="114" fill="#111">2. FIB lookup (LPM)  3. adjacency</text>
<text x="420" y="136" fill="#111">4. TTL-1  5. new L2 header, send</text>
<line x1="350" y1="105" x2="410" y2="105" stroke="#222" stroke-width="2"/>
<polygon points="410,105 400,100 400,110" fill="#222"/>
<text x="352" y="98" fill="#111" font-size="12">tables</text>
<rect x="20" y="200" width="720" height="90" fill="#fff7e0" stroke="#a80"/>
<text x="30" y="224" fill="#111" font-weight="bold">Punt: packets for the router itself go to the CPU</text>
<text x="30" y="248" fill="#111">SSH, OSPF Hello, BGP, ICMP to router, TTL=1, ARP glean</text>
<text x="30" y="270" fill="#111">-> protect with ACL on VTY and CoPP</text>
<line x1="575" y1="165" x2="575" y2="200" stroke="#a80" stroke-width="2"/>
</svg>