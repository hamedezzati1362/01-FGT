<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="sans-serif" font-size="13">
<rect width="860" height="260" fill="#ffffff" stroke="#888"/>
<text x="16" y="24" font-weight="bold" font-size="15" fill="#111">FortiGate transit packet: logical order</text>
<g fill="#111" stroke="#335" stroke-width="1">
<rect x="14" y="50" width="92" height="60" fill="#e8f0fe"/><rect x="116" y="50" width="92" height="60" fill="#e8f0fe"/><rect x="218" y="50" width="92" height="60" fill="#fff7e0"/><rect x="320" y="50" width="92" height="60" fill="#e6f4ea"/><rect x="422" y="50" width="92" height="60" fill="#e6f4ea"/><rect x="524" y="50" width="104" height="60" fill="#fde8e8"/><rect x="638" y="50" width="92" height="60" fill="#fff7e0"/><rect x="740" y="50" width="106" height="60" fill="#e8f0fe"/></g>
<g fill="#111" text-anchor="middle">
<text x="60" y="76">1 Ingress</text><text x="60" y="94" font-size="11">+ RPF check</text>
<text x="162" y="76">2 Session</text><text x="162" y="94" font-size="11">lookup</text>
<text x="264" y="76">3 DNAT</text><text x="264" y="94" font-size="11">(VIP)</text>
<text x="366" y="76">4 Route</text><text x="366" y="94" font-size="11">lookup</text>
<text x="468" y="76">5 Policy</text><text x="468" y="94" font-size="11">first match</text>
<text x="576" y="76">6 Profiles</text><text x="576" y="94" font-size="11">AV IPS Web SSL</text>
<text x="684" y="76">7 SNAT</text><text x="684" y="94" font-size="11">+ session</text>
<text x="793" y="76">8 Egress</text><text x="793" y="94" font-size="11">ARP, send</text></g>
<g stroke="#222" stroke-width="2" fill="#222"><line x1="106" y1="80" x2="116" y2="80"/><line x1="208" y1="80" x2="218" y2="80"/><line x1="310" y1="80" x2="320" y2="80"/><line x1="412" y1="80" x2="422" y2="80"/><line x1="514" y1="80" x2="524" y2="80"/><line x1="628" y1="80" x2="638" y2="80"/><line x1="730" y1="80" x2="740" y2="80"/></g>
<text x="16" y="150" fill="#111">Existing session (step 2 hit): skips DNAT, route and policy; uses stored NAT and profile state.</text>
<text x="16" y="176" fill="#111">No policy match at step 5: implicit deny (policy id 0). Route and policy are two separate decisions.</text>
<text x="16" y="202" fill="#111">Policy sees destination AFTER DNAT and source BEFORE SNAT.</text>
<text x="16" y="228" fill="#111">Version note: order verified against FortiOS 7.0 packet-flow debug docs; details Unverified on the lab image.</text>
</svg>