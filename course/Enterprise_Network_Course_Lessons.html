<h2><span class="hn">۱.</span> مشکل: همه با همه</h2>
<p>فرض کنید ۵ روتر روی یک سوییچ هستند. اگر هر روتر با هر روتر دیگر «همسایه‌ی کامل» (Full) شود، تعداد Adjacency می‌شود:</p>
<pre><code>n routers, full mesh adjacencies = n x (n - 1) / 2
n = 5  -> 5 x 4 / 2   = 10
n = 10 -> 10 x 9 / 2  = 45</code></pre>
<p>و هر تغییر، همه را درگیر می‌کند. راه‌حل: یک «سخنگو» انتخاب کنیم.</p>
<h2><span class="hn">۲.</span> DR و BDR</h2>
<p>روی هر شبکه‌ی Broadcast (مثل اترنت) OSPF یک <b>DR</b> و یک <b>BDR</b> انتخاب می‌کند. هر روتر فقط با DR و BDR به حالت Full می‌رسد؛ با بقیه‌ی روترها (DROther) فقط تا 2-Way می‌ماند و این کاملاً طبیعی است.</p>

<h3>انتخاب DR</h3>
<ol>
<li>بالاترین Priority (پیش‌فرض ۱؛ ۰ یعنی هرگز DR نشو).</li>
<li>اگر برابر بود، بالاترین Router ID.</li>
</ol>
<div class="box"><b class="t">نکته‌ی مهم</b>انتخاب DR «غیرقابل‌پس‌گرفتن» است (Non-preemptive): اگر روتری با Priority بالاتر بعد از انتخاب وارد شود، DR فعلی کنار نمی‌رود، تا زمانی که OSPF Process دوباره راه بیفتد.</div>
<pre><code>R2(config)# interface gi0/0
R2(config-if)# ip ospf priority 100
R1(config)# interface gi0/0
R1(config-if)# ip ospf priority 0      ! never become DR
R1# clear ip ospf process               ! re-run the election (careful)</code></pre>
<h2><span class="hn">۳.</span> Network Type</h2>
<p>روی لینک نقطه‌به‌نقطه (فقط دو روتر)، DR بی‌معنی است. با تغییر نوع به point-to-point، DR انتخاب نمی‌شود و همگرایی هم سریع‌تر است:</p>
<table>
<tr><th>نوع</th><th>DR؟</th><th>Hello/Dead</th><th>کاربرد</th></tr>
<tr><td>broadcast (اترنت)</td><td>بله</td><td>10/40</td><td>پیش‌فرض اترنت</td></tr>
<tr><td>point-to-point</td><td>خیر</td><td>10/40</td><td>لینک دو روتر (توصیه)</td></tr>
<tr><td>non-broadcast</td><td>بله</td><td>30/120</td><td>Frame Relay قدیمی</td></tr>
</table>
<pre><code>R1(config)# interface gi0/1
R1(config-if)# ip ospf network point-to-point
R2(config)# interface gi0/0
R2(config-if)# ip ospf network point-to-point   ! both ends the same</code></pre>
<p>اگر یک سر broadcast و سر دیگر point-to-point باشد، همسایگی بالا می‌آید ولی Routeها نامعتبر می‌شود (مشکل رایج). همیشه دو سر را هم‌نوع کنید.</p>
<h2><span class="hn">۴.</span> تنظیم Cost برای هدایت ترافیک</h2>
<pre><code>R1(config)# interface gi0/1
R1(config-if)# ip ospf cost 50
Cost = Reference / bandwidth, or any manual value 1..65535
SPF picks the path with the lowest TOTAL cost</code></pre>
<p>مثال: دو مسیر به یک مقصد داریم؛ لینک ۱ گیگی (Cost 10) و لینک پشتیبان ۱۰۰ مگی (Cost 100). روتر مسیر ۱ گیگ را انتخاب می‌کند. اگر بخواهید پشتیبان نباشد، با Cost دستی مسیر را عوض کنید.</p>
<h2><span class="hn">۵.</span> سرعت شناسایی قطع</h2>
<p>با تایمر پیش‌فرض (Dead = 40 ثانیه)، قطع یک همسایه تا ۴۰ ثانیه دیر شناخته می‌شود. دو راه: کاهش Hello/Dead (تا ۱ ثانیه با <code>fast-hello</code>) یا BFD که در میلی‌ثانیه تشخیص می‌دهد. BFD فقط مفهومی و Unverified در Lab ماست.</p>
<pre><code>R1(config-if)# ip ospf hello-interval 1
R1(config-if)# ip ospf dead-interval 4
(both ends must match; too aggressive timers cause flapping)</code></pre>

<h2><span class="hn">۱.</span> چرا Area؟</h2>
<p>یک شهر بزرگ را به محله تقسیم می‌کنند؛ هر محله نقشه‌ی دقیق خودش را دارد و برای بقیه‌ی شهر فقط «خلاصه» می‌داند. OSPF هم همین‌طور: داخل هر Area نقشه‌ی کامل، و بین Areaها فقط خلاصه.</p>
<ul>
<li>تغییر لینک در یک Area فقط همان Area را به SPF می‌اندازد.</li>
<li>جدول LSDB کوچک‌تر می‌شود.</li>
<li>امکان خلاصه‌سازی مسیرها.</li>
</ul>
<h2><span class="hn">۲.</span> قانون مهم: همه‌ی Areaها به Area 0 وصل</h2>
<p>ترافیک بین دو Area معمولی باید از Area 0 (Backbone) بگذرد. Area 0 مثل بزرگراه مرکزی است و همه‌ی محله‌ها به آن راه دارند.</p>

<tr><td>ASBR</td><td>Route را از پروتکل/منبع دیگر وارد OSPF می‌کند (Static، BGP...)</td><td>تزریق Route خارجی</td></tr>

-> R2 has interfaces in area 1 and area 0 = ABR</code></pre>

<table>
<tr><th>نوع</th><th>نام</th><th>کجا پخش می‌شود</th><th>محتوا</th></tr>
<tr><td>1</td><td>Router LSA</td><td>داخل Area</td><td>لینک‌های یک روتر</td></tr>
<tr><td>2</td><td>Network LSA</td><td>داخل Area</td><td>Segment و روترهایش (توسط DR)</td></tr>
<tr><td>3</td><td>Summary LSA</td><td>بین Areaها (ABR)</td><td>Routeهای یک Area برای Area دیگر</td></tr>

<tr><td>5</td><td>External LSA</td><td>کل Domain</td><td>Route خارجی (از ASBR)</td></tr>
</table>
<p>در جدول مسیریابی: <code>O</code> یعنی Intra-area، <code>O IA</code> یعنی Inter-area (از LSA نوع ۳)، <code>O E1/E2</code> یعنی Route خارجی.</p>
<h2><span class="hn">۵.</span> خلاصه‌سازی در ABR</h2>
<p>ABR می‌تواند چند شبکه‌ی ریز یک Area را به یک خلاصه تبدیل کند:</p>
<pre><code>Area 1 networks: 10.1.0.0/24, 10.1.1.0/24, 10.1.2.0/24, 10.1.3.0/24
Summary: 10.1.0.0/22</code></pre>
<pre><code>R2(config)# router ospf 1
R2(config-router)# area 1 range 10.1.0.0 255.255.252.0</code></pre>
<p>اثر: بقیه‌ی Areaها فقط یک Route (10.1.0.0/22) می‌بینند؛ تغییر یک شبکه‌ی ریز دیگر در سراسر شبکه پخش نمی‌شود.</p>
<h2><span class="hn">۶.</span> Stub Area</h2>
<p>شعبه‌ای که فقط یک راه خروج دارد، نیازی ندارد همه‌ی Routeهای خارجی را بداند؛ کافی است یک Default Route از ABR بگیرد:</p>
<table>
<tr><th>نوع</th><th>Routeهای خارجی (LSA 5)</th><th>Default از ABR</th></tr>
<tr><td>Stub</td><td>بلوک</td><td>بله</td></tr>
<tr><td>Totally Stubby</td><td>بلوک (و Inter-area هم)</td><td>بله</td></tr>
<tr><td>NSSA</td><td>Routeهای خارجی محلی با LSA 7</td><td>اختیاری</td></tr>
</table>
<pre><code>! on all routers of the area:
R3(config-router)# area 2 stub
! totally stubby (only on the ABR add "no-summary"):
R2(config-router)# area 2 stub no-summary</code></pre>
<div class="box"><b class="t">قانون</b>همه‌ی روترهای یک Area باید نوع Stub یکسان داشته باشند (flag در Hello)، وگرنه همسایه نمی‌شوند.</div>
<h2><span class="hn">۷.</span> مثال‌ها</h2>
<h3>ساده: دو Area</h3>
<pre><code>R1 (area 1) -- R2 (ABR) -- R3 (area 0)
R3 shows: O IA 192.168.1.0/24 via R2</code></pre>
<h3>متوسط: چرا نمی‌شود Area 1 را مستقیم به Area 2 وصل کرد؟</h3>
<p>همه‌ی Areaها باید به Area 0 وصل باشند؛ بین Areaهای غیر صفر Routeها مستقیماً رد نمی‌شود (باید از ABR و Area 0 بگذرد). اگر Area 2 فقط به Area 1 وصل باشد، مسیرها به Area 2 نمی‌رسد؛ برای رفع، Virtual Link (مفهومی) یا طراحی مجدد.</p>
<h3>سخت: طراحی</h3>
<p>سازمان با مرکز و ۳ شعبه: Area 0 = مرکز، هر شعبه یک Area (۱ تا ۳)، ABR روی روتر مرز شعبه. خلاصه‌ی هر شعبه یک /22.</p>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): ABR چیست؟</summary><pre><code>A router with interfaces in two or more areas, one of which is area 0.</code></pre>
</details>
<details><summary>۲ (ساده): O IA یعنی؟</summary><pre><code>An inter-area route (from a type 3 LSA).</code></pre>
</details>
<details><summary>۳ (متوسط): خلاصه‌ی 10.1.4.0/24 تا 10.1.7.0/24؟</summary><pre><code>Third octet 4..7 -> block 4 -> 10.1.4.0/22</code></pre>
</details>
<details><summary>۴ (متوسط): چرا Stub باید روی همه‌ی روترهای Area باشد؟</summary><pre><code>The stub flag is carried in Hellos; a mismatch prevents adjacency.</code></pre>
</details>
<details><summary>۵ (سخت): مزیت Totally Stubby؟</summary><pre><code>Routers in the area keep only intra-area routes plus one default route, minimizing tables.</code></pre>
</details>

<h2><span class="hn">۱.</span> OSPFv3 چه فرقی دارد؟</h2>
<p>ایده‌ی OSPF همان است (Area، LSDB، SPF). تفاوت‌ها:</p>
<table>
<tr><th>موضوع</th><th>OSPFv2 (IPv4)</th><th>OSPFv3 (IPv6)</th></tr>
<tr><td>آدرس</td><td>IPv4</td><td>IPv6 (و با Address Family هر دو)</td></tr>
<tr><td>فعال‌سازی</td><td>دستور network</td><td>روی خود Interface (ipv6 ospf)</td></tr>
<tr><td>Router ID</td><td>از IPv4 Loopback</td><td>همچنان ۳۲ بیتی و باید دستی تنظیم شود</td></tr>
<tr><td>Next-hop</td><td>IP همسایه</td><td>Link-Local همسایه (fe80::)</td></tr>

<tr><td>Multicast</td><td>224.0.0.5/6</td><td>ff02::5 / ff02::6</td></tr>
</table>
<div class="box"><b class="t">نکته‌ی مهم</b>OSPFv3 حتی در شبکه‌ی «فقط IPv6» به یک Router ID ۳۲ بیتی (شکل IPv4) نیاز دارد. اگر روتر هیچ آدرس IPv4 نداشته باشد، باید دستی بدهید وگرنه فرایند بالا نمی‌آید.</div>
<h2><span class="hn">۲.</span> دستورها (خط‌به‌خط)</h2>
<p>ابتدا مسیریابی IPv6 را روشن کنید (درس ۲-۳). بعد روی روتر:</p>

R1(config-if)# ipv6 address 2001:db8:1::1/64
R1(config-if)# ipv6 ospf 1 area 0</code></pre>

<li><code>ipv6 router ospf 1</code>: Process (مثل v2، فقط محلی).</li>
<li><code>ipv6 ospf 1 area 0</code>: روی هر Interface (جایگزین network).</li>

<h2><span class="hn">۳.</span> Next-hop با Link-Local</h2>
<p>در جدول IPv6 Route، Next-hop آدرس Link-Local همسایه است (مثلاً FE80::2). چون Link-Local فقط روی همان لینک معنی دارد، Interface خروجی هم نوشته می‌شود:</p>
<pre><code>O   2001:db8:3::/64 [110/20]
     via FE80::2, GigabitEthernet0/1</code></pre>
<p>در Staticهای IPv6 هم اگر Next-hop را Link-Local بنویسید، باید Interface هم بدهید: <code>ipv6 route ... FE80::2 gi0/1</code>.</p>

<div class="meta"><span class="tag">هفته ۶ - روز ۴</span><span class="tag">پیش‌نیاز: درس ۳-۵</span><span class="tag">۶ ساعت</span></div>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> چطور برای Default Gateway هر VLAN «پشتیبان» بگذاریم: پروتکل <span class="en">HSRP</span> (و مقایسه با <span class="en">VRRP</span> و <span class="en">GLBP</span>)، آدرس مجازی، <span class="en">Priority</span>، <span class="en">Preempt</span> و <span class="en">Tracking</span>.</p>
<p><b>چرا لازم است:</b> Gateway نقطه‌ی شکست واحد (SPOF) است: اگر آن سوییچ یا روتر خاموش شود، تمام کاربران VLAN از شبکه بیرون می‌مانند حتی اگر روتر دوم سالم باشد، چون روی کلاینت‌ها فقط یک Gateway تنظیم شده است. FHRP این مشکل را حل می‌کند.</p>
<ul>
<li><b>در کار روزانه:</b> تقریباً همه‌ی Coreهای سازمانی HSRP یا VRRP دارند.</li>
<li><b>در امنیت:</b> Authentication HSRP جلوی تصاحب نقش Active توسط دستگاه جعلی را می‌گیرد.</li>
<li><b>در Capstone:</b> Lab A-HA از HSRP برای Gateway دوگانه استفاده می‌کند.</li>
</ul>
<div class="box"><b class="t">مسیر درس</b>مشکل Gateway واحد ← ایده‌ی آدرس مجازی ← انتخاب Active ← Preempt و Track ← مثال ساده/متوسط/سخت ← Lab ← عیب‌یابی.</div>
<h3>اصطلاحات این درس (مخفف ← شکل کامل ← معنی)</h3>
<table>
<tr><th>مخفف</th><th>شکل کامل انگلیسی</th><th>معنی فارسی</th></tr>
<tr><td>FHRP</td><td>First Hop Redundancy Protocol</td><td>خانواده‌ی پروتکل‌های پشتیبان Gateway</td></tr>
<tr><td>HSRP</td><td>Hot Standby Router Protocol</td><td>پروتکل سیسکو برای Gateway پشتیبان</td></tr>
<tr><td>VRRP</td><td>Virtual Router Redundancy Protocol</td><td>نسخه‌ی استاندارد</td></tr>
<tr><td>GLBP</td><td>Gateway Load Balancing Protocol</td><td>نسخه‌ی سیسکو با تقسیم بار</td></tr>
<tr><td>Virtual IP</td><td>Virtual IP (VIP)</td><td>آدرس مشترک که کلاینت به‌عنوان Gateway می‌گیرد</td></tr>
<tr><td>Active</td><td>Active router</td><td>روتری که ترافیک را عبور می‌دهد</td></tr>
<tr><td>Standby</td><td>Standby router</td><td>روتر آماده‌باش</td></tr>

</table>

<h2><span class="hn">۱.</span> مشکل: یک Gateway یعنی یک نقطه‌ی شکست</h2>
<p>کلاینت‌ها فقط یک Default Gateway دارند. اگر دو Core بگذارید ولی کلاینت‌ها به Core-1 اشاره کنند، با خاموشی Core-1 همه قطع می‌شوند، حتی با وجود Core-2.</p>
<p>مثال روزمره: یک شرکت که فقط یک شماره‌ی تلفن دارد و اگر منشی نباشد کسی جواب نمی‌دهد. راه‌حل: یک «شماره‌ی مشترک» که هر کدام از دو منشی حاضر باشند پاسخ می‌دهند.</p>
<h2><span class="hn">۲.</span> ایده‌ی HSRP</h2>
<p>دو (یا چند) روتر یک «روتر مجازی» می‌سازند با یک آدرس IP مجازی (VIP) و یک MAC مجازی. کلاینت‌ها VIP را به‌عنوان Gateway می‌گیرند. فقط یکی از روترها «Active» است و جواب ARP و ترافیک را می‌دهد. دیگری «Standby» است و Hello می‌شنود؛ اگر Active ساکت شد، فوراً Active می‌شود.</p>

<pre><code>Default hello = 3 s, hold = 10 s -> failover up to ~10 s
Tuned (hello 1, hold 3) -> failover ~3 s</code></pre>
<h2><span class="hn">۳.</span> انتخاب Active</h2>
<ol>
<li>بالاترین Priority (پیش‌فرض ۱۰۰).</li>
<li>اگر برابر بود، بالاترین IP روی Interface.</li>
</ol>
<div class="box"><b class="t">نکته‌ی مهم</b>پیش‌فرض Preempt خاموش است. اگر Core-1 (Priority بالاتر) خراب شود و بعد برگردد، نقش Active را پس نمی‌گیرد مگر اینکه <code>preempt</code> بزنید. معمولاً در طراحی می‌خواهیم Core اصلی دوباره Active شود، پس Preempt را روشن می‌کنیم.</div>
<h2><span class="hn">۴.</span> دستورها (خط‌به‌خط)</h2>
<pre><code>Core-1(config)# interface vlan 20
Core-1(config-if)# ip address 10.10.20.2 255.255.255.0
Core-1(config-if)# standby version 2
Core-1(config-if)# standby 20 ip 10.10.20.254
Core-1(config-if)# standby 20 priority 110
Core-1(config-if)# standby 20 preempt
Core-1(config-if)# standby 20 authentication md5 key-string &lt;KEY>

Core-2(config)# interface vlan 20
Core-2(config-if)# ip address 10.10.20.3 255.255.255.0
Core-2(config-if)# standby version 2
Core-2(config-if)# standby 20 ip 10.10.20.254
Core-2(config-if)# standby 20 priority 100
Core-2(config-if)# standby 20 preempt</code></pre>
<ul>
<li>هر Core آدرس واقعی خودش (.2 و .3) و یک VIP مشترک (.254) دارد.</li>
<li>شماره‌ی Group (اینجا 20) هم‌شماره‌ی VLAN انتخاب می‌شود تا خوانا باشد.</li>
<li>کلاینت‌ها Gateway را <b>.254</b> می‌گیرند، نه .2 یا .3.</li>
<li>کلید Authentication را در ریپو نگذارید؛ اینجا فقط جانگهدار است.</li>
</ul>
<pre><code>Core-1# show standby brief
Core-1# show standby vlan 20
Core-1# show standby</code></pre>
<pre><code>Interface   Grp  Pri P State   Active    Standby    Virtual IP
Vl20         20  110 P Active  local     10.10.20.3 10.10.20.254</code></pre>
<h2><span class="hn">۵.</span> Tracking: وقتی لینک بالادست خراب شد</h2>
<p>اگر Core-1 Active است ولی لینک اصلی‌اش به بیرون خراب شود، همچنان Active می‌ماند و ترافیک را «سیاه‌چاله» می‌کند. با Track، Priority را در صورت خرابی لینک کم می‌کنیم تا Core-2 بگیرد:</p>
<pre><code>Core-1(config)# track 10 interface gi0/3 line-protocol
Core-1(config)# interface vlan 20
Core-1(config-if)# standby 20 track 10 decrement 20
Effect: priority 110 - 20 = 90 &lt; 100 -> Core-2 becomes Active (needs preempt on Core-2)</code></pre>
<h2><span class="hn">۶.</span> VRRP و GLBP</h2>
<table>
<tr><th>پروتکل</th><th>تعریف</th><th>ویژگی</th></tr>
<tr><td>HSRP</td><td>سیسکو</td><td>یک Active؛ رایج در Cisco</td></tr>
<tr><td>VRRP</td><td>استاندارد RFC 5798</td><td>چند سازنده؛ مشابه HSRP (Master/Backup)</td></tr>
<tr><td>GLBP</td><td>سیسکو</td><td>چند Forwarder؛ تقسیم بار بین Gatewayها</td></tr>
</table>
<p>FortiGate از VRRP و FGCP (HA اختصاصی) پشتیبانی می‌کند. مفهوم همین است.</p>
<h2><span class="hn">۷.</span> مثال‌ها</h2>
<h3>ساده</h3>
<pre><code>Two cores, VIP .254, Core-1 priority 110 -> Active
PC gateway = .254 , ping works</code></pre>
<h3>متوسط: Failover</h3>
<pre><code>Core-1 shut down -> Core-2 becomes Active after hold time
PC keeps pinging with only a few lost packets</code></pre>
<h3>سخت: Failover بدون Track</h3>
<pre><code>Core-1 uplink fails but Core-1 stays Active (its VLAN interface is up)
Traffic is black-holed
Fix: track the uplink and decrement priority, or use routing protocol awareness</code></pre>
<div class="box"><b class="t">صادقانه درباره‌ی Lab</b>طبق Probe، «HSRP state» روی vIOSL2 تست شد و کار می‌کند. Failover واقعی (Virtual MAC) را با Capture بررسی کنید و اگر شبیه‌ساز رفتار متفاوتی داشت ثبت کنید.</div>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): VIP چیست؟</summary><pre><code>A shared virtual IP address used as the clients' default gateway.</code></pre>
</details>
<details><summary>۲ (ساده): Active چطور انتخاب می‌شود؟</summary><pre><code>Highest priority, then highest IP address.</code></pre>
</details>
<details><summary>۳ (متوسط): چرا Preempt؟</summary><pre><code>So the higher-priority router regains the Active role after it recovers.</code></pre>
</details>
<details><summary>۴ (متوسط): Failover پیش‌فرض چند ثانیه؟</summary><pre><code>About 10 s (hold time) with hello 3 / hold 10.</code></pre>
</details>
<details><summary>۵ (سخت): نقش Track چیست؟</summary><pre><code>Lower the priority when an uplink fails so the standby takes over; otherwise traffic black-holes.</code></pre>
</details>

<h2><span class="hn">۴.</span> آزمون Failover</h2>
<p>۳ آزمایش، هرکدام را ثبت کنید:</p>
<ol>
<li>Core-1 را خاموش کنید: HSRP به Core-2 می‌رود؛ ping پایدار می‌ماند.</li>
<li>لینک Core-1 به Edge را قطع کنید: OSPF مسیر را از Core-2 می‌گیرد.</li>
<li>لینک ACC به Core-1 را قطع کنید: Rapid-PVST به مسیر جایگزین می‌رود.</li>
</ol>
<pre><code>Measure: lost packets and seconds to recover for each test.
Typical: HSRP ~10 s (tunable), OSPF dead 40 s (tunable), RSTP ~1-2 s</code></pre>
<div class="box"><b class="t">Asymmetric Routing</b>چون دو Core و دو لینک به Edge داریم، ممکن است رفت از Core-1 و برگشت از Core-2 باشد. در Lab ساده بی‌اثر است، ولی وقتی FortiGate Stateful بیاید (W9/W10) باید مسیرها را متقارن کنید؛ ریسکی که در طراحی نوشته‌ایم.</div>
<div class="box"><b class="t">صادقانه درباره‌ی Lab</b>چند قابلیت (EtherChannel و برخی امنیت‌های L2) روی vIOSL2 ممکن است فقط پذیرفته شوند. اگر Po1 بالا نیامد، یک لینک عادی Trunk بگذارید و محدودیت را ثبت کنید. SVI، HSRP و OSPF روی این Imageها طبق Probe و درس‌های قبل قابل‌اجراست.</div>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): Gateway هر VLAN در Lab A کدام آدرس است؟</summary><pre><code>The HSRP virtual IP (10.10.x.254).</code></pre>
</details>
<details><summary>۲ (ساده): چرا لینک Core به Edge Routed است؟</summary><pre><code>To avoid layer-2 loops and use routing (OSPF) with ECMP between the two cores.</code></pre>
</details>
<details><summary>۳ (متوسط): Return Path برای 8.8.8.8 به VLAN 20 چطور ساخته می‌شود؟</summary><pre><code>OSPF advertises the VLAN subnets from the cores to EDGE-R1.</code></pre>
</details>
<details><summary>۴ (سخت): چه خطری در Dual Core + Dual Link برای فایروال Stateful هست؟</summary><pre><code>Asymmetric routing: forward and return paths differ, and the stateful firewall drops the unmatched return.</code></pre>
</details>

<h2><span class="hn">۱.</span> DHCP روی روتر یا سوییچ</h2>
<p>یک Pool تعریف می‌کنیم: بازه‌ی آدرس، Gateway، DNS و مدت اجاره. آدرس‌های ثابت (Gateway، سرورها، پرینترها) را «مستثنا» می‌کنیم تا به کسی داده نشود.</p>
<pre><code>R1(config)# ip dhcp excluded-address 10.10.20.1 10.10.20.20
R1(config)# ip dhcp pool USERS20
R1(dhcp-config)# network 10.10.20.0 255.255.255.0
R1(dhcp-config)# default-router 10.10.20.1
R1(dhcp-config)# dns-server 10.10.10.53
R1(dhcp-config)# domain-name lab.local
R1(dhcp-config)# lease 0 8 0</code></pre>
<ul>
<li><code>excluded-address</code>: بازه‌ی .1 تا .20 هرگز داده نمی‌شود.</li>
<li><code>lease 0 8 0</code>: روز، ساعت، دقیقه؛ یعنی ۸ ساعت. برای Wi-Fi مهمان کوتاه‌تر، برای کاربران ثابت بلندتر.</li>
<li><code>dns-server</code> و <code>default-router</code>: Optionهای ۶ و ۳ که به کلاینت می‌رسند.</li>
</ul>
<h2><span class="hn">۲.</span> Reservation: آدرس ثابت برای یک دستگاه</h2>
<p>پرینتر باید همیشه یک IP داشته باشد ولی تنظیم دستی روی آن ممکن نیست. با MAC آن یک رزرو می‌سازیم:</p>
<pre><code>R1(config)# ip dhcp pool PRINTER1
R1(dhcp-config)# host 10.10.20.50 255.255.255.0
R1(dhcp-config)# client-identifier 01aa.bbcc.0001.00
R1(dhcp-config)# default-router 10.10.20.1</code></pre>
<p>نکته: <code>client-identifier</code> با 01 شروع می‌شود (نوع Ethernet) و بعد MAC می‌آید.</p>
<h2><span class="hn">۳.</span> مشکل: سرور در VLAN دیگر</h2>
<p>DHCP Server معمولاً در VLAN سرورهاست، نه در VLAN کاربران. Discover یک Broadcast است و Router/Core آن را عبور نمی‌دهد. <b>DHCP Relay</b> روی Interface Gateway کاربران، Broadcast را می‌گیرد و به‌صورت Unicast به سرور می‌فرستد:</p>

<pre><code>Core(config)# interface vlan 20
Core(config-if)# ip helper-address 10.10.30.10
! 10.10.30.10 = DHCP server in VLAN 30</code></pre>
<p>سرور با <b>giaddr</b> می‌فهمد Discover از کدام Subnet آمده و Pool مربوط (VLAN 20) را به کلاینت می‌دهد. پس سرور باید Scope برای هر Subnet داشته باشد.</p>

<h2><span class="hn">۱.</span> DNS چطور کار می‌کند؟</h2>
<p>دفترچه‌ی تلفن را تصور کنید: شما نام «example.com» را می‌دانید و DNS «شماره» (IP) آن را می‌دهد. کلاینت از سرور DNS خودش می‌پرسد؛ اگر سرور پاسخ را نداشت، از سرورهای بالاتر می‌پرسد و در پایان جواب را می‌گیرد و برای مدتی نگه می‌دارد (Cache).</p>
<pre><code>Client -> local DNS server : www.example.com ?
Local DNS -> root / TLD / authoritative servers (if not cached)
Local DNS -> client : 203.0.113.10   (cached for TTL seconds)</code></pre>

<h2><span class="hn">۳.</span> NTP: همه‌ی ساعت‌ها یکی</h2>
<p>ساعت کامپیوترها کم‌کم از هم فاصله می‌گیرد (Drift). NTP آن‌ها را با یک منبع دقیق هماهنگ می‌کند. سلسله‌مراتب Stratum: منبع اتمی/GPS ‏Stratum 0، سروری که مستقیم به آن وصل است Stratum 1، و هر مرحله پایین‌تر یک عدد بیشتر.</p>
<pre><code>Stratum 0 : atomic clock / GPS
Stratum 1 : server directly attached
Stratum 2 : synchronizes from stratum 1
...
Stratum 16 : unsynchronized (invalid)</code></pre>
<h3>تنظیم NTP روی سیسکو</h3>
<pre><code>R1(config)# clock timezone IRST 3 30
R1(config)# ntp server 10.10.10.53
R1(config)# ntp server 192.168.88.1 prefer
R1(config)# service timestamps log datetime msec localtime
R1(config)# service timestamps debug datetime msec localtime
R1# show ntp status
R1# show ntp associations
R1# show clock detail</code></pre>
<ul>
<li><code>clock timezone IRST 3 30</code>: ایران +۳:۳۰ (UTC). منطقه‌ی زمانی را در نظر بگیرید.</li>
<li><code>ntp server ... prefer</code>: منبع ترجیحی. چند منبع برای تحمل خطا.</li>
<li><code>show ntp status</code>: باید <code>Clock is synchronized</code> باشد.</li>
</ul>
<pre><code>R1# show ntp associations
  address        ref clock   st  when  poll reach  delay  offset
*~10.10.10.53   .GPS.       2   18    64   377    1.2   0.3

* = synchronized   ~ = configured   reach 377 = all last 8 polls succeeded</code></pre>
<p>در Lab ما ESXi از MikroTik (192.168.88.1) NTP می‌گیرد؛ همان منبع می‌تواند ریشه‌ی Stratum کل Lab باشد.</p>

<p><b>چرا لازم است:</b> آدرس‌های خصوصی (10.x، 192.168.x) در اینترنت Route نمی‌شوند. NAT مبدأ بسته را در لبه عوض می‌کند تا پاسخ برگردد. هر شبکه‌ی داخلی که به اینترنت وصل است NAT دارد؛ و خرابی آن (مثلاً NAT دوگانه) مبهم‌ترین مشکلات را می‌سازد.</p>
<ul>
<li><b>در کار روزانه:</b> تقریباً همه‌ی اینترنت‌ها PAT هستند.</li>
<li><b>در امنیت:</b> NAT امنیت نیست؛ فقط پنهان‌سازی آدرس است. محافظ اصلی Policy فایروال است.</li>
<li><b>در FortiGate:</b> Policy NAT، IP Pool و VIP همین مفاهیم را در فایروال دارند (W10).</li>
</ul>
<div class="box"><b class="t">مسیر درس</b>چرا NAT ← Inside/Outside ← Static ← Dynamic ← PAT/Overload ← مثال ساده/متوسط/سخت ← Lab ← عیب‌یابی.</div>

<tr><td>PAT</td><td>Port Address Translation</td><td>ترجمه‌ی آدرس و پورت (Overload)</td></tr>

<tr><td>Overload</td><td>NAT Overload</td><td>چند آدرس داخلی با یک آدرس عمومی</td></tr>
<tr><td>VIP</td><td>Virtual IP</td><td>Port Forward در فایروال (DNAT)</td></tr>

<h2><span class="hn">۱.</span> NAT چرا و چطور؟</h2>
<p>فرض کنید یک ساختمان اداری یک شماره‌ی تلفن بیرونی دارد و داخل داخلی‌ها (۱۰۱، ۱۰۲...). وقتی کارمند ۱۰۲ تماس می‌گیرد، گیرنده شماره‌ی بیرونی را می‌بیند؛ منشی (NAT) می‌داند پاسخ را به کدام داخلی بدهد. NAT هم همین جدول را نگه می‌دارد.</p>

<tr><th>اصطلاح</th><th>معنی</th><th>مثال</th></tr>
<tr><td>Inside Local</td><td>آدرس داخلی (قبل از ترجمه)</td><td>10.10.20.11</td></tr>

<h2><span class="hn">۲.</span> سه نوع NAT</h2>
<table>
<tr><th>نوع</th><th>نگاشت</th><th>کاربرد</th></tr>
<tr><td>Static NAT</td><td>یک به یک ثابت</td><td>انتشار سرور (مثلاً وب) به بیرون</td></tr>
<tr><td>Dynamic NAT</td><td>داخلی به Pool از چند آدرس عمومی</td><td>نادر؛ وقتی چند IP عمومی داریم</td></tr>
<tr><td>PAT / Overload</td><td>چند داخلی به یک IP عمومی با پورت متفاوت</td><td>اینترنت عادی</td></tr>
</table>
<p>PAT چطور؟ برای هر ارتباط، علاوه بر آدرس، شماره‌ی پورت مبدأ هم عوض می‌شود تا ارتباط‌ها از هم جدا بمانند:</p>
<pre><code>10.10.20.11:51000 -> 203.0.113.2:51000
10.10.20.12:51000 -> 203.0.113.2:51001   (port changed to stay unique)</code></pre>
<h2><span class="hn">۳.</span> دستورها (خط‌به‌خط)</h2>
<h3>PAT (Overload) با ACL</h3>
<pre><code>R1(config)# access-list 10 permit 10.10.20.0 0.0.0.255
R1(config)# interface gi0/0
R1(config-if)# ip nat inside
R1(config)# interface gi0/1
R1(config-if)# ip nat outside
R1(config)# ip nat inside source list 10 interface gi0/1 overload</code></pre>
<ul>
<li><code>ip nat inside / outside</code>: هر Interface را نقش می‌دهد؛ بدون این‌ها NAT کار نمی‌کند.</li>
<li><code>access-list 10</code>: مشخص می‌کند کدام ترافیک ترجمه شود (چه کسی «داخل» است).</li>
<li><code>overload</code>: PAT. <code>interface gi0/1</code>: از IP همان Interface خروجی استفاده شود.</li>
</ul>
<h3>Static NAT (انتشار سرور)</h3>
<pre><code>R1(config)# ip nat inside source static 10.10.30.10 203.0.113.10
! port forward only HTTPS:
R1(config)# ip nat inside source static tcp 10.10.30.10 443 203.0.113.10 443</code></pre>
<h3>مشاهده</h3>
<pre><code>R1# show ip nat translations
R1# show ip nat statistics
R1# clear ip nat translation *
R1# debug ip nat   (briefly)</code></pre>
<pre><code>Pro Inside global        Inside local        Outside local    Outside global
icmp 203.0.113.2:1       10.10.20.11:1       8.8.8.8:1        8.8.8.8:1
tcp  203.0.113.2:51000   10.10.20.12:51000   93.184.216.34:443 93.184.216.34:443</code></pre>
<h2><span class="hn">۴.</span> مثال‌ها</h2>
<h3>ساده</h3>
<pre><code>PC (10.10.20.11) pings 8.8.8.8
show ip nat translations shows the entry with inside global 203.0.113.2</code></pre>
<h3>متوسط: Static برای سرور</h3>
<pre><code>Outside client -> 203.0.113.10:443
Router translates the destination to 10.10.30.10:443 (inbound)
Return traffic is translated back automatically</code></pre>
<h3>سخت: چرا NAT کار نمی‌کند؟</h3>
<pre><code>Cause 1: ip nat inside/outside missing or on the wrong interface
Cause 2: ACL does not match the inside subnet
Cause 3: missing default route to the ISP
Cause 4: double NAT (router and firewall both translate)
Check : show ip nat translations (empty?) , show ip nat statistics (misses)</code></pre>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): PAT چه چیزی را علاوه بر IP تغییر می‌دهد؟</summary><pre><code>The source port, so many hosts can share one public IP.</code></pre>
</details>
<details><summary>۲ (ساده): Inside Global چیست؟</summary><pre><code>The inside host's address as seen from outside after translation.</code></pre>
</details>
<details><summary>۳ (متوسط): دو دستور لازم برای NAT روی یک Interface؟</summary><pre><code>ip nat inside on the LAN interface and ip nat outside on the WAN interface.</code></pre>
</details>
<details><summary>۴ (متوسط): چرا NAT امنیت نیست؟</summary><pre><code>It only hides addresses; it does not filter traffic. A firewall policy provides the protection.</code></pre>
</details>
<details><summary>۵ (سخت): NAT دوگانه (Double NAT) چه مشکلی می‌سازد؟</summary><pre><code>Translations at two devices break inbound port forwards and complicate troubleshooting.</code></pre>
</details>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> فهرست کنترل دسترسی (<span class="en">ACL</span>): انواع Standard و Extended، قاعده‌ی «اولین تطابق» و <span class="en">Implicit Deny</span>، جای درست گذاشتن ACL، و نوشتن Policy بین VLANها.</p>
<p><b>چرا لازم است:</b> ACL اولین ابزار کنترل ترافیک روی سیسکوست و پایه‌ی فهم Policy فایروال است. ترتیب اشتباه یک قاعده یا فراموشی Implicit Deny می‌تواند کل شبکه را قطع کند یا درِ امنیت را باز بگذارد.</p>
<ul>
<li><b>در کار روزانه:</b> جداکردن مهمان از شبکه‌ی داخلی و محدودکردن مدیریت (SSH).</li>
<li><b>در امنیت:</b> ACL، Least Privilege را در لایه‌ی شبکه پیاده می‌کند.</li>
<li><b>در FortiGate:</b> Policy فایروال همان منطق Top-Down و First Match را دارد (با Stateful بودن).</li>
</ul>
<div class="box"><b class="t">مسیر درس</b>ACL چیست ← First Match و Implicit Deny ← Standard در برابر Extended ← جای ACL ← مثال ساده/متوسط/سخت ← Lab ← عیب‌یابی.</div>

<h2><span class="hn">۱.</span> ACL چیست؟</h2>
<p>ACL فهرستی از قوانین است. هر قانون می‌گوید: «اگر بسته با این مشخصات بود، اجازه بده (permit) یا ببند (deny)». مثل لیست مهمانان در ورودی یک سالن؛ نگهبان از بالای لیست شروع می‌کند و هر نامی را پیدا کرد همان‌جا تصمیم می‌گیرد.</p>
<div class="box"><b class="t">دو قانون اصلی</b>۱) <b>اولین تطابق</b> (First Match): از بالا به پایین؛ به محض اولین قانونی که جور شد، بقیه خوانده نمی‌شود. ۲) <b>Implicit Deny</b>: در انتهای هر ACL یک <code>deny any</code> نامرئی هست؛ پس هر چه صریحاً permit نشده، بسته می‌شود.</div>
<figure class="fig"><svg viewBox="0 0 720 250" role="img" aria-label="topology"><path d="M105 128 L365 128" class="rq"/><path d="M365 128 L630 56" class="rq"/><text x="497" y="86" text-anchor="middle" class="cap">deny</text><path d="M365 128 L630 196" class="rp"/><text x="497" y="156" text-anchor="middle" class="cap">permit</text><rect x="30" y="100" width="150" height="56" rx="8" class="wrn"/><text x="105" y="126" text-anchor="middle" class="on">Guest VLAN 50</text><text x="105" y="142" text-anchor="middle" class="cap">10.10.50.0/24</text><rect x="290" y="100" width="150" height="56" rx="8" class="bx"/><text x="365" y="126" text-anchor="middle">Core SVI</text><text x="365" y="142" text-anchor="middle" class="cap">ACL in on Vlan50</text><rect x="560" y="30" width="140" height="52" rx="8" class="hst"/><text x="630" y="54" text-anchor="middle" class="on">Servers VLAN 30</text><text x="630" y="70" text-anchor="middle" class="cap">10.10.30.0/24</text><rect x="560" y="170" width="140" height="52" rx="8" class="net"/><text x="630" y="194" text-anchor="middle" class="on">Internet</text><text x="630" y="210" text-anchor="middle" class="cap">via Edge</text></svg><figcaption>شکل ۱: ACL روی ورودی SVI مهمان: دسترسی به سرورها بسته و اینترنت باز است.</figcaption></figure>
<h2><span class="hn">۲.</span> Standard در برابر Extended</h2>
<table>
<tr><th>معیار</th><th>Standard</th><th>Extended</th></tr>
<tr><td>شماره</td><td>1-99 و 1300-1999</td><td>100-199 و 2000-2699</td></tr>
<tr><td>معیار</td><td>فقط IP مبدأ</td><td>مبدأ، مقصد، پروتکل، پورت</td></tr>
<tr><td>جای نصب</td><td>نزدیک مقصد</td><td>نزدیک مبدأ</td></tr>
<tr><td>کاربرد</td><td>فیلتر ساده (مثل VTY)</td><td>Policy دقیق بین VLANها</td></tr>
</table>
<p>چرا Standard نزدیک مقصد؟ چون فقط مبدأ را می‌شناسد؛ اگر نزدیک مبدأ بگذارید، ترافیک آن مبدأ به همه‌ی مقصدها بسته می‌شود. Extended را نزدیک مبدأ می‌گذارند تا ترافیک ناخواسته زودتر از شبکه خارج شود.</p>
<h2><span class="hn">۳.</span> دستورها (خط‌به‌خط)</h2>
<p>روش Named که قابل‌ویرایش و خواناست:</p>
<pre><code>Core(config)# ip access-list extended GUEST-IN
Core(config-ext-nacl)# remark block guests from internal networks
Core(config-ext-nacl)# deny ip 10.10.50.0 0.0.0.255 10.10.0.0 0.0.255.255
Core(config-ext-nacl)# permit udp 10.10.50.0 0.0.0.255 any eq 53
Core(config-ext-nacl)# permit tcp 10.10.50.0 0.0.0.255 any eq 80
Core(config-ext-nacl)# permit tcp 10.10.50.0 0.0.0.255 any eq 443
Core(config-ext-nacl)# deny ip any any log
Core(config-ext-nacl)# exit
Core(config)# interface vlan 50
Core(config-if)# ip access-group GUEST-IN in</code></pre>
<ul>
<li><code>remark</code>: توضیح خط‌به‌خط (حتماً بنویسید).</li>
<li>اول <code>deny</code> برای شبکه‌ی داخلی (10.10.0.0/16)؛ بعد permitهای لازم (DNS، وب).</li>
<li><code>log</code>: برای دیدن Hit در Log (روی خطوط deny مفید است).</li>
<li><code>ip access-group NAME in</code>: ACL را روی ورودی Interface اعمال می‌کند.</li>
</ul>
<pre><code>Core# show access-lists
Core# show ip interface vlan 50 | include access list
Core# show running-config | section ip access-list</code></pre>

    50 deny ip any any log (3 matches)</code></pre>
<h2><span class="hn">۴.</span> نکته‌های حرفه‌ای</h2>
<ul>
<li><b>ترتیب مهم است:</b> اگر permit کلی را بالای deny بگذارید، deny هرگز اجرا نمی‌شود.</li>
<li><b>ACL فقط ترافیک عبوری را فیلتر می‌کند،</b> نه ترافیکی که خود روتر می‌سازد.</li>
<li><b>Stateless است:</b> برگشت ترافیک باید صراحتاً مجاز شود (مثلاً <code>established</code> برای TCP)؛ فایروال Stateful این را خودکار می‌کند.</li>
<li><b>جهت (in/out) را درست انتخاب کنید:</b> in = ورودی به Interface از بیرون؛ out = خروجی.</li>
<li><b>قبل از اعمال،</b> مطمئن شوید قانون مدیریت (SSH) شما را قطع نمی‌کند.</li>
</ul>
<pre><code>Return traffic example (TCP, stateless ACL):
  permit tcp any 10.10.20.0 0.0.0.255 established
matches only packets with ACK/RST bits set (replies), not new connections</code></pre>
<h2><span class="hn">۵.</span> مثال‌ها</h2>
<h3>ساده: SSH فقط از مدیریت (Standard)</h3>
<pre><code>Core(config)# ip access-list standard MGMT-ONLY
Core(config-std-nacl)# permit 10.10.10.0 0.0.0.255
Core(config)# line vty 0 4
Core(config-line)# access-class MGMT-ONLY in</code></pre>
<h3>متوسط: کاربران فقط HTTPS و DNS به سرور</h3>
<pre><code>ip access-list extended USERS-TO-SRV
 permit tcp 10.10.20.0 0.0.0.255 host 10.10.30.10 eq 443
 permit udp 10.10.20.0 0.0.0.255 host 10.10.30.53 eq 53
 deny ip 10.10.20.0 0.0.0.255 10.10.30.0 0.0.0.255 log
 permit ip any any</code></pre>
<h3>سخت: چرا Ping کار می‌کند ولی HTTPS نه؟</h3>
<pre><code>Cause 1: ACL has permit icmp above, no permit for tcp 443
Cause 2: ACL applied in the wrong direction or on the wrong interface
Cause 3: implicit deny (no permit for the traffic)
Cause 4: return path ACL blocks the replies (stateless)
Check : show access-lists (hit counters), show ip interface ... | include access</code></pre>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): Implicit Deny چیست؟</summary><pre><code>An invisible "deny any" at the end of every ACL.</code></pre>
</details>
<details><summary>۲ (ساده): Extended را کجا می‌گذاریم؟</summary><pre><code>Close to the source of the traffic.</code></pre>
</details>
<details><summary>۳ (متوسط): Wildcard برای 10.10.20.0/24؟</summary><pre><code>0.0.0.255</code></pre>
</details>
<details><summary>۴ (متوسط): چرا ترتیب مهم است؟</summary><pre><code>Evaluation stops at the first match; a broad permit above a deny makes the deny unreachable.</code></pre>
</details>
<details><summary>۵ (سخت): ACL روی VLAN مهمان هر چیزی را می‌بندد؛ چه چیزی فراموش شده؟</summary><pre><code>A permit for DNS (udp/53) and required web ports, because of the implicit deny.</code></pre>
</details>

<h2><span class="hn">۱.</span> Syslog: دفتر ثبت وقایع</h2>
<p>دستگاه هر رویداد مهم را به‌صورت یک خط پیام می‌نویسد: لینک بالا رفت، کاربر وارد شد، ACL بسته را رد کرد. هر پیام یک سطح اهمیت (Severity) دارد:</p>
<table>
<tr><th>سطح</th><th>نام</th><th>معنی</th></tr>
<tr><td>0</td><td>Emergency</td><td>سیستم از کار افتاده</td></tr>
<tr><td>1</td><td>Alert</td><td>نیاز به اقدام فوری</td></tr>
<tr><td>2</td><td>Critical</td><td>وضعیت بحرانی</td></tr>
<tr><td>3</td><td>Error</td><td>خطا</td></tr>
<tr><td>4</td><td>Warning</td><td>هشدار</td></tr>
<tr><td>5</td><td>Notice</td><td>رویداد معمولی مهم</td></tr>
<tr><td>6</td><td>Informational</td><td>اطلاعات</td></tr>
<tr><td>7</td><td>Debug</td><td>اشکال‌زدایی</td></tr>
</table>
<p>قاعده: عدد کمتر یعنی مهم‌تر. اگر روی «سطح ۶» تنظیم کنید، سطح‌های ۰ تا ۶ ارسال می‌شود.</p>
<h2><span class="hn">۲.</span> تنظیم سیسکو برای ارسال Log</h2>
<pre><code>R1(config)# service timestamps log datetime msec localtime
R1(config)# logging host 10.10.10.60
R1(config)# logging trap informational
R1(config)# logging source-interface loopback 0
R1(config)# logging buffered 16384
R1(config)# logging console warnings
R1# show logging</code></pre>
<ul>
<li><code>logging host</code>: آدرس سرور rsyslog (UDP 514).</li>
<li><code>logging trap informational</code>: سطح ارسال (تا ۶).</li>
<li><code>source-interface loopback 0</code>: همه‌ی Logها با آدرس ثابت دستگاه می‌آیند.</li>
<li><code>buffered</code>: نگه‌داری در حافظه‌ی خود دستگاه (برای وقتی سرور نیست).</li>
</ul>
<div class="box"><b class="t">ساعت!</b>بدون NTP (درس ۷-۲)، Log بی‌ارزش است. اول NTP، بعد Syslog.</div>
<h2><span class="hn">۳.</span> سرور rsyslog (لینوکس)</h2>
<p>روی VM مانیتورینگ (<code>MON</code>) rsyslog را برای دریافت UDP 514 فعال می‌کنیم و Log هر دستگاه را در فایل جدا می‌نویسیم:</p>
<pre><code># /etc/rsyslog.d/10-network.conf
module(load="imudp")
input(type="imudp" port="514")

template(name="PerHost" type="string"
  string="/var/log/network/%HOSTNAME%.log")
if ($fromhost-ip startswith "10.10.") then {
  action(type="omfile" dynaFile="PerHost")
  stop
}</code></pre>
<pre><code>sudo mkdir -p /var/log/network
sudo systemctl restart rsyslog
sudo ss -ulnp | grep 514
sudo tail -f /var/log/network/R1.log</code></pre>
<p>این دستورها را شما روی VM اجرا می‌کنید؛ من فقط فرمان می‌دهم. VM هنوز ساخته نشده؛ در Phase مانیتورینگ ساخته می‌شود، اینجا مفهوم و پیکربندی را بشناسید.</p>
<h2><span class="hn">۴.</span> SNMP: سؤال‌وجواب با دستگاه</h2>
<p>سرور مانیتورینگ هر چند ثانیه از دستگاه می‌پرسد (Poll): «CPU چند درصد؟ ترافیک Interface؟». هر مقدار با یک OID مشخص می‌شود. دستگاه می‌تواند خودش هم رویداد اعلام کند (Trap).</p>
<table>
<tr><th>نسخه</th><th>احراز هویت</th><th>رمزگذاری</th><th>توصیه</th></tr>
<tr><td>v1</td><td>Community (متن ساده)</td><td>ندارد</td><td>ممنوع</td></tr>
<tr><td>v2c</td><td>Community (متن ساده)</td><td>ندارد</td><td>فقط Lab</td></tr>
<tr><td>v3</td><td>نام‌کاربری + SHA</td><td>AES (authPriv)</td><td>تولید</td></tr>
</table>
<h3>v2c فقط برای Lab</h3>
<pre><code>R1(config)# ip access-list standard SNMP-MGR
R1(config-std-nacl)# permit host 10.10.10.60
R1(config)# snmp-server community &lt;LAB-COMMUNITY> RO SNMP-MGR
R1(config)# snmp-server location LAB-HQ
R1(config)# snmp-server contact netadmin@lab.local</code></pre>
<h3>v3 امن</h3>
<pre><code>R1(config)# snmp-server group MON-GRP v3 priv
R1(config)# snmp-server user monitor MON-GRP v3 auth sha &lt;AUTH-PASS> priv aes 128 &lt;PRIV-PASS>
R1(config)# snmp-server host 10.10.10.60 version 3 priv monitor
R1(config)# snmp-server enable traps</code></pre>
<div class="box"><b class="t">نکته‌ی امنیتی</b>رمزها و Communityها را در ریپو و اسناد ننویسید؛ جانگهدار بگذارید و مقدار واقعی را در مدیریت رمز نگه دارید. Community پیش‌فرض (public/private) ممنوع است. دسترسی SNMP را با ACL به آدرس سرور مانیتورینگ محدود کنید. سینتکس v3 روی Image شما باید تأیید شود (Unverified).</div>
<pre><code>R1# show snmp
R1# show snmp user
R1# show snmp host
! from the monitoring VM (Linux):
snmpwalk -v2c -c &lt;LAB-COMMUNITY> 10.0.12.1 1.3.6.1.2.1.1.1.0</code></pre>
<h2><span class="hn">۵.</span> مثال‌ها</h2>
<h3>ساده</h3>
<pre><code>Interface flaps -> log line on the server:
Nov  8 10:12:01 R1 %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down</code></pre>
<h3>متوسط: تحلیل رویداد</h3>
<pre><code>10:12:01 %LINK-3-UPDOWN gi0/1 down
10:12:02 %OSPF-5-ADJCHG neighbor 2.2.2.2 Full -> Down
10:12:32 %LINK-3-UPDOWN gi0/1 up
10:12:40 %OSPF-5-ADJCHG neighbor 2.2.2.2 Down -> Full
Conclusion: a 31 s link outage caused an OSPF flap</code></pre>
<h3>سخت: چرا Log نمی‌رسد؟</h3>
<pre><code>Cause 1: no route to the log server
Cause 2: ACL/firewall blocks UDP 514
Cause 3: wrong logging trap level
Cause 4: server not listening (ss -ulnp)
Cause 5: wrong time makes entries look missing</code></pre>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): سطح Syslog برای «خطا»؟</summary><pre><code>3 (Error)</code></pre>
</details>
<details><summary>۲ (ساده): چرا v2c خطرناک است؟</summary><pre><code>The community string is sent in clear text and there is no encryption.</code></pre>
</details>
<details><summary>۳ (متوسط): logging trap warnings چه سطح‌هایی را می‌فرستد؟</summary><pre><code>Levels 0 to 4 (emergencies to warnings).</code></pre>
</details>
<details><summary>۴ (متوسط): چرا source-interface loopback؟</summary><pre><code>The log source address stays stable even if a physical interface fails.</code></pre>
</details>
<details><summary>۵ (سخت): Poll در برابر Trap؟</summary><pre><code>Poll: the server asks periodically. Trap: the device sends an event on its own.</code></pre>
</details>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> مفهوم کیفیت سرویس (<span class="en">QoS</span>): دسته‌بندی، علامت‌گذاری (<span class="en">DSCP</span>)، صف‌بندی و محدودسازی؛ و جمع‌بندی هفته با «Service Matrix» و آزمون کوچک.</p>
<p><b>چرا لازم است:</b> وقتی پهنای باند کم است، صدا و تصویر زنده (VoIP) باید جلوتر از دانلود فایل بروند وگرنه قطع‌وصل می‌شوند. QoS تعیین می‌کند چه ترافیکی اولویت دارد. حتی اگر روزانه استفاده نکنید، باید مفهومش را بدانید.</p>

<h2><span class="hn">۱.</span> مشکل: رقابت روی یک لینک</h2>
<p>جاده‌ای را تصور کنید که آمبولانس و کامیون باری هر دو در آن گرفتار ترافیک‌اند. آمبولانس (صدا) باید جلو برود؛ کامیون (دانلود) می‌تواند صبر کند. QoS همان «لاین ویژه» است.</p>
<h2><span class="hn">۲.</span> چهار ابزار QoS</h2>
<table>
<tr><th>ابزار</th><th>کار</th></tr>
<tr><td>Classification</td><td>تشخیص نوع ترافیک (با ACL یا DSCP)</td></tr>
<tr><td>Marking</td><td>علامت‌گذاری اولویت (DSCP/CoS)</td></tr>
<tr><td>Queuing</td><td>صف‌بندی؛ ترافیک مهم زودتر خارج می‌شود</td></tr>
<tr><td>Policing/Shaping</td><td>محدودکردن نرخ؛ Policing قطع می‌کند، Shaping صف می‌کند</td></tr>
</table>
<h3>DSCP چیست؟</h3>
<p>یک فیلد ۶ بیتی در هدر IP که اولویت را نشان می‌دهد؛ ۶ بیت یعنی ۶۴ مقدار:</p>
<pre><code>DSCP bits = 6 -> 2 ^ 6 = 64 values (0 .. 63)</code></pre>
<table>
<tr><th>کلاس</th><th>DSCP</th><th>کاربرد</th></tr>
<tr><td>EF</td><td>46</td><td>صدا (VoIP)</td></tr>
<tr><td>AF41</td><td>34</td><td>ویدیو</td></tr>
<tr><td>AF31</td><td>26</td><td>داده‌ی مهم</td></tr>
<tr><td>BE (Default)</td><td>0</td><td>ترافیک عادی</td></tr>
<tr><td>CS1</td><td>8</td><td>کم‌اهمیت (Scavenger)</td></tr>
</table>
<h2><span class="hn">۳.</span> دستورها (MQC)</h2>
<p>سیسکو QoS را با «Modular QoS CLI» می‌سازد: سه قدم Class-map، Policy-map، Service-policy:</p>
<pre><code>R1(config)# ip access-list extended VOICE
R1(config-ext-nacl)# permit udp any any range 16384 32767
R1(config-ext-nacl)# exit
R1(config)# class-map match-any VOICE-CLASS
R1(config-cmap)# match access-group name VOICE
R1(config-cmap)# exit
R1(config)# policy-map WAN-OUT
R1(config-pmap)# class VOICE-CLASS
R1(config-pmap-c)# priority percent 20
R1(config-pmap-c)# set dscp ef
R1(config-pmap)# class class-default
R1(config-pmap-c)# fair-queue
R1(config-pmap-c)# exit
R1(config)# interface gi0/1
R1(config-if)# service-policy output WAN-OUT</code></pre>
<ul>
<li><code>priority percent 20</code>: ۲۰٪ پهنای باند برای صدا با اولویت مطلق (صف LLQ).</li>
<li><code>set dscp ef</code>: علامت‌گذاری EF.</li>
<li><code>class-default</code>: بقیه‌ی ترافیک.</li>
<li><code>service-policy output</code>: روی Interface خروجی اعمال می‌شود (QoS معمولاً روی خروجی صف می‌سازد).</li>
</ul>
<pre><code>R1# show policy-map interface gi0/1
R1# show class-map
R1# show policy-map</code></pre>
<div class="box"><b class="t">صادقانه</b>QoS در شبیه‌ساز vIOS ممکن است فقط پیکربندی را بپذیرد بدون صف‌بندی واقعی. هدف این درس فهم مفهوم و دستورهاست؛ نتیجه‌ی واقعی Lab را ثبت کنید.</div>

<tr><td>Control</td><td>OSPF، STP، HSRP</td><td>تزریق مسیر/Root جعلی</td><td>Authentication، BPDU/Root Guard</td></tr>
<tr><td>Data</td><td>ترافیک کاربران</td><td>اسکن، Spoofing، Flooding</td><td>ACL، Port Security، Snooping</td></tr>
</table>
<h2><span class="hn">۲.</span> چک‌لیست Management Plane</h2>
<pre><code>! 1. strong local credentials, hashed
enable secret &lt;SECRET>
username admin privilege 15 secret &lt;PASSWORD>
service password-encryption
no enable password

! 2. SSH only, version 2, key >= 2048
ip domain-name lab.local
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
 access-class MGMT-ONLY in
line console 0
 exec-timeout 10 0
 logging synchronous

! 3. brute-force protection
login block-for 120 attempts 5 within 60
login on-failure log
login on-success log

! 4. banners
banner login # Authorized access only #

! 5. turn off unneeded management
no ip http server
no ip http secure-server
no service pad
no service finger
no ip bootp server</code></pre>
<ul>
<li><code>service password-encryption</code>: رمزهای Type 7 را مخفی می‌کند ولی ضعیف است؛ رمز واقعی را فقط با <code>secret</code> بگذارید.</li>
<li><code>login block-for</code>: بعد از ۵ تلاش ناموفق در ۶۰ ثانیه، ۱۲۰ ثانیه ورود بسته می‌شود.</li>
<li><code>no ip http server</code>: وب‌مدیریت بدون نیاز را می‌بندد.</li>
</ul>
<div class="box"><b class="t">هشدار</b>رمز واقعی را در ریپو نگذارید (جانگهدار). و قبل از اعمال ACL/تغییر VTY از راه دور، <code>reload in 5</code> بگذارید تا قفل نشوید (درس ۲-۴).</div>
<h2><span class="hn">۳.</span> چک‌لیست Control Plane</h2>
<pre><code>! Layer 2
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree guard root     (on edge facing ports)

! Neighbor discovery: only where needed
no cdp run                   (or: no cdp enable on user-facing ports)
lldp run                     (only on trusted links)

! Routing: passive interfaces and authentication
router ospf 1
 passive-interface default
 no passive-interface gi0/1
interface gi0/1
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 &lt;OSPF-KEY></code></pre>
<p>CDP/LLDP اطلاعات دستگاه (نام، IP، Image) را برای هر همسایه می‌گوید. روی پورت‌های کاربر باید خاموش باشد، چون مهاجم اطلاعات ارزشمند می‌گیرد.</p>
<h2><span class="hn">۴.</span> چک‌لیست Data Plane</h2>
<pre><code>! unused access ports: shut down and park in an unused VLAN
interface range gi0/10 - 24
 switchport mode access
 switchport access vlan 999
 shutdown

! disable negotiation, avoid VLAN hopping
interface range gi0/1 - 24
 switchport nonegotiate

! trunks: explicit native + allowed
interface gi0/0
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50

! anti-spoofing basics
no ip source-route
no ip proxy-arp     (on user-facing interfaces)
no ip redirects
no ip unreachables  (on untrusted interfaces)</code></pre>
<p>«VLAN 999 بدون استفاده» جای پارک پورت‌های خالی است؛ حتی اگر کسی کابل بزند، به شبکه‌ی خالی می‌رسد.</p>
<h2><span class="hn">۵.</span> مثال‌ها</h2>
<h3>ساده: بستن وب‌مدیریت</h3>
<pre><code>Core# show ip http server status
HTTP server status: Enabled
Core(config)# no ip http server</code></pre>
<h3>متوسط: پورت‌های خالی</h3>
<pre><code>Before: 18 unused ports, all in VLAN 1, no shutdown (open door)
After : shutdown + VLAN 999 for all unused ports</code></pre>
<h3>سخت: کنترل خودکار</h3>
<pre><code>Compare each device against the golden baseline:
  show running-config | include http|telnet|cdp|snmp
Any deviation = finding; record it and fix with a CHG.</code></pre>
<div class="box"><b class="t">صادقانه</b>بعضی دستورها (مثل <code>login block-for</code> یا <code>service-policy</code>) روی Imageهای شبیه‌ساز ممکن است محدود باشند. نتیجه‌ی واقعی را ثبت کنید و در تجهیز واقعی تکرار کنید.</div>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> کنترل «چه کسی، چه کاری، چه زمانی» روی دستگاه: <span class="en">AAA</span> (احراز هویت، مجوز، حسابداری)، سطح‌های دسترسی (<span class="en">Privilege Level</span>)، و مفهوم <span class="en">TACACS+</span> و <span class="en">RADIUS</span>.</p>
<p><b>چرا لازم است:</b> اگر همه‌ی ادمین‌ها یک رمز مشترک بدانند، نمی‌توانید بگویید «چه کسی این تغییر را داد». AAA هر ادمین را جدا می‌شناسد، دسترسی را به نیاز او محدود می‌کند (Least Privilege) و ثبت می‌کند چه دستوری زد.</p>
<ul>
<li><b>در کار روزانه:</b> کارمند کمک‌حال فقط show می‌بیند؛ ارشد تنظیم می‌کند.</li>
<li><b>در امنیت:</b> مسئولیت‌پذیری (Accountability) و اصل Least Privilege.</li>
<li><b>در Capstone:</b> Admin FortiGate هم با Profile و Trusted Host همین منطق را دارد.</li>
</ul>
<div class="box"><b class="t">مسیر درس</b>سه A ← Local AAA ← Privilege Level ← TACACS+ و RADIUS ← مثال ساده/متوسط/سخت ← Lab ← عیب‌یابی.</div>

<tr><td>Privilege</td><td>Privilege level</td><td>سطح دسترسی 0 تا 15</td></tr>
<tr><td>RBAC</td><td>Role-Based Access Control</td><td>دسترسی بر اساس نقش</td></tr>

<h2><span class="hn">۱.</span> سه A</h2>
<table>
<tr><th>حرف</th><th>معنی</th><th>سؤال</th></tr>
<tr><td>Authentication</td><td>احراز هویت</td><td>تو کیستی؟</td></tr>
<tr><td>Authorization</td><td>مجوز</td><td>چه کاری مجازی انجام دهی؟</td></tr>
<tr><td>Accounting</td><td>حسابداری</td><td>چه کاری انجام دادی؟</td></tr>
</table>
<p>مثال: ورود به ساختمان: کارت (هویت)، دسترسی فقط به طبقه‌ی خودت (مجوز)، و دفتر ورود و خروج (ثبت).</p>
<h2><span class="hn">۲.</span> Local AAA (بدون سرور)</h2>
<pre><code>R1(config)# username netadmin privilege 15 secret &lt;PASSWORD1>
R1(config)# username helpdesk privilege 5 secret &lt;PASSWORD2>
R1(config)# aaa new-model
R1(config)# aaa authentication login default local
R1(config)# aaa authorization exec default local
R1(config)# aaa accounting exec default start-stop group tacacs+
R1(config)# line vty 0 4
R1(config-line)# login authentication default</code></pre>
<div class="box"><b class="t">هشدار قفل‌شدن</b><code>aaa new-model</code> رفتار ورود را عوض می‌کند. قبل از آن حتماً یک کاربر محلی بسازید، با <code>reload in 5</code> کار کنید، و همیشه یک روش Fallback (Local) بگذارید.</div>
<h2><span class="hn">۳.</span> سطح‌های دسترسی (Privilege Level)</h2>
<table>
<tr><th>سطح</th><th>معنی</th></tr>
<tr><td>0</td><td>دستورهای حداقلی (logout، exit...)</td></tr>
<tr><td>1</td><td>User EXEC (مشاهده‌ی محدود)</td></tr>
<tr><td>5 (سفارشی)</td><td>مثلاً show و ping برای کمک‌حال</td></tr>
<tr><td>15</td><td>دسترسی کامل (Privileged EXEC)</td></tr>
</table>
<pre><code>R1(config)# privilege exec level 5 show running-config
R1(config)# privilege exec level 5 show ip interface brief
R1(config)# privilege exec level 5 ping
R1(config)# privilege exec level 5 traceroute</code></pre>
<p>کاربر helpdesk با سطح ۵ فقط دستورهایی که به سطح ۵ داده‌اید را می‌بیند. راه امن‌تر و مدرن‌تر: <span class="en">Role-Based CLI (Parser View)</span>.</p>
<h2><span class="hn">۴.</span> TACACS+ و RADIUS</h2>
<p>به‌جای ساختن کاربر روی ۵۰ دستگاه، یک سرور مرکزی کاربران را نگه می‌دارد؛ دستگاه از سرور می‌پرسد.</p>
<table>
<tr><th>ویژگی</th><th>TACACS+</th><th>RADIUS</th></tr>
<tr><td>سازنده</td><td>سیسکو</td><td>استاندارد</td></tr>
<tr><td>پورت</td><td>TCP 49</td><td>UDP 1812/1813</td></tr>
<tr><td>رمزگذاری</td><td>کل بسته</td><td>فقط رمز</td></tr>
<tr><td>مجوز دستور (Command Authorization)</td><td>بله، دقیق</td><td>محدود</td></tr>
<tr><td>کاربرد معمول</td><td>مدیریت دستگاه</td><td>VPN، Wi-Fi، 802.1X</td></tr>
</table>
<pre><code>R1(config)# tacacs server TAC1
R1(config-server-tacacs)# address ipv4 10.10.10.70
R1(config-server-tacacs)# key &lt;TACACS-KEY>
R1(config)# aaa group server tacacs+ TAC-GRP
R1(config-sg-tacacs+)# server name TAC1
R1(config)# aaa authentication login default group TAC-GRP local
R1(config)# aaa authorization exec default group TAC-GRP local</code></pre>
<p>ترتیب در انتها یعنی: اول سرور، اگر در دسترس نبود Local (Fallback). این دستورها نیاز به سرور واقعی دارند؛ در Lab فقط ساخت و مفهوم را می‌بینیم و بعداً در FortiGate با RADIUS/LDAP کار می‌کنیم.</p>
<h2><span class="hn">۵.</span> مثال‌ها</h2>
<h3>ساده</h3>
<pre><code>Two users: netadmin (priv 15) and helpdesk (priv 5)
helpdesk logs in via SSH and can only run show and ping</code></pre>
<h3>متوسط: ثبت فعالیت</h3>
<pre><code>Accounting on: every exec session and command is logged to the AAA server
Audit question "who changed the ACL at 14:05?" is answerable</code></pre>
<h3>سخت: سرور AAA از کار افتاد</h3>
<pre><code>Config: group TAC-GRP local
TAC server down  -> login falls back to the local user (still works)
Without "local" -> everyone is locked out (only console recovery)</code></pre>

</details>

</details>
<details><summary>۵ (سخت): TACACS+ در برابر RADIUS برای مدیریت دستگاه؟</summary><pre><code>TACACS+ encrypts the whole packet and supports granular command authorization.</code></pre>
</details>

<h2><span class="hn">۱.</span> چرا داده «ساختاریافته»؟</h2>
<p>خروجی <code>show ip interface brief</code> برای انسان خوانا و برای برنامه دشوار است؛ باید ستون‌ها را جدا کرد و هر نسخه فرق می‌کند. اگر دستگاه همین اطلاعات را به‌صورت «کلید و مقدار» بدهد، برنامه مستقیم می‌خواند.</p>
<h2><span class="hn">۲.</span> JSON</h2>
<p>JSON از دو ساختار ساخته می‌شود: شیء (Object) داخل آکولاد و آرایه (Array) داخل کروشه. مقدارها: رشته، عدد، true/false، null:</p>
<pre><code>{
  "hostname": "R1",
  "interfaces": [
    { "name": "Gi0/0", "ip": "10.0.12.1", "status": "up" },
    { "name": "Gi0/1", "ip": null,        "status": "down" }
  ],
  "ospf_enabled": true,
  "uptime_days": 42
}</code></pre>
<p>خواندن: <code>hostname</code> کلید است و <code>"R1"</code> مقدار. <code>interfaces</code> آرایه‌ای از دو شیء است. قواعد: کلیدها با دابل‌کوتیشن، بین عناصر ویرگول، بدون ویرگول آخر.</p>
<pre><code>Path examples:
  hostname            -> "R1"
  interfaces[0].ip    -> "10.0.12.1"
  interfaces[1].status-> "down"</code></pre>
<h2><span class="hn">۳.</span> YAML</h2>
<p>همان داده، بدون آکولاد، با تورفتگی (فاصله‌ها، نه Tab):</p>
<pre><code>hostname: R1
interfaces:
  - name: Gi0/0
    ip: 10.0.12.1
    status: up
  - name: Gi0/1
    ip: null
    status: down
ospf_enabled: true
uptime_days: 42</code></pre>
<div class="box"><b class="t">قانون YAML</b>تورفتگی معنی دارد. دو فاصله برای هر سطح؛ هرگز Tab. یک فاصله‌ی اضافه ساختار را خراب می‌کند. Ansible با YAML کار می‌کند.</div>
<h2><span class="hn">۴.</span> REST API و HTTP</h2>
<p>REST یعنی هر «منبع» (مثلاً یک Interface) یک آدرس (URL) دارد و با متدهای HTTP روی آن کار می‌کنیم:</p>
<table>
<tr><th>متد</th><th>کار</th><th>مثال</th></tr>
<tr><td>GET</td><td>خواندن</td><td>لیست Interfaceها</td></tr>
<tr><td>POST</td><td>ساختن</td><td>Object جدید</td></tr>
<tr><td>PUT</td><td>جایگزینی کامل</td><td>به‌روزرسانی کامل</td></tr>
<tr><td>PATCH</td><td>تغییر جزئی</td><td>یک فیلد</td></tr>
<tr><td>DELETE</td><td>حذف</td><td>حذف Object</td></tr>
</table>
<table>
<tr><th>کد وضعیت</th><th>معنی</th></tr>
<tr><td>200</td><td>موفق</td></tr>
<tr><td>201</td><td>ساخته شد</td></tr>
<tr><td>400</td><td>درخواست نامعتبر</td></tr>
<tr><td>401</td><td>احراز هویت نشده</td></tr>
<tr><td>403</td><td>دسترسی ممنوع</td></tr>
<tr><td>404</td><td>یافت نشد</td></tr>
<tr><td>500</td><td>خطای سرور</td></tr>
</table>
<h2><span class="hn">۵.</span> curl و jq</h2>
<p>ابزار خط فرمان برای ارسال درخواست HTTP. در Lab ما، سرویس API لوکال و Token نمونه استفاده می‌شود (بدون رمز واقعی):</p>
<pre><code># GET request with a token header (token comes from an environment variable)
curl -s -H "Authorization: Bearer $LAB_TOKEN" https://10.10.10.80/api/v2/monitor/system/status

# pretty print and pick a field with jq
curl -s -H "Authorization: Bearer $LAB_TOKEN" https://10.10.10.80/api/v2/monitor/system/status | jq ".results.hostname"

# POST a JSON body
curl -s -X POST -H "Content-Type: application/json" -d "{\\"name\\":\\"web1\\"}" https://10.10.10.80/api/v2/cmdb/firewall/address</code></pre>
<div class="box"><b class="t">امنیت</b>Token را در دستور یا فایل ذخیره‌شده در Git ننویسید؛ از متغیر محیطی یا مدیر رمز استفاده کنید. <code>-k</code> (نادیده‌گرفتن Certificate) فقط در Lab و با علم به خطر.</div>

<h3>سخت: خطای 401</h3>
<pre><code>curl returns HTTP 401
Causes: missing/expired token, wrong header name, wrong scheme (Bearer vs api_key),
        token tied to a different source IP (trusted host)
Do not retry blindly: fix auth first</code></pre>

<h2><span class="hn">۲.</span> آماده‌سازی محیط (روی PC/VM شما)</h2>
<p>این دستورها را شما روی دستگاه خودتان اجرا می‌کنید (من فقط فرمان می‌دهم و به شبکه‌ی شما متصل نمی‌شوم):</p>
<pre><code>python3 -m venv netauto
source netauto/bin/activate          # Windows: netauto\\Scripts\\activate
pip install netmiko
pip freeze > requirements.txt</code></pre>
<p>رمز را در متغیر محیطی می‌گذاریم، نه در کد:</p>
<pre><code>export NET_USER=netadmin
export NET_PASS='&lt;your-password>'
# Windows PowerShell:  $env:NET_USER="netadmin"; $env:NET_PASS="&lt;your-password>"</code></pre>
<h2><span class="hn">۳.</span> Inventory</h2>
<p>فایل <code>inventory.yaml</code> فقط آدرس‌ها و نوع دستگاه را دارد؛ رمز ندارد:</p>
<pre><code>devices:
  - name: CORE-SW1
    host: 10.10.10.2
    device_type: cisco_ios
  - name: CORE-SW2
    host: 10.10.10.3
    device_type: cisco_ios
  - name: EDGE-R1
    host: 10.10.10.1
    device_type: cisco_ios</code></pre>
<h2><span class="hn">۴.</span> اسکریپت (Read-only)</h2>
<pre><code>import os, sys, datetime, pathlib
import yaml
from netmiko import ConnectHandler
from netmiko.exceptions import NetmikoTimeoutException, NetmikoAuthenticationException

USER = os.environ.get("NET_USER")
PASS = os.environ.get("NET_PASS")
if not USER or not PASS:
    sys.exit("Set NET_USER and NET_PASS first")

# read-only: only show commands are allowed
ALLOWED = ("show ",)
COMMANDS = ["show running-config", "show version", "show ip interface brief"]
for c in COMMANDS:
    assert c.startswith(ALLOWED), "only show commands are allowed"

out_dir = pathlib.Path("backups")
out_dir.mkdir(exist_ok=True)
stamp = datetime.date.today().isoformat()

with open("inventory.yaml") as f:
    inventory = yaml.safe_load(f)["devices"]

for dev in inventory:
    params = {"device_type": dev["device_type"], "host": dev["host"],
              "username": USER, "password": PASS, "timeout": 20}
    try:
        with ConnectHandler(**params) as conn:
            for cmd in COMMANDS:
                text = conn.send_command(cmd)
                name = cmd.replace(" ", "_")
                (out_dir / f"{dev['name']}_{name}_{stamp}.txt").write_text(text)
        print(f"OK   {dev['name']}")
    except NetmikoTimeoutException:
        print(f"FAIL {dev['name']}: timeout")
    except NetmikoAuthenticationException:
        print(f"FAIL {dev['name']}: authentication")
    except Exception as e:
        print(f"FAIL {dev['name']}: {e}")</code></pre>
<p>توضیح بخش‌ها:</p>
<ul>
<li>رمز از متغیر محیطی خوانده می‌شود، نه از کد.</li>
<li><code>ALLOWED</code>: اسکریپت فقط اجازه‌ی show دارد؛ اگر دستور دیگری اضافه شود برنامه می‌ایستد.</li>
<li><code>try/except</code>: خرابی یک دستگاه بقیه را متوقف نمی‌کند.</li>
<li>فایل خروجی هر دستگاه و تاریخ دارد؛ در Git نگه‌داری می‌شود (درس ۸-۶).</li>
</ul>

<h2><span class="hn">۳.</span> Playbook اول: فقط خواندن</h2>
<pre><code># show_version.yml

<h2><span class="hn">۴.</span> Playbook تنظیم: Banner و NTP</h2>
<pre><code># baseline.yml

  gather_facts: false

<h3>اجرای امن (سه قدم)</h3>

<h2><span class="hn">۱.</span> Git به زبان ساده</h2>
<p>Git مثل «Ctrl+Z با حافظه‌ی نامحدود» است: هر بار که چیزی را مهم می‌دانید، یک «عکس» (commit) می‌گیرید با یک پیام؛ بعداً هر عکس را می‌بینید و تفاوت‌ها را مقایسه می‌کنید.</p>
<figure class="fig"><svg viewBox="0 0 720 184" role="img" aria-label="sequence"><rect x="55" y="10" width="130" height="34" rx="8" class="bx"/><text x="120" y="32" text-anchor="middle">Working dir</text><path d="M120 44 V178" class="ln" stroke-dasharray="4 4"/><rect x="295" y="10" width="130" height="34" rx="8" class="bx"/><text x="360" y="32" text-anchor="middle">Git (local)</text><path d="M360 44 V178" class="ln" stroke-dasharray="4 4"/><rect x="535" y="10" width="130" height="34" rx="8" class="bx"/><text x="600" y="32" text-anchor="middle">Remote repo</text><path d="M600 44 V178" class="ln" stroke-dasharray="4 4"/><path d="M120 75 H360" class="rq"/><path d="M352 70 l8 5 l-8 5" class="rq"/><text x="240" y="67" text-anchor="middle" class="cap">git add / commit</text><path d="M360 113 H600" class="rq"/><path d="M592 108 l8 5 l-8 5" class="rq"/><text x="480" y="105" text-anchor="middle" class="cap">git push</text><path d="M600 151 H360" class="rp"/><path d="M368 146 l-8 5 l8 5" class="rp"/><text x="480" y="143" text-anchor="middle" class="cap">git pull</text></svg><figcaption>شکل ۱: جریان کار Git؛ تغییر ← commit محلی ← push به ریپو.</figcaption></figure>
<h2><span class="hn">۲.</span> دستورهای اصلی</h2>
<pre><code>git init                                   # create a repository
git status                                 # what changed?
git add configs/CORE-SW1.cfg               # stage a file
git commit -m "CORE-SW1: add NTP and syslog (CHG-0012)"
git log --oneline                          # history
git diff                                   # unstaged changes
git diff HEAD~1 HEAD -- configs/CORE-SW1.cfg   # compare two versions
git checkout -b feature/hardening          # new branch
git restore configs/CORE-SW1.cfg           # undo local changes to a file</code></pre>
<ul>
<li>پیام commit باید بگوید «چه کسی/چرا» (شماره‌ی CHG).</li>
<li><code>git diff</code> بعد از هر بکاپ: اگر تفاوتی هست، یعنی کسی تغییر داده؛ بدون تفاوت = شبکه تغییر نکرده.</li>
</ul>
<h2><span class="hn">۳.</span> رمز در Git: خط قرمز</h2>
<pre><code># .gitignore
backups/*.raw
*.vault
secrets*.yml
.env
*.pcap
*.pcapng</code></pre>
<p>قبل از commit فایل‌های Config را از رمزها پاک‌سازی (Sanitize) کنید:</p>
<pre><code># redact secrets from a config before committing
sed -E -e "s/(secret [0-9] ).*/\\1&lt;REDACTED>/" \\
       -e "s/(password [0-9] ).*/\\1&lt;REDACTED>/" \\
       -e "s/(snmp-server community ).*/\\1&lt;REDACTED>/" \\
       CORE-SW1.raw > configs/CORE-SW1.cfg</code></pre>
<div class="box"><b class="t">اگر رمز اشتباهی commit شد</b>۱) فوراً رمز را عوض کنید (فرض کنید لو رفته). ۲) تاریخچه را پاک‌سازی کنید (فقط با راهنمایی؛ حذف از commit‌های قبلی ساده نیست). ۳) Secret Scanning را فعال کنید. هرگز فقط «پاک‌کردن فایل در commit بعدی» را کافی ندانید.</div>

           <div style="margin-top:4px">نسخه فایل: <span class="en">${D.version}</span> · ${D.updated}</div></div>`;
    D.modules.forEach(m=>{
      const open=m.lessons.some(l=>l.id===cur)||m.lessons.some(l=>l.ready);
      h+=`<div class="mod" data-m="${m.id}"${open?'':' hidden-list'}><button type="button"><span>${m.title}</span><span>${m.lessons.length}</span></button><ul>`;
      m.lessons.forEach(l=>{
        h+=`<li><a href="#/${l.id}" class="${l.id===cur?'active':''} ${l.ready?'':'locked'} ${done.has(l.id)?'done':''}" data-id="${l.id}"><span class="dot"></span><span>${l.title}${l.ready?'':' — به‌زودی'}</span></a></li>`;
      });
      h+='</ul></div>';
    });
    sb.innerHTML=h;
    $$('.mod>button').forEach(b=>b.onclick=()=>b.parentElement.toggleAttribute('hidden-list'));
    $$('.mod li a.locked').forEach(a=>a.onclick=e=>e.preventDefault());
    $$('.mod li a').forEach(a=>a.addEventListener('click',()=>document.body.classList.remove('menu-open')));
    const act=sb.querySelector('a.active'); if(act) act.scrollIntoView({block:'nearest'});
  }

  /* ---------- Persian/English separation (auto) ---------- */
  const LATIN=/[A-Za-z0-9][A-Za-z0-9_\-\.\/:@#%+=&*]*(?:\s+[A-Za-z0-9][A-Za-z0-9_\-\.\/:@#%+=&*]*)*/g;
  function wrapLatin(root){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
      const p=n.parentElement; if(!p||p.closest('pre,code,.en,script,style,svg,summary-nolatin')) return NodeFilter.FILTER_REJECT;
      return /[A-Za-z]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      const t=n.nodeValue; if(!/[؀-ۿ]/.test(t)&&t.trim().split(/\s+/).length>8) return; // long pure-English text: leave
      const frag=document.createDocumentFragment(); let last=0,m; LATIN.lastIndex=0;
      while((m=LATIN.exec(t))){
        const s=m[0]; if(!/[A-Za-z]/.test(s)) continue;
        if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
        const sp=document.createElement('span'); sp.className='en'; sp.textContent=s; frag.appendChild(sp); last=m.index+s.length;
      }
      if(last===0) return;
      if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
      n.parentNode.replaceChild(frag,n);
    });
  }

  /* ---------- Render ---------- */
  function reviewBlock(){
    const items=D.review.filter(r=>r.type!=='sample');
    const list=(items.length?items:D.review).map(r=>`<div class="review-item"><small>${r.type==='sample'?'نمونه':(r.type==='mistake'?'اشتباه':'سؤال')} · ${r.lesson}</small><p><b>${r.q}</b></p><p>${r.a}</p></div>`).join('');
    return `<h1>اشتباهات و سؤال‌های من (مرور دوره‌ای)</h1><p>هر سؤال یا اشتباه شما در درس بعدی داخل «یادآوری» می‌آید و اینجا جمع می‌شود. قبل از هر آزمون Gate این صفحه را مرور کنید.</p>${list}`;
  }
  function render(){
    const id=(location.hash.replace(/^#\//,'')||ready[0].id);
    const meta=all.find(l=>l.id===id)||ready[0];
    const art=$('#lesson'); let html;
    if(meta.id==='review') html=reviewBlock();
    else{
      const L=D.lessons[meta.id];
      html=`<h1>${meta.title}</h1>${L&&L.sub?`<p class="meta">${L.sub}</p>`:''}${L?L.html:'<p>این درس هنوز آماده نشده است.</p>'}`;
      if(meta.ready) html+=`<button class="navbtn donebtn" id="donebtn">${done.has(meta.id)?'✔ مطالعه شد (لغو)':'علامت‌گذاری به‌عنوان مطالعه‌شده'}</button>`;
    }
    const idx=ready.findIndex(l=>l.id===meta.id);
    const prev=ready[idx-1],next=ready[idx+1];
    html+=`<div class="nav"><span>${prev?`<a class="navbtn" href="#/${prev.id}">→ ${prev.title}</a>`:''}</span><span>${next?`<a class="navbtn" href="#/${next.id}">${next.title} ←</a>`:''}</span></div>`;
    art.innerHTML=html; wrapLatin(art);
    const db=$('#donebtn'); if(db) db.onclick=()=>{done.has(meta.id)?done.delete(meta.id):done.add(meta.id);saveDone();render()};
    buildMenu(meta.id); document.title=meta.title+' | دوره شبکه و امنیت'; window.scrollTo(0,0); $('.content').scrollTop=0;
  }
  window.addEventListener('hashchange',render); render();
})();
</script>
</body>
</html>
