<h2><span class="hn">۸.</span> Lab هدایت‌شده: دیدن یادگیری و Flooding</h2>
<p>توپولوژی: سوییچ <code>SW1</code> با سه کامپیوتر ساده‌ی <span class="en">VPCS</span> در PNetLab. اگر ندارید، از منوی Add Object سه گره‌ی VPCS (<code>PC1</code> تا <code>PC3</code>) بسازید و به پورت‌های <code>Gi0/1</code> تا <code>Gi0/3</code> وصل کنید. همه در VLAN 1 (پیش‌فرض) هستند.</p>
<h3>گام ۱: آدرس‌دهی VPCS</h3>
<pre><code>PC1&gt; ip 10.10.1.11/24
PC2&gt; ip 10.10.1.12/24
PC3&gt; ip 10.10.1.13/24</code></pre>
<h3>گام ۲: جدول خالی</h3>
<pre><code>SW1# clear mac address-table dynamic
SW1# show mac address-table dynamic</code></pre>
<h3>گام ۳: ایجاد ترافیک و دیدن یادگیری</h3>
<pre><code>PC1&gt; ping 10.10.1.12
SW1# show mac address-table dynamic</code></pre>
<p>باید MAC دو VPCS را روی پورت‌های درست ببینید. MAC هر VPCS را با <code>show ip</code> روی خودش می‌بینید.</p>
<h3>گام ۴: دیدن Flooding با Capture</h3>
<ol>
<li>روی لینک PC3 به SW1 کلیک راست و Capture را شروع کنید.</li>
<li>روی SW1: <code>clear mac address-table dynamic</code>.</li>
<li>روی PC1: <code>ping 10.10.1.12</code>.</li>
<li>در Wireshark فیلتر <code>arp or icmp</code>: ARP Request را می‌بینید (چون Broadcast است) ولی Echo Request بین PC1 و PC2 را <b>نباید</b> ببینید.</li>
</ol>
<p>پیش‌بینی کنید و بعد با واقعیت مقایسه کنید. اگر Echo را روی PC3 دیدید، یعنی سوییچ هنوز MAC را یاد نگرفته بود.</p>
<h3>گام ۵: Aging</h3>
<pre><code>SW1# show mac address-table aging-time
SW1(config)# mac address-table aging-time 60</code></pre>
<p>یک دقیقه ترافیک نفرستید و دوباره <code>show mac address-table dynamic</code> را بزنید. بعد زمان را به 300 برگردانید.</p>

<h2><span class="hn">۹.</span> Lab مستقل</h2>
<p>MAC یک VPCS را از روی جدول به پورتش ربط دهید، بدون نگاه به توپولوژی. بعد کابل PC2 را به پورت دیگر منتقل کنید و ثبت کنید چه مدت طول می‌کشد جدول درست شود. گزارش را در <code>03-ops/l2-cam-notes.md</code> بنویسید.</p>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> چطور یک سوییچ فیزیکی را به چند «شبکه‌ی مجازی جدا» یعنی <span class="en">VLAN</span> تقسیم کنیم، پورت‌ها را به VLANها اختصاص دهیم (Access Port) و جدولی منظم به نام <span class="en">VLAN Matrix</span> بسازیم.</p>
<p><b>چرا لازم است:</b> بدون VLAN، همه‌ی دستگاه‌های سازمان در یک Broadcast Domain هستند: ترافیک حسابداری، دوربین‌ها و مهمان‌ها با هم قاطی می‌شود و یک کامپیوتر آلوده می‌تواند همه را ببیند. VLAN جداسازی را بدون خرید سوییچ جدا ممکن می‌کند.</p>
<ul>
<li><b>در کار روزانه:</b> هر بار که کارمند جدید یا پرینتر جدید وصل می‌شود، باید پورتش را به VLAN درست ببرید.</li>
<li><b>در امنیت:</b> VLAN اولین لایه‌ی «Segmentation» است؛ در FortiGate بین VLANها Policy می‌نویسید.</li>
<li><b>در Capstone:</b> VLAN10 مدیریت، VLAN20 کاربران و VLAN30 سرورها همین هفته ساخته می‌شوند.</li>
</ul>

<h2><span class="hn">۱.</span> مشکل: یک Broadcast Domain بزرگ</h2>
<p>یک ساختمان اداری را در نظر بگیرید که همه‌ی طبقه‌ها یک راه‌پله‌ی مشترک و بدون در دارند. هر صدایی که در یک طبقه بلند شود، همه‌ی ساختمان می‌شنوند. Broadcast در شبکه همین است: هر بار که یک دستگاه ARP یا DHCP می‌فرستد، همه‌ی دستگاه‌های سوییچ آن را دریافت می‌کنند.</p>
<p>هرچه دستگاه‌ها بیشتر شوند، Broadcast بیشتر و شبکه کندتر می‌شود؛ و از نظر امنیت، همه همسایه‌ی هم هستند.</p>

<h2><span class="hn">۲.</span> VLAN: در گذاشتن بین طبقه‌ها</h2>
<p>VLAN سوییچ را به چند «سوییچ مجازی» تقسیم می‌کند. هر پورت عضو یک VLAN است و فریم‌ها فقط بین پورت‌های همان VLAN رد می‌شوند. دستگاه‌های VLAN متفاوت نه Broadcast یکدیگر را می‌بینند و نه بدون روتر با هم صحبت می‌کنند.</p>

<h3>قوانین VLAN</h3>
<ul>
<li>VLAN با شماره شناخته می‌شود: ۱ تا ۴۰۹۴ (جزئیات در درس بعد).</li>
<li>VLAN 1 پیش‌فرض است و بهتر است برای کاربران استفاده نشود.</li>
<li>هر VLAN معمولاً یک Subnet IP جدا دارد: VLAN20 همان 10.10.20.0/24 در IP Plan ماست.</li>
<li>Access Port فقط عضو یک VLAN است و دستگاه انتهایی (PC، پرینتر) به آن وصل می‌شود.</li>
</ul>

<h2><span class="hn">۳.</span> VLAN Matrix: سند طراحی</h2>
<p>قبل از تایپ هر دستور، یک جدول بسازید. ستون‌ها: شماره، نام، Subnet، Gateway، پورت‌ها. این جدول مرجع شماست:</p>

<h2><span class="hn">۴.</span> دستورها (خط‌به‌خط)</h2>
<pre><code>SW1(config)# vlan 20
SW1(config-vlan)# name USERS
SW1(config-vlan)# exit
SW1(config)# interface gi0/1
SW1(config-if)# switchport mode access
SW1(config-if)# switchport access vlan 20
SW1(config-if)# exit</code></pre>
<ul>
<li><code>vlan 20</code> + <code>name</code>: VLAN را می‌سازد و نام می‌دهد (نام فقط برای خوانایی است).</li>
<li><code>switchport mode access</code>: پورت را صریحاً Access می‌کند (نه خودکار).</li>
<li><code>switchport access vlan 20</code>: پورت را عضو VLAN 20 می‌کند. اگر VLAN وجود نداشته باشد، IOS آن را خودکار می‌سازد (خطای رایج: VLAN بدون نام).</li>
<li>برای چند پورت: <code>interface range gi0/1 - 2</code>.</li>
</ul>
<pre><code>SW1# show vlan brief
SW1# show interfaces gi0/1 switchport
SW1# show running-config interface gi0/1</code></pre>

<h2><span class="hn">۵.</span> مثال ساده: دو کامپیوتر در یک VLAN</h2>
<pre><code>PC1&gt; ip 10.10.20.11/24 10.10.20.1
PC2&gt; ip 10.10.20.12/24 10.10.20.1
PC1&gt; ping 10.10.20.12     -> success (same VLAN 20)</code></pre>

<h2><span class="hn">۶.</span> مثال متوسط: دو VLAN، بدون روتر</h2>
<pre><code>Srv1 (VLAN 30): 10.10.30.11/24
PC1  (VLAN 20): ping 10.10.30.11   -> FAILS</code></pre>
<p>دلیل: دو Broadcast Domain جدا هستند و بدون Gateway (روتر یا SVI) بسته نمی‌تواند رد شود. در درس‌های ۳-۴ و ۳-۵ این مشکل را حل می‌کنیم.</p>

<h2><span class="hn">۷.</span> مثال سخت: پورت در VLAN اشتباه (TS03)</h2>
<p>کاربری شکایت دارد «اینترنت ندارم». IP او 10.10.20.50/24 است ولی ping به Gateway جواب نمی‌دهد. روش عیب‌یابی:</p>
<ol>
<li>پورت او را پیدا کن: <code>show mac address-table address &lt;MAC&gt;</code>.</li>
<li>VLAN آن پورت را ببین: <code>show vlan brief</code>.</li>
<li>مقایسه کن: Subnet کامپیوتر با VLAN پورت یکی است؟</li>
<li>اگر نه، پورت را به VLAN درست ببر و دوباره تست کن.</li>
</ol>
<pre><code>Symptom   : IP 10.10.20.x but port is in VLAN 30
Evidence  : show vlan brief -> Gi0/5 in VLAN 30
Fix       : switchport access vlan 20
Verify    : ping gateway success</code></pre>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> چطور چند VLAN را روی «یک کابل» بین دو سوییچ (یا سوییچ و روتر) عبور بدهیم. این کار با <span class="en">Trunk</span> و استاندارد <span class="en">802.1Q</span> انجام می‌شود که به هر فریم یک برچسب (Tag) اضافه می‌کند.</p>
<p><b>چرا لازم است:</b> بدون Trunk باید برای هر VLAN یک کابل جدا بین سوییچ‌ها بکشید. Trunk همه را در یک کابل جا می‌دهد؛ ولی یک اشتباه کوچک در آن (مثلاً پاک‌کردن لیست VLANهای مجاز) می‌تواند کل شعبه را قطع کند.</p>
<ul>
<li><b>در کار روزانه:</b> تقریباً هر لینک بین سوییچ‌ها و بین سوییچ و فایروال Trunk است.</li>
<li><b>در امنیت:</b> Trunk نادرست راه حمله‌ی VLAN Hopping است؛ باید Native و Allowed را سفت کنید.</li>
<li><b>در FortiGate:</b> پورت فایروال که به سوییچ وصل می‌شود، همین Trunk را می‌بیند (VLAN Interface).</li>
</ul>

<h2><span class="hn">۱.</span> مشکل: یک کابل برای هر VLAN؟</h2>
<p>فرض کنید دو سوییچ در دو طبقه دارید و ۵ VLAN. بدون Trunk باید ۵ کابل بکشید. تصور کنید یک اتوبوس بین دو شهر. به‌جای ۵ ماشین جدا برای ۵ شرکت، یک اتوبوس مسافران همه‌ی شرکت‌ها را می‌برد؛ فقط باید روی هر مسافر یک برچسب بزنید تا در مقصد معلوم باشد مال کدام شرکت است.</p>

<h2><span class="hn">۲.</span> Tag 802.1Q چیست؟</h2>
<p>سوییچ هنگام ورود فریم به Trunk، یک برچسب ۴ بایتی بین MAC مبدأ و نوع فریم می‌گذارد. سوییچ آن‌طرف، برچسب را می‌خواند و فریم را فقط در همان VLAN پخش می‌کند.</p>
<figure class="fig"><svg viewBox="0 0 720 190" role="img" aria-label="802.1Q frame"><rect x="10" y="30" width="100" height="46" class="bx" stroke="#0b1018"/><text x="60" y="58" text-anchor="middle">Dst MAC</text><rect x="110" y="30" width="100" height="46" class="bx" stroke="#0b1018"/><text x="160" y="58" text-anchor="middle">Src MAC</text><rect x="210" y="30" width="250" height="46" class="net" stroke="#0b1018"/><text x="335" y="58" text-anchor="middle" class="on">802.1Q Tag (4 bytes)</text><rect x="460" y="30" width="80" height="46" class="bx" stroke="#0b1018"/><text x="500" y="58" text-anchor="middle">Type</text><rect x="540" y="30" width="110" height="46" class="bx" stroke="#0b1018"/><text x="595" y="58" text-anchor="middle">Payload</text><rect x="650" y="30" width="60" height="46" class="bx" stroke="#0b1018"/><text x="680" y="58" text-anchor="middle">FCS</text><rect x="210" y="100" width="80" height="52" class="bx"/><text x="250" y="122" text-anchor="middle">TPID</text><text x="250" y="140" text-anchor="middle" class="cap">0x8100</text><rect x="290" y="100" width="50" height="52" class="bx"/><text x="315" y="122" text-anchor="middle">PCP</text><text x="315" y="140" text-anchor="middle" class="cap">3 bit</text><rect x="340" y="100" width="45" height="52" class="bx"/><text x="362" y="122" text-anchor="middle">DEI</text><text x="362" y="140" text-anchor="middle" class="cap">1 bit</text><rect x="385" y="100" width="75" height="52" class="bx"/><text x="422" y="122" text-anchor="middle">VID</text><text x="422" y="140" text-anchor="middle" class="cap">12 bit</text><path d="M210 76 L210 100 M460 76 L460 100" class="ln"/></svg><figcaption>شکل ۱: فریم اترنت با Tag ۴ بایتی 802.1Q؛ ۱۲ بیت آن شماره‌ی VLAN است.</figcaption></figure>
<p>چون VID دوازده بیت است، تعداد VLANها محدود می‌شود:</p>
<pre><code>VID bits         = 12
Total values     = 2 ^ 12 = 4096   (0 .. 4095)
Reserved         = 0 and 4095
Usable VLAN IDs  = 4096 - 2 = 4094   (1 .. 4094)</code></pre>

<h2><span class="hn">۳.</span> Native VLAN: ترافیک بدون برچسب</h2>
<p>یک VLAN روی Trunk بدون Tag می‌رود؛ به آن <b>Native VLAN</b> می‌گویند (پیش‌فرض VLAN 1). اگر دو سر Trunk Native متفاوت داشته باشند، ترافیک VLANها قاطی می‌شود و CDP پیام <code>Native VLAN mismatch</code> می‌دهد. همین امر راهی برای VLAN Hopping است.</p>
<div class="box"><b class="t">توصیه‌ی امنیتی</b>Native را روی یک VLAN بدون استفاده (مثلاً 999) بگذارید و دو سر لینک یکی باشد.</div>

<h2><span class="hn">۴.</span> Allowed VLAN List: چه VLANهایی اجازه‌ی عبور دارند</h2>
<p>پیش‌فرض Trunk همه‌ی VLANها (1 تا 4094) را عبور می‌دهد. بهتر است فقط VLANهای لازم مجاز باشند. اینجا یک اشتباه بسیار رایج هست:</p>
<pre><code>switchport trunk allowed vlan 20,30        (REPLACES the whole list!)
switchport trunk allowed vlan add 40        (ADDS 40 to the existing list)
switchport trunk allowed vlan remove 30     (REMOVES 30 only)</code></pre>
<div class="box"><b class="t">هشدار (TS05: Human Error)</b>اگر برای افزودن VLAN جدید فقط بنویسید <code>allowed vlan 40</code> (بدون کلمه‌ی add)، کل لیست قبلی پاک می‌شود و فقط VLAN 40 می‌ماند. باقی VLANها بلافاصله قطع می‌شوند. همیشه از <code>add</code> استفاده کنید و قبلش <code>show interfaces trunk</code> را ببینید.</div>

<h2><span class="hn">۵.</span> دستورها (خط‌به‌خط)</h2>
<pre><code>SW1(config)# interface gi0/0
SW1(config-if)# switchport trunk encapsulation dot1q
SW1(config-if)# switchport mode trunk
SW1(config-if)# switchport trunk native vlan 999
SW1(config-if)# switchport trunk allowed vlan 10,20,30
SW1(config-if)# switchport nonegotiate
SW1(config-if)# end</code></pre>
<ul>
<li><code>trunk encapsulation dot1q</code>: روی بعضی سوییچ‌ها لازم است (اگر خطا داد، سوییچ فقط dot1q را پشتیبانی می‌کند و نیازی نیست).</li>
<li><code>mode trunk</code>: پورت را صریحاً Trunk می‌کند.</li>
<li><code>native vlan 999</code>: VLAN بدون Tag.</li>
<li><code>allowed vlan</code>: فهرست مجاز (اینجا برای اولین بار از فرم کامل استفاده شده).</li>
<li><code>nonegotiate</code>: DTP را خاموش می‌کند تا مذاکره‌ی ناخواسته رخ ندهد.</li>
</ul>
<pre><code>SW1# show interfaces trunk
SW1# show interfaces gi0/0 switchport</code></pre>
<p>خروجی <code>show interfaces trunk</code> چهار بخش دارد: Mode و Status، Vlans allowed، Vlans allowed and active، و Vlans in spanning tree forwarding state. اگر VLANی در بخش اول هست ولی در دوم نیست، یعنی هنوز روی سوییچ ساخته نشده.</p>

SW1(config-if)# switchport trunk encapsulation dot1q
SW1(config-if)# switchport mode trunk
(same on SW2)
SW1# show interfaces trunk       -> Gi0/1 trunking, allowed 1-4094</code></pre>

<h2><span class="hn">۷.</span> مثال متوسط: دو سوییچ، دو VLAN</h2>
<pre><code>SW1: PC1 (VLAN 20) on Gi0/2        SW2: PC4 (VLAN 20) on Gi0/2

<h2><span class="hn">۸.</span> مثال سخت: عیب‌یابی TS04 و TS05</h2>
<pre><code>TS04 symptom : VLAN 30 hosts lost connectivity across the trunk
Evidence     : show interfaces trunk -> VLAN 30 missing from "allowed"
Fix          : switchport trunk allowed vlan add 30

TS05 cause   : someone typed "allowed vlan 40" (without add)
Result       : only VLAN 40 remains, 10/20/30 down
Prevention   : always use "add", always review show interfaces trunk
               before and after, keep a backup (lesson 2-4)</code></pre>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> چطور VLANهای مختلف را به هم وصل کنیم. روش اول: یک روتر با یک کابل Trunk و چند Sub-interface؛ معروف به <span class="en">Router-on-a-Stick</span> (RoAS).</p>
<p><b>چرا لازم است:</b> همان‌طور که دیدید دو VLAN بدون روتر با هم صحبت نمی‌کنند. این درس کلید فهم «Inter-VLAN Routing» است و همین مفهوم در FortiGate با VLAN Interface تکرار می‌شود. کسی که RoAS را بفهمد، Gateway در FortiGate را هم می‌فهمد.</p>
<ul>
<li><b>در کار روزانه:</b> شعبه‌های کوچک بدون سوییچ لایه ۳ از همین روش استفاده می‌کنند.</li>
<li><b>در امنیت:</b> وقتی ترافیک بین VLANها از روتر یا فایروال می‌گذرد، می‌شود ACL یا Policy گذاشت.</li>
<li><b>در Capstone:</b> فایروال FortiGate همین نقش را برای همه‌ی VLANها دارد.</li>
</ul>
<div class="box"><b class="t">مسیر درس</b>مشکل: ارتباط بین VLANها ← ایده‌ی Sub-interface ← مسیر بسته (Packet Flow) ← دستورها ← مثال ساده/متوسط/سخت ← تمرین ← Lab ← عیب‌یابی.</div>

<h2><span class="hn">۱.</span> مشکل</h2>
<p>PC1 در VLAN 20 و Srv1 در VLAN 30. هر کدام Subnet خودش را دارد؛ دو شبکه‌ی جدا که بدون «پل» به هم نمی‌رسند. این پل یک <b>روتر</b> است: وقتی PC1 بخواهد به Srv1 بفرستد، بسته را به Gateway خودش می‌دهد و روتر آن را به VLAN 30 می‌فرستد.</p>
<p>ساده‌ترین راه: برای هر VLAN یک پورت فیزیکی روتر. ولی روتر پورت زیادی ندارد. راه‌حل هوشمندانه: یک پورت و یک Trunk؛ و روی روتر برای هر VLAN یک «Interface مجازی» می‌سازیم.</p>

<h2><span class="hn">۲.</span> ایده‌ی Router-on-a-Stick</h2>
<figure class="fig"><svg viewBox="0 0 720 280" role="img" aria-label="router on a stick"><rect x="290" y="20" width="140" height="60" rx="8" class="bx"/><text x="360" y="50" text-anchor="middle">R1</text><text x="360" y="66" text-anchor="middle" class="cap">Gi0/0.20  Gi0/0.30</text><rect x="290" y="120" width="140" height="50" rx="8" class="bx"/><text x="360" y="150" text-anchor="middle">SW1</text><path d="M360 80 V120" class="rq"/><text x="372" y="104" class="cap">802.1Q trunk (one cable)</text><rect x="100" y="220" width="140" height="50" rx="8" class="net"/><text x="170" y="245" text-anchor="middle" class="on">PC1 VLAN 20</text><text x="170" y="261" text-anchor="middle" class="cap">10.10.20.11</text><rect x="480" y="220" width="140" height="50" rx="8" class="hst"/><text x="550" y="245" text-anchor="middle" class="on">Srv1 VLAN 30</text><text x="550" y="261" text-anchor="middle" class="cap">10.10.30.11</text><path d="M170 220 L320 170" class="ln"/><path d="M550 220 L400 170" class="ln"/></svg><figcaption>شکل ۱: یک کابل Trunk بین روتر و سوییچ؛ روتر برای هر VLAN یک Sub-interface دارد.</figcaption></figure>

<p>Sub-interface مثل چند میز در یک ساختمان است: یک در (کابل فیزیکی) دارد ولی هر میز برای یک شرکت (VLAN) کار می‌کند. هر Sub-interface یک آدرس IP دارد که همان Gateway آن VLAN است.</p>

<h2><span class="hn">۳.</span> مسیر بسته (Packet Flow)</h2>
<p>PC1 (10.10.20.11، VLAN 20) به Srv1 (10.10.30.11، VLAN 30) ping می‌زند:</p>
<ol>
<li>PC1 می‌بیند Srv1 در Subnet دیگری است و بسته را به Gateway (10.10.20.1) می‌دهد؛ پس MAC مقصد فریم، MAC روتر است.</li>
<li>سوییچ فریم را با Tag VLAN 20 روی Trunk به روتر می‌فرستد.</li>
<li>روتر روی Gi0/0.20 دریافت می‌کند، جدول Route را می‌بیند (Connected: 10.10.30.0/24 روی Gi0/0.30).</li>
<li>روتر فریم جدید با MAC مقصد Srv1 می‌سازد و با Tag VLAN 30 از همان کابل برمی‌گرداند.</li>
<li>سوییچ Tag را برمی‌دارد و فریم را فقط به پورت Srv1 می‌دهد.</li>
</ol>
<pre><code>IP src/dst stay the same : 10.10.20.11 -> 10.10.30.11
MAC dst changes          : router MAC (hop 1) -> Srv1 MAC (hop 2)
VLAN tag changes         : 20 (in) -> 30 (out)
TTL                      : decreased by 1 at the router</code></pre>
<div class="box"><b class="t">نکته‌ی مهم</b>IP مبدأ و مقصد تغییر نمی‌کنند، ولی MAC و Tag در هر Hop عوض می‌شوند. این همان نکته‌ی «Routing» است که در Capture (درس ۲-۶) دیدید.</div>

<h2><span class="hn">۴.</span> دستورها (خط‌به‌خط)</h2>
<pre><code>SW1(config)# interface gi0/0
SW1(config-if)# switchport trunk encapsulation dot1q
SW1(config-if)# switchport mode trunk
SW1(config-if)# switchport trunk allowed vlan 10,20,30

R1(config)# interface gi0/0
R1(config-if)# no shutdown
R1(config-if)# no ip address
R1(config-if)# interface gi0/0.20
R1(config-subif)# encapsulation dot1Q 20
R1(config-subif)# ip address 10.10.20.1 255.255.255.0
R1(config-subif)# interface gi0/0.30
R1(config-subif)# encapsulation dot1Q 30
R1(config-subif)# ip address 10.10.30.1 255.255.255.0
R1(config-subif)# end</code></pre>
<ul>
<li>Interface فیزیکی بدون IP و روشن (<code>no shutdown</code>) می‌ماند؛ فقط Sub-interfaceها آدرس دارند.</li>
<li><code>encapsulation dot1Q 20</code>: این Sub-interface فقط فریم‌های Tag 20 را می‌گیرد/می‌فرستد. شماره‌ی Sub-interface (.20) فقط یک نام است؛ ولی عرف این است که با VLAN یکی باشد.</li>
<li>اگر Native VLAN داشتید، <code>encapsulation dot1Q 10 native</code>.</li>
</ul>
<pre><code>R1# show ip interface brief
R1# show ip route connected
R1# show interfaces gi0/0.20
R1# ping 10.10.30.11</code></pre>

<h2><span class="hn">۸.</span> تمرین‌ها</h2>
<details><summary>۱ (ساده): چرا فقط یک کابل فیزیکی کافی است؟</summary><pre><code>The trunk carries all VLANs tagged; the router splits them into logical sub-interfaces.</code></pre></details>
<details><summary>۲ (ساده): کدام آدرس IP روی Gi0/0.20 می‌نشیند؟</summary><pre><code>The default gateway of VLAN 20, e.g. 10.10.20.1/24 (first host of the subnet).</code></pre></details>
<details><summary>۳ (متوسط): در مسیر PC1 به Srv1 کدام فیلدها عوض می‌شوند و کدام نه؟</summary><pre><code>Unchanged: source IP, destination IP
Changed: destination MAC, source MAC, VLAN tag, TTL (-1)</code></pre></details>

<h2><span class="hn">۱.</span> SVI چیست؟</h2>
<p>در RoAS روتر بیرون از سوییچ بود. در SVI، خود سوییچ یک «پای مجازی» داخل هر VLAN دارد؛ مثل اینکه یک نفر مستقیم داخل هر اتاق نشسته باشد. هر SVI یک آدرس IP دارد که Gateway آن VLAN است، و سوییچ با <code>ip routing</code> بین SVIها مسیریابی می‌کند.</p>

<h2><span class="hn">۲.</span> شرط Up شدن SVI (مهم‌ترین نکته)</h2>
<p>SVI فقط وقتی <code>up/up</code> می‌شود که همه‌ی شرط‌های زیر برقرار باشند:</p>
<ol>
<li>VLAN روی سوییچ ساخته شده باشد (<code>show vlan brief</code>).</li>
<li>حداقل یک پورت در آن VLAN فعال باشد (Access Port بالا، یا Trunk که VLAN را عبور می‌دهد).</li>
<li>SVI با <code>no shutdown</code> روشن شده باشد.</li>
</ol>

<h2><span class="hn">۷.</span> مثال سخت: TS09 و دو Gateway همزمان</h2>
<pre><code>Symptom   : Vlan30 shows down/down

            show ip interface brief  -> Vlan30 down/down

Verify    : Vlan30 up/up, ping works

Conflict  : R1 Gi0/0.30 AND SW1 Vlan30 both = 10.10.30.1
Result    : duplicate IP, intermittent failures
Rule      : exactly one gateway per VLAN (shut down the other)</code></pre>

<h2><span class="hn">۱.</span> روش سیستماتیک: از پایین به بالا</h2>
<p>مثل بررسی خرابی یک ماشین: اول ببین بنزین دارد (لایه ۱)، بعد استارت می‌خورد (لایه ۲)، بعد جاده را بلد است (لایه ۳). از پایین شروع کنید چون اگر کابل قطع باشد، بقیه‌ی چیزها بی‌معنی است.</p>

<h3>چارچوب پنج‌مرحله‌ای</h3>
<ol>
<li><b>Symptom:</b> دقیقاً چه چیزی خراب است و برای چه کسی؟ (علامت، نه حدس)</li>
<li><b>Scope:</b> چند نفر؟ یک VLAN؟ همه؟</li>
<li><b>Hypothesis:</b> از پایین‌ترین لایه، یک فرضیه بساز.</li>
<li><b>Test:</b> با یک دستور show آن را بسنج.</li>
<li><b>Fix and Verify:</b> رفع، تأیید، ثبت در گزارش (RCA).</li>
</ol>

<h2><span class="hn">۲.</span> پنج سناریوی این هفته</h2>
<h3>TS01: Interface Shutdown (ساده)</h3>
<pre><code>Symptom  : PC on Gi0/1 has no link
Evidence : show interfaces status -> Gi0/1 disabled / administratively down
Fix      : interface gi0/1 / no shutdown
Verify   : link up, ping works</code></pre>
<h3>TS02: Duplex/Speed Mismatch (مفهومی)</h3>
<pre><code>Symptom  : link is up but very slow, many CRC/late collisions
Cause    : one side half-duplex, the other full-duplex
Check    : show interfaces gi0/1 -> duplex, speed, errors
Fix      : set both sides to auto (or both manually identical)</code></pre>
<p>در شبیه‌ساز، تنظیم Duplex ممکن است اثر واقعی نداشته باشد؛ این سناریو را مفهومی بدانید و در تجهیز واقعی تمرین کنید.</p>
<h3>TS03: VLAN اشتباه روی Access Port</h3>
<pre><code>Symptom  : PC cannot reach its gateway
Evidence : show vlan brief -> port is in the wrong VLAN
Fix      : switchport access vlan 20</code></pre>
<h3>TS04: Allowed VLAN حذف‌شده روی Trunk</h3>
<pre><code>Symptom  : one VLAN lost across the trunk
Evidence : show interfaces trunk -> VLAN missing in "allowed"
Fix      : switchport trunk allowed vlan add 30</code></pre>
<h3>TS05: Human Error — جایگزینی Allowed List</h3>
<pre><code>Cause    : "allowed vlan 40" typed without "add"
Impact   : all VLANs except 40 are down on the trunk
Fix      : restore from backup or re-add: allowed vlan 10,20,30,40
Lesson   : always "add"; backup + review show before and after</code></pre>

<h2><span class="hn">۳.</span> مثال ساده/متوسط/سخت</h2>
<h3>ساده</h3>
<p>کاربر می‌گوید «شبکه قطع است». اول <code>show interfaces status</code>: اگر پورت <code>disabled</code> است، TS01.</p>
<h3>متوسط</h3>
<p>کاربر به سرور نمی‌رسد ولی به Gateway می‌رسد. لایه ۱ و ۲ سالم است؛ پس <code>show ip route</code> و Gateway سرور را ببینید (لایه ۳).</p>
<h3>سخت</h3>
<p>«فقط VLAN 30 از شعبه قطع است، بقیه خوب». نردبان: لینک Trunk up است (L1)، VLAN 30 در allowed نیست (L2) ⇒ TS04. در RCA: چه کسی/کی/چرا تغییر داد؟ چطور جلوگیری شود؟</p>

<h2><span class="hn">۴.</span> تمرین‌ها</h2>
<details><summary>۱ (ساده): اولین لایه‌ای که چک می‌کنیم چیست؟</summary><pre><code>Layer 1 (physical): cable, link, shutdown.</code></pre></details>
<details><summary>۲ (ساده): پنج مرحله‌ی چارچوب عیب‌یابی را بنویس</summary><pre><code>Symptom, Scope, Hypothesis, Test, Fix and Verify.</code></pre></details>
<details><summary>۳ (متوسط): «ping به Gateway OK ولی به اینترنت نه»؛ کدام لایه؟</summary><pre><code>Layer 3 or above: routing/default route/NAT/firewall (L1 and L2 are fine).</code></pre></details>
<details><summary>۴ (سخت): یک Trunk بعد از «allowed vlan 40» همه را قطع کرد؛ سه اقدام بعدی</summary><pre><code>1) restore from backup
2) allowed vlan add 10,20,30
3) verify with show interfaces trunk and ping, then write the RCA</code></pre></details>

<h2><span class="hn">۵.</span> Lab هدایت‌شده: همه‌ی TSها را بسازید و رفع کنید</h2>
<p>برای هر سناریو: (۱) بکاپ، (۲) خراب‌کردن عمدی، (۳) نوشتن Symptom و Evidence، (۴) رفع، (۵) Verify.</p>
<ol>
<li>TS01: <code>shutdown</code> روی پورت PC1 و رفع.</li>
<li>TS03: بردن پورت PC2 به VLAN اشتباه و رفع.</li>
<li>TS04: <code>allowed vlan remove 30</code> روی Trunk و رفع با <code>add 30</code>.</li>
<li>TS05: <code>allowed vlan 40</code> (بدون add)، سپس برگرداندن از بکاپ.</li>
<li>TS09: <code>shutdown</code> پورت سرور و دیدن SVI down/down.</li>
</ol>

<li>مسیر یک Packet را از Node داخل PNetLab تا شبکه واقعی و تا سوییچ ایزوله روی کاغذ رسم کنید.</li>
<li>خروجی <code>esxcli</code>، <code>ip</code> و <code>bridge</code> را بخوانید و درباره آن‌ها نتیجه بگیرید.</li>
<li>یک خرابی واقعی (PNetLab بدون لینک) را با روش لایه‌ای عیب‌یابی کنید.</li>
</ul>

<h2><span class="hn">۱.</span> چرا اول فقط مشاهده؟</h2>
<p>قبل از هر تغییر، باید بدانیم «الان چه چیزی هست» (<span class="en">As-Is</span>). بدون این، اگر چیزی خراب شود نمی‌دانیم به کدام وضعیت برگردیم. هر تغییر هم سه چیز لازم دارد: <span class="en">Backup</span>، <span class="en">Rollback Plan</span> و تأیید. این همان رویه‌ای است که در شبکه‌های سازمانی واقعی رعایت می‌شود.</p>

<h2><span class="hn">۲.</span> نقشه As-Is شما (بعد از CHG-0001)</h2>

<h2><span class="hn">۴.</span> مفهوم و مسیر Packet</h2>
<p><b>Port Group</b> (گروه پورت) در ESXi مجموعه تنظیمات یک شبکه مجازی است؛ <b>VLAN 4095</b> یعنی «همه VLANها بدون حذف برچسب (Tag)» عبور کنند. چون سوییچ‌ها و FortiGate داخل PNetLab VLANها را می‌سازند، ESXi فقط یک لوله ایزوله می‌دهد.</p>
<p>مسیر ترافیک مدیریتی: PC شما → WireGuard → MikroTik → LAN → <code>vmnic0</code> → <code>vSwitch0</code> → Port Group <code>VM Network</code> → کارت VM → <code>pnet0</code> → سرویس وب/SSH PNetLab. ترافیک Lab فقط روی <code>pnet1</code> و <code>vSwitch-FGT</code> می‌ماند و به شبکه واقعی نمی‌رسد (چون Uplink ندارد).</p>
<p>سه گزینه Security روی <code>PG-FGT-TRUNK</code> (<span class="en">Promiscuous، MAC address changes، Forged transmits</span>) چون PNetLab چند MAC مجازی پشت یک کارت دارد، باید «Accept» باشند.</p>

<ol>
<li>اسکریپت‌های فقط‌خواندنی را از طریق SSH روی ESXi و PNetLab اجرا کردید.</li>
<li>خروجی‌ها را خواندید و منابع (CPU/RAM/Disk) را ثبت کردید.</li>
<li>مشکل لینک را پیدا کردید و با <code>CHG-0001</code> رفع کردید.</li>
</ol>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> چرا یک «حلقه» (<span class="en">Loop</span>) در لایه ۲ شبکه را در چند ثانیه از کار می‌اندازد، و پروتکل <span class="en">STP</span> چطور با «بستن» بعضی پورت‌ها جلوی آن را می‌گیرد.</p>
<p><b>چرا لازم است:</b> در لایه ۲ بسته‌ها TTL ندارند. اگر دو سوییچ با دو کابل به هم وصل شوند، یک Broadcast تا ابد بین آن‌ها می‌چرخد و هر دور بیشتر می‌شود (طوفان Broadcast). بدون STP، یک کابل اضافه که اشتباهاً وصل شود کل شعبه را قطع می‌کند.</p>
<ul>
<li><b>در کار روزانه:</b> هر شبکه‌ی سازمانی لینک‌های اضافه (Redundant) دارد و باید بدون Loop باشد.</li>
<li><b>در امنیت:</b> مهاجم می‌تواند با BPDU جعلی خود را Root کند و ترافیک را از خودش عبور دهد.</li>
<li><b>در عیب‌یابی:</b> پیام MACFLAP و CPU ۱۰۰٪ سوییچ نشانه‌ی کلاسیک Loop است.</li>
</ul>
<div class="box"><b class="t">مسیر درس</b>مشکل Loop ← ایده‌ی STP ← BPDU و Root Bridge ← نقش و حالت پورت‌ها ← مثال ساده/متوسط/سخت ← Lab ← عیب‌یابی.</div>

<h2><span class="hn">۱.</span> مشکل: لینک اضافه یعنی Loop</h2>
<p>برای اینکه با خراب‌شدن یک کابل شبکه قطع نشود، بین سوییچ‌ها لینک اضافه (Redundancy) می‌کشیم. اما در اترنت، فریم Broadcast از همه‌ی پورت‌ها به‌جز ورودی پخش می‌شود. اگر مسیر حلقه‌ای وجود داشته باشد، فریم بارها و بارها می‌چرخد.</p>
<p>مثال روزمره: یک چهارراه با خیابان‌های دایره‌ای که ماشین‌ها هیچ‌وقت خارج نمی‌شوند و هر دقیقه ماشین‌های بیشتری وارد می‌شود؛ خیلی زود کل شهر قفل می‌شود.</p>

<h3>سه عارضه‌ی Loop</h3>
<ol>
<li><b>Broadcast Storm:</b> ترافیک تکراری پهنای باند را کامل مصرف می‌کند.</li>
<li><b>MAC Table Instability:</b> یک MAC مدام بین دو پورت پرش می‌کند (MACFLAP).</li>
<li><b>CPU بالا:</b> سوییچ مجبور است همین فریم‌ها را پردازش کند و دیگر جواب نمی‌دهد.</li>
</ol>
<h2><span class="hn">۲.</span> ایده‌ی STP: یک درخت، بدون حلقه</h2>
<p>STP از روی گراف شبکه یک «درخت» می‌سازد: یک ریشه (Root) انتخاب می‌کند و برای هر سوییچ فقط یک مسیر فعال به ریشه نگه می‌دارد. لینک‌های اضافه به‌صورت Blocking در حالت آماده‌باش می‌مانند و اگر لینک اصلی خراب شد، فعال می‌شوند.</p>
<h3>مراحل کار STP (سه تصمیم)</h3>
<ol>
<li><b>انتخاب Root Bridge:</b> سوییچی با کوچک‌ترین Bridge ID برنده است.</li>
<li><b>انتخاب Root Port:</b> هر سوییچ غیر Root، پورتی را انتخاب می‌کند که کمترین هزینه تا Root را دارد.</li>
<li><b>انتخاب Designated Port:</b> روی هر Segment، پورتی که به Root نزدیک‌تر است فعال می‌ماند؛ پورت‌های باقی‌مانده Blocking می‌شوند.</li>
</ol>
<h3>Bridge ID چیست؟</h3>
<p>Bridge ID از دو بخش ساخته می‌شود: اولویت (Priority) و MAC سوییچ. اولویت پیش‌فرض ۳۲۷۶۸ است. در PVST+ برای هر VLAN یک نمونه از STP اجرا می‌شود و شماره‌ی VLAN به اولویت اضافه می‌شود:</p>
<pre><code>Bridge ID = Priority + VLAN ID + MAC address
Example (VLAN 10): 32768 + 10 = 32778 , MAC 0001.aaaa.0001
Lowest Bridge ID wins the Root election</code></pre>
<p>اگر اولویت‌ها برابر بود، MAC کوچک‌تر برنده است. چون MAC معمولاً به سن سوییچ بستگی دارد، سوییچ «قدیمی‌ترین» ممکن است Root شود؛ همین یک اشتباه رایج طراحی است. باید Root را عمداً انتخاب کنیم (درس ۴-۲).</p>
<h3>هزینه‌ی مسیر (Path Cost)</h3>
<p>سوییچ‌ها هزینه‌ی مسیر تا Root را با جمع‌کردن هزینه‌ی لینک‌ها حساب می‌کنند. لینک سریع‌تر هزینه‌ی کمتر دارد:</p>
<table>
<tr><th>سرعت لینک</th><th>هزینه (روش کوتاه، Short)</th><th>هزینه (روش بلند، Long)</th></tr>
<tr><td>10 Mbps</td><td>100</td><td>2,000,000</td></tr>
<tr><td>100 Mbps</td><td>19</td><td>200,000</td></tr>
<tr><td>1 Gbps</td><td>4</td><td>20,000</td></tr>
<tr><td>10 Gbps</td><td>2</td><td>2,000</td></tr>
</table>
<h3>حالت‌ها و نقش پورت‌ها</h3>
<table>
<tr><th>STP کلاسیک (802.1D)</th><th>کار پورت</th></tr>
<tr><td>Blocking</td><td>فریم داده نمی‌فرستد، فقط BPDU می‌شنود</td></tr>
<tr><td>Listening</td><td>BPDU می‌شنود و پردازش می‌کند، MAC یاد نمی‌گیرد</td></tr>
<tr><td>Learning</td><td>MAC یاد می‌گیرد، هنوز داده نمی‌فرستد</td></tr>
<tr><td>Forwarding</td><td>کار عادی</td></tr>
<tr><td>Disabled</td><td>خاموش</td></tr>
</table>
<p>در STP کلاسیک، تا Forwarding شدن یک پورت ۳۰ تا ۵۰ ثانیه طول می‌کشد. این تأخیر در شبکه‌ی امروز قابل‌قبول نیست؛ پس از RSTP استفاده می‌کنیم (درس بعد).</p>
<pre><code>Blocking (20 s max age) -> Listening (15 s) -> Learning (15 s) -> Forwarding
Worst-case convergence = 20 + 15 + 15 = 50 seconds</code></pre>
<h2><span class="hn">۳.</span> مثال ساده: دو سوییچ، دو لینک</h2>
<p>SW-A و SW-B با دو کابل به هم وصل‌اند. هر دو با اولویت ۳۲۷۶۸. MAC سوییچ A کوچک‌تر است.</p>
<pre><code>Election: priority equal (32768) -> lower MAC wins
Root Bridge = SW-A
On SW-B: both uplinks lead to Root with the same cost
  -> choose the lower port ID (Gi0/1) as Root Port
  -> Gi0/2 becomes Blocking (Alternate)</code></pre>
<h2><span class="hn">۴.</span> مثال متوسط: سه سوییچ، مثلث</h2>
<pre><code>Bridge IDs: SW-A 32769.0001.aaaa.0001 (VLAN1)
            SW-B 32769.0001.aaaa.0002
            SW-C 32769.0001.aaaa.0003
Root Bridge = SW-A (lowest MAC)

SW-B -> Root: direct link, cost 4 (1G)          -> Root Port = link A-B
SW-C -> Root: direct link, cost 4 (1G)          -> Root Port = link A-C
Segment B-C: both sides cost 4 to Root; tie -> lower Bridge ID
  SW-B has lower ID than SW-C -> SW-B port is Designated (Forwarding)
  SW-C port on B-C is Alternate (Blocking)</code></pre>
<p>نتیجه: فقط پورت SW-C سمت لینک B-C بسته می‌شود؛ مثلث به یک درخت (A در ریشه، B و C فرزند) تبدیل شد.</p>
<h2><span class="hn">۵.</span> مثال سخت: چرا Root اشتباه خطرناک است؟</h2>
<p>در یک شعبه، یک سوییچ قدیمی دسترسی در انتهای شبکه، چون MAC کوچک دارد، Root می‌شود. حالا همه‌ی ترافیک بین سرورها و کاربران از لینک ۱۰۰ مگابیتی آن سوییچ عبور می‌کند.</p>
<pre><code>Symptom  : network slow, traffic path goes through an old access switch
Check    : show spanning-tree vlan 10  -> "This bridge is the root" on the wrong switch
Cause    : default priority + lowest MAC
Fix      : set core switch priority lower (e.g. 4096) or "root primary"</code></pre>
<h2><span class="hn">۶.</span> دستورهای مشاهده</h2>
<pre><code>SW1# show spanning-tree
SW1# show spanning-tree vlan 10
SW1# show spanning-tree summary
SW1# show spanning-tree root
SW1# show spanning-tree interface gi0/1 detail</code></pre>
<ul>
<li><code>show spanning-tree vlan 10</code>: Root، Bridge ID خودش، نقش هر پورت (Root/Desg/Altn) و حالت آن.</li>
<li><code>show spanning-tree root</code>: خلاصه‌ی Root هر VLAN.</li>
<li><code>show spanning-tree summary</code>: حالت STP و تعداد پورت‌ها به‌تفکیک.</li>
</ul>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): چرا Loop در لایه ۲ خطرناک‌تر از لایه ۳ است؟</summary><pre><code>Layer-2 frames have no TTL, so they never expire.
Layer-3 packets have a TTL and are dropped when it reaches 0.</code></pre>
</details>
<details><summary>۲ (ساده): Root Bridge را چطور انتخاب می‌کنند؟</summary><pre><code>Lowest Bridge ID = lowest (Priority + VLAN ID), then lowest MAC address.</code></pre>
</details>
<details><summary>۳ (متوسط): دو سوییچ با اولویت 32768 و 4096؛ کدام Root است؟</summary><pre><code>The switch with priority 4096 (lower value wins).</code></pre>
</details>
<details><summary>۴ (متوسط): هزینه‌ی مسیر سه لینک ۱ گیگ پشت‌سرهم تا Root با روش Short؟</summary><pre><code>Cost = 4 + 4 + 4 = 12</code></pre>
</details>
<details><summary>۵ (سخت): در مثلث A (Root)، B، C با لینک‌های 1G، اگر لینک A-C خراب شود، SW-C از کدام مسیر Root را می‌بیند و هزینه چقدر است؟</summary><pre><code>New path: C -> B -> A
Cost = 4 (C-B) + 4 (B-A) = 8
The previously blocked port on C (towards B) becomes the Root Port.</code></pre>
</details>

<h2><span class="hn">۱.</span> RSTP چه چیزی را سریع کرد؟</h2>
<p>RSTP همان ایده‌ی STP است ولی به‌جای انتظار با تایمرها، سوییچ‌ها با هم «مذاکره» می‌کنند (Proposal/Agreement). حالت‌ها هم ساده‌تر شده‌اند:</p>
<table>
<tr><th>STP کلاسیک</th><th>RSTP</th></tr>
<tr><td>Blocking</td><td>Discarding</td></tr>
<tr><td>Listening</td><td>Discarding</td></tr>
<tr><td>Learning</td><td>Learning</td></tr>
<tr><td>Forwarding</td><td>Forwarding</td></tr>
</table>
<p>نقش‌ها هم یک نقش جدید دارند:</p>
<table>
<tr><th>نقش</th><th>معنی</th></tr>
<tr><td>Root Port</td><td>بهترین مسیر به Root</td></tr>
<tr><td>Designated Port</td><td>پورت فعال هر Segment</td></tr>
<tr><td>Alternate Port</td><td>پشتیبان Root Port (همگرایی در حد ثانیه)</td></tr>
<tr><td>Backup Port</td><td>پشتیبان Designated Port روی همان Segment</td></tr>
</table>
<pre><code>STP  : 30-50 seconds to converge
RSTP : usually 1-2 seconds (link failure with alternate port)</code></pre>
<h2><span class="hn">۲.</span> فعال‌کردن Rapid-PVST+</h2>
<pre><code>SW1(config)# spanning-tree mode rapid-pvst
SW1# show spanning-tree summary</code></pre>
<p>در خروجی باید بنویسد <code>Switch is in rapid-pvst mode</code>. این دستور باید روی همه‌ی سوییچ‌ها یکسان زده شود؛ ترکیب حالت‌ها سازگار است ولی همگرایی سریع از دست می‌رود.</p>
<h2><span class="hn">۳.</span> تعیین عمدی Root</h2>
<p>دو روش داریم. روش اول Macro است و خودش اولویت را کم می‌کند؛ روش دوم دستی است و دقیق‌تر:</p>
<pre><code>SW1(config)# spanning-tree vlan 1,10,20,30 root primary
SW2(config)# spanning-tree vlan 1,10,20,30 root secondary

! manual equivalent:
SW1(config)# spanning-tree vlan 10 priority 4096
SW2(config)# spanning-tree vlan 10 priority 8192</code></pre>
<ul>
<li><code>root primary</code>: اولویت را به اندازه‌ای کم می‌کند که Root شود (معمولاً 24576 یا کمتر).</li>
<li><code>root secondary</code>: اولویت 28672 برای نقش Root پشتیبان.</li>
<li>اولویت باید مضرب 4096 باشد (چون ۱۲ بیت دیگر برای شماره‌ی VLAN رزرو است).</li>
</ul>
<pre><code>Priority values allowed: 0, 4096, 8192, ... 61440 (multiples of 4096)
Default priority : 32768
Bridge priority in BPDU = Priority + VLAN ID  (e.g. 4096 + 10 = 4106)</code></pre>
<div class="box"><b class="t">قانون طراحی</b>Root را همیشه روی سوییچ هسته (Core / Distribution) بگذارید و Root پشتیبان را روی هم‌ترازش. هرگز نگذارید یک سوییچ دسترسی Root شود.</div>
<h2><span class="hn">۴.</span> PortFast: پورت کاربر را سریع بالا بیاور</h2>
<p>پورتی که به کامپیوتر یا پرینتر وصل است نمی‌تواند Loop بسازد. پس نیازی نیست منتظر مراحل STP بماند. PortFast آن را فوراً Forwarding می‌کند:</p>
<pre><code>SW1(config)# interface range gi0/1 - 4
SW1(config-if-range)# switchport mode access
SW1(config-if-range)# spanning-tree portfast

! or enable globally for all access ports:
SW1(config)# spanning-tree portfast default</code></pre>
<div class="box"><b class="t">هشدار</b>PortFast فقط روی پورت‌های دستگاه انتهایی. روی لینک بین سوییچ‌ها خطرناک است، چون ممکن است Loop بسازد. برای همین حتماً با BPDU Guard همراه می‌شود.</div>
<h2><span class="hn">۵.</span> BPDU Guard: اگر BPDU آمد، پورت را خاموش کن</h2>
<p>پورت کاربر هرگز نباید BPDU دریافت کند. اگر دریافت کرد، یعنی کسی سوییچ وصل کرده. BPDU Guard پورت را به حالت <span class="en">err-disabled</span> می‌برد:</p>
<pre><code>SW1(config)# interface gi0/1
SW1(config-if)# spanning-tree bpduguard enable

! global default for PortFast ports:
SW1(config)# spanning-tree portfast bpduguard default

! recovery (optional, careful):
SW1(config)# errdisable recovery cause bpduguard
SW1(config)# errdisable recovery interval 300</code></pre>
<pre><code>SW1# show interfaces status err-disabled
SW1# show spanning-tree summary
SW1# show spanning-tree interface gi0/1 detail</code></pre>
<p>بعد از رفع علت، پورت را دستی روشن کنید: <code>shutdown</code> سپس <code>no shutdown</code>. اگر <code>errdisable recovery</code> تنظیم شده باشد، بعد از ۳۰۰ ثانیه خودکار برمی‌گردد (ولی اگر علت هنوز هست، دوباره خاموش می‌شود).</p>
<h2><span class="hn">۶.</span> Root Guard: جلوی Root ناخواسته</h2>
<p>روی پورت‌هایی که به سمت سوییچ‌های «مشتری» یا بیرون از کنترل شما می‌روند، اگر BPDU بهتر (ادعای Root) رسید، پورت وارد حالت <code>root-inconsistent</code> می‌شود و ترافیک را نمی‌پذیرد:</p>
<pre><code>SW1(config)# interface gi0/10
SW1(config-if)# spanning-tree guard root
SW1# show spanning-tree inconsistentports</code></pre>
<table>
<tr><th>ابزار</th><th>روی کدام پورت</th><th>عکس‌العمل</th></tr>
<tr><td>PortFast</td><td>پورت دستگاه انتهایی</td><td>فوراً Forwarding</td></tr>
<tr><td>BPDU Guard</td><td>پورت دستگاه انتهایی</td><td>err-disabled با دریافت BPDU</td></tr>
<tr><td>Root Guard</td><td>پورت به سمت خارج از کنترل شما</td><td>root-inconsistent با BPDU برتر</td></tr>
</table>
<h2><span class="hn">۷.</span> مثال ساده/متوسط/سخت</h2>
<h3>ساده</h3>
<pre><code>Task  : make SW1 the root for VLAN 10
Cmd   : spanning-tree vlan 10 root primary
Verify: show spanning-tree vlan 10  -> "This bridge is the root"</code></pre>
<h3>متوسط</h3>
<p>کاربری یک سوییچ کوچک خانگی را به پورت دیوار وصل می‌کند. بدون BPDU Guard ممکن است Loop بسازد یا Root شود؛ با BPDU Guard پورت خاموش می‌شود:</p>
<pre><code>Log: %SPANTREE-2-BLOCK_BPDUGUARD: Received BPDU on port Gi0/3 with BPDU Guard enabled
Show: show interfaces status err-disabled -> Gi0/3 err-disabled bpduguard</code></pre>
<h3>سخت</h3>
<p>در شبکه‌ی ۳ سوییچی، Root را روی SW1 و Root پشتیبان را روی SW2 بگذارید، روی پورت‌های دسترسی SW3 PortFast و BPDU Guard فعال کنید، روی پورت اتصال به شبکه‌ی خارجی Root Guard؛ سپس نشان دهید با قطع SW1 همگرایی کمتر از چند ثانیه است.</p>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): چرا RSTP سریع‌تر است؟</summary><pre><code>Switches negotiate (proposal/agreement) instead of waiting for timers; alternate ports are ready.</code></pre>
</details>
<details><summary>۲ (ساده): اولویت‌های مجاز؟</summary><pre><code>Multiples of 4096 (0, 4096, 8192, ... 61440). Default 32768.</code></pre>
</details>
<details><summary>۳ (متوسط): PortFast بدون BPDU Guard چه خطری دارد؟</summary><pre><code>A switch plugged into a PortFast port can create a loop before STP reacts; BPDU Guard shuts the port.</code></pre>
</details>
<details><summary>۴ (متوسط): پورت err-disabled شد؛ مراحل رفع؟</summary><pre><code>1) show interfaces status err-disabled
2) remove the cause (rogue switch)
3) shutdown, then no shutdown
4) verify</code></pre>
</details>
<details><summary>۵ (سخت): Root Guard را روی کدام پورت‌ها می‌گذاریم و چرا؟</summary><pre><code>On ports that face switches you do not control (customer/edge); a superior BPDU there puts the port in root-inconsistent state so no foreign switch becomes root.</code></pre>
</details>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> چطور چند کابل فیزیکی بین دو سوییچ را به‌صورت یک لینک منطقی (<span class="en">EtherChannel</span>) در بیاوریم، با پروتکل <span class="en">LACP</span>؛ و چرا دو سر لینک باید تنظیمات یکسان داشته باشند.</p>
<p><b>چرا لازم است:</b> اگر بین دو سوییچ دو کابل بکشید، STP یکی را می‌بندد و نیمی از پهنای باند هدر می‌رود. EtherChannel دو (تا هشت) کابل را یکی می‌کند: پهنای باند جمع می‌شود و با قطع یک کابل ارتباط قطع نمی‌شود.</p>
<ul>
<li><b>در کار روزانه:</b> لینک بین سوییچ‌های Core و Distribution تقریباً همیشه EtherChannel است.</li>
<li><b>در امنیت:</b> EtherChannel نادرست باعث Loop یا قطع ناگهانی می‌شود؛ کنترل Mismatch ضروری است.</li>
<li><b>در FortiGate:</b> همین مفهوم با «Aggregate Interface» در فایروال تکرار می‌شود.</li>
</ul>

<h2><span class="hn">۱.</span> مشکل: دو کابل، یک کابل کار می‌کند</h2>
<p>دو سوییچ را با دو کابل ۱ گیگ وصل می‌کنیم تا هم پهنای باند بیشتر داشته باشیم و هم تحمل خطا. اما STP دو لینک موازی را «Loop» می‌داند و یکی را Block می‌کند. نتیجه: فقط ۱ گیگ، نه ۲ گیگ.</p>
<p>مثال روزمره: دو باند موازی در یک جاده که یکی را بسته‌اند چون فکر می‌کنند دور می‌زند. EtherChannel به STP می‌گوید این دو باند «یک جاده‌ی دوبانده» هستند.</p>
<figure class="fig"><svg viewBox="0 0 720 200" role="img" aria-label="topology"><path d="M115 100 L605 100" class="rq"/><text x="360" y="94" text-anchor="middle" class="cap">Gi0/1</text><path d="M115 100 L605 100" class="rq"/><text x="360" y="94" text-anchor="middle" class="cap">Gi0/2</text><rect x="40" y="70" width="150" height="60" rx="8" class="bx"/><text x="115" y="98" text-anchor="middle">SW1</text><text x="115" y="114" text-anchor="middle" class="cap">Po1</text><rect x="530" y="70" width="150" height="60" rx="8" class="bx"/><text x="605" y="98" text-anchor="middle">SW2</text><text x="605" y="114" text-anchor="middle" class="cap">Po1</text></svg><figcaption>شکل ۱: دو لینک فیزیکی که STP آن‌ها را یک لینک منطقی (Po1) می‌بیند.</figcaption></figure>
<h2><span class="hn">۲.</span> EtherChannel چطور کار می‌کند؟</h2>
<ul>
<li>چند پورت فیزیکی عضو یک <b>Port-Channel</b> می‌شوند.</li>
<li>STP و Trunk فقط Port-Channel را می‌بینند، نه پورت‌های عضو.</li>
<li>توزیع ترافیک به‌صورت Hash است: هر جریان (مثلاً یک جفت IP) یک لینک را می‌گیرد؛ پس یک جریان تنها از یک لینک می‌رود و ۱ گیگ می‌ماند، ولی چند جریان روی لینک‌ها پخش می‌شود.</li>
<li>اگر یک لینک قطع شود، ترافیک به لینک‌های دیگر منتقل می‌شود.</li>
</ul>
<div class="box"><b class="t">نکته‌ی مهم</b>EtherChannel سرعت یک ارتباط تکی را بیشتر نمی‌کند؛ ظرفیت کل را بالا می‌برد و تحمل خطا می‌دهد.</div>
<h2><span class="hn">۳.</span> LACP یا PAgP یا ثابت؟</h2>
<table>
<tr><th>حالت</th><th>پروتکل</th><th>Modeهای مجاز</th></tr>
<tr><td>LACP</td><td>استاندارد 802.3ad، با تجهیزات هر سازنده</td><td>active / passive</td></tr>
<tr><td>PAgP</td><td>اختصاصی سیسکو</td><td>desirable / auto</td></tr>
<tr><td>Static</td><td>بدون مذاکره (خطرناک)</td><td>on</td></tr>
</table>
<table>
<tr><th>ترکیب دو سر</th><th>نتیجه</th></tr>
<tr><td>active — active</td><td>Channel تشکیل می‌شود</td></tr>
<tr><td>active — passive</td><td>Channel تشکیل می‌شود</td></tr>
<tr><td>passive — passive</td><td>تشکیل نمی‌شود (هر دو منتظرند)</td></tr>
<tr><td>on — active</td><td>تشکیل نمی‌شود (Mismatch)</td></tr>
<tr><td>LACP — PAgP</td><td>تشکیل نمی‌شود</td></tr>
</table>
<p>توصیه: همیشه LACP با <code>active</code> در هر دو سر.</p>
<h2><span class="hn">۴.</span> شرط‌های یکسان بودن پورت‌ها</h2>
<p>همه‌ی پورت‌های عضو باید این‌ها را یکسان داشته باشند، وگرنه Channel بالا نمی‌آید یا Suspend می‌شود:</p>
<ul>
<li>سرعت و Duplex</li>
<li>حالت Trunk/Access و VLANهای مجاز و Native</li>
<li>VLAN دسترسی (برای Access)</li>
<li>تنظیمات STP پورت</li>
</ul>
<h2><span class="hn">۵.</span> دستورها (خط‌به‌خط)</h2>
<pre><code>SW1(config)# interface range gi0/1 - 2
SW1(config-if-range)# switchport trunk encapsulation dot1q
SW1(config-if-range)# switchport mode trunk
SW1(config-if-range)# channel-group 1 mode active
SW1(config-if-range)# exit
SW1(config)# interface port-channel 1
SW1(config-if)# switchport trunk allowed vlan 10,20,30
SW1(config-if)# switchport trunk native vlan 999</code></pre>
<ul>
<li><code>channel-group 1 mode active</code>: پورت را عضو Port-Channel شماره‌ی ۱ می‌کند و LACP را فعال.</li>
<li>تنظیمات Trunk را هم روی Port-Channel بزنید (نه فقط پورت‌ها)، تا تغییرات یکجا اعمال شود.</li>
</ul>
<pre><code>SW1# show etherchannel summary
SW1# show etherchannel port-channel
SW1# show interfaces port-channel 1
SW1# show lacp neighbor
SW1# show etherchannel load-balance</code></pre>
<p>در <code>show etherchannel summary</code> حروف داخل پرانتز مهم‌اند:</p>
<table>
<tr><th>علامت</th><th>معنی</th></tr>
<tr><td>P</td><td>پورت در Bundle است (سالم)</td></tr>
<tr><td>I</td><td>پورت مستقل (Stand-alone) است</td></tr>
<tr><td>D</td><td>Down</td></tr>
<tr><td>s</td><td>Suspended (Mismatch)</td></tr>
<tr><td>SU</td><td>Port-channel: L2 و In-use</td></tr>
<tr><td>SD</td><td>Port-channel: L2 و Down</td></tr>
</table>
<h2><span class="hn">۶.</span> مثال‌ها</h2>
<h3>ساده</h3>
<pre><code>Po1(SU)  Gi0/1(P)  Gi0/2(P)
Meaning: Layer-2 port-channel in use, both members bundled</code></pre>
<h3>متوسط: Mismatch</h3>
<pre><code>Po1(SD)  Gi0/1(s)  Gi0/2(D)
Cause: native VLAN or allowed VLAN list differs on the two ports/sides
Fix  : make all member ports identical, then shutdown/no shutdown the ports</code></pre>
<h3>سخت: توزیع ترافیک (Load Balancing)</h3>
<p>سوییچ با Hash روی مبدأ و مقصد MAC یا IP، لینک را انتخاب می‌کند. اگر فقط یک سرور به یک کلاینت ترافیک بفرستد، همیشه یک لینک پر می‌شود. راه‌حل: Hash بر اساس IP و پورت (در تجهیزات پشتیبان) یا افزایش تنوع جریان‌ها.</p>
<pre><code>SW1(config)# port-channel load-balance src-dst-ip
SW1# show etherchannel load-balance</code></pre>
<div class="box"><b class="t">صادقانه درباره‌ی Lab</b>در شبیه‌ساز vIOSL2 موتور LACP روشن است ولی در Probe اولیه دیدیم Po1 بدون همتای واقعی در حالت <code>SD</code> می‌ماند (پیام «LACP currently not enabled on remote port»). پس Lab را با دو سوییچ شبیه‌سازی‌شده انجام دهید و اگر Bundle تشکیل نشد، ثبت کنید؛ این بخش در Lab واقعی (سخت‌افزار) کاملاً تمرین می‌شود.</div>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): چرا EtherChannel لازم است؟</summary><pre><code>Without it STP blocks the parallel link; with it the links are bundled into one logical link.</code></pre>
</details>
<details><summary>۲ (ساده): LACP با کدام Modeها؟</summary><pre><code>active and passive</code></pre>
</details>
<details><summary>۳ (متوسط): کدام ترکیب Channel نمی‌سازد؟</summary><pre><code>passive-passive, on-active, LACP-PAgP</code></pre>
</details>
<details><summary>۴ (متوسط): تفسیر Po1(SD) Gi0/1(D) Gi0/2(D)</summary><pre><code>Port-channel is down; both member ports are down (cable or remote side down).</code></pre>
</details>
<details><summary>۵ (سخت): چرا ۲ لینک ۱G برای یک انتقال فایل تکی ۲G سرعت نمی‌دهد؟</summary><pre><code>A single flow is hashed to one member link, so one flow is limited to 1G; many flows spread across links.</code></pre>
</details>

<h2><span class="hn">۱.</span> تهدید: «کسی کابل را به پورت خالی زد»</h2>
<p>سوییچ پورت‌های متعددی دارد و معمولاً بعضی از آن‌ها در دیوار سالن آزاد هستند. مهمان یا مهاجم لپ‌تاپ را وصل می‌کند و به شبکه می‌رسد. تهدید دوم: مهاجم هزاران MAC جعلی می‌فرستد تا جدول MAC پر شود و سوییچ شروع به Flooding کند؛ آنگاه ترافیک را می‌شنود.</p>
<h2><span class="hn">۲.</span> ایده‌ی Port Security</h2>
<p>روی هر پورت می‌گوییم: «فقط N تا MAC مجاز است، و آن‌ها این‌ها هستند». اگر MAC دیگری آمد، واکنش تعریف‌شده اجرا می‌شود. سه چیز باید تعیین کنیم:</p>

<li><b>حداکثر MAC</b> (Maximum): معمولاً ۱ برای کامپیوتر، ۲ برای کامپیوتر+IP Phone.</li>
<li><b>MACهای مجاز:</b> دستی (static)، یا یادگیری خودکار (sticky).</li>
<li><b>واکنش (Violation):</b> shutdown، restrict یا protect.</li>
</ol>

<tr><th>Violation</th><th>فریم غیرمجاز</th><th>پورت</th><th>لاگ/شمارنده</th></tr>

<tr><td>restrict</td><td>دور ریخته</td><td>فعال می‌ماند</td><td>بله</td></tr>
<tr><td>protect</td><td>دور ریخته</td><td>فعال می‌ماند</td><td>خیر</td></tr>

<h2><span class="hn">۱.</span> DHCP چطور کار می‌کند؟ (DORA)</h2>
<p>کلاینت تازه‌وارد IP ندارد و نمی‌داند سرور کجاست؛ پس فریاد می‌زند (Broadcast) و سرور جواب می‌دهد. چهار پیام داریم:</p>
<figure class="fig"><svg viewBox="0 0 720 222" role="img" aria-label="sequence"><rect x="55" y="10" width="130" height="34" rx="8" class="bx"/><text x="120" y="32" text-anchor="middle">Client</text><path d="M120 44 V216" class="ln" stroke-dasharray="4 4"/><rect x="295" y="10" width="130" height="34" rx="8" class="bx"/><text x="360" y="32" text-anchor="middle">Switch</text><path d="M360 44 V216" class="ln" stroke-dasharray="4 4"/><rect x="535" y="10" width="130" height="34" rx="8" class="bx"/><text x="600" y="32" text-anchor="middle">DHCP Server</text><path d="M600 44 V216" class="ln" stroke-dasharray="4 4"/><path d="M120 75 H600" class="rq"/><path d="M592 70 l8 5 l-8 5" class="rq"/><text x="360" y="67" text-anchor="middle" class="cap">1 DISCOVER (broadcast)</text><path d="M600 113 H120" class="rp"/><path d="M128 108 l-8 5 l8 5" class="rp"/><text x="360" y="105" text-anchor="middle" class="cap">2 OFFER</text><path d="M120 151 H600" class="rq"/><path d="M592 146 l8 5 l-8 5" class="rq"/><text x="360" y="143" text-anchor="middle" class="cap">3 REQUEST (broadcast)</text><path d="M600 189 H120" class="rp"/><path d="M128 184 l-8 5 l8 5" class="rp"/><text x="360" y="181" text-anchor="middle" class="cap">4 ACK</text></svg><figcaption>شکل ۱: چهار مرحله‌ی DORA بین کلاینت و سرور.</figcaption></figure>
<table>
<tr><th>مرحله</th><th>پیام</th><th>نوع</th><th>محتوا</th></tr>
<tr><td>D</td><td>Discover</td><td>Broadcast</td><td>کلاینت: «سرور DHCP هست؟»</td></tr>
<tr><td>O</td><td>Offer</td><td>Unicast/Broadcast</td><td>سرور: «این IP را پیشنهاد می‌کنم»</td></tr>
<tr><td>R</td><td>Request</td><td>Broadcast</td><td>کلاینت: «همین IP را می‌خواهم»</td></tr>
<tr><td>A</td><td>Acknowledge</td><td>Unicast/Broadcast</td><td>سرور: «تأیید؛ مدت Lease این است»</td></tr>
</table>
<p>در پاسخ، سرور IP، Mask، Gateway، DNS و زمان اجاره (Lease) را می‌دهد. اگر هیچ پاسخی نرسد، کلاینت Windows خودش آدرس <code>169.254.x.x</code> می‌سازد (درس ۲-۱).</p>
<h2><span class="hn">۲.</span> تهدید: DHCP جعلی</h2>
<p>چون Discover یک Broadcast است، هر سرور DHCP در شبکه می‌تواند جواب دهد؛ و کلاینت معمولاً اولین پاسخ را می‌پذیرد. مهاجم با یک سرور جعلی، Gateway را آدرس خودش می‌گذارد و همه‌ی ترافیک را می‌بیند.</p>
<h2><span class="hn">۳.</span> DHCP Snooping: فقط پورت مجاز OFFER بدهد</h2>
<figure class="fig"><svg viewBox="0 0 720 260" role="img" aria-label="topology"><path d="M360 48 L125 178" class="rp"/><text x="242" y="107" text-anchor="middle" class="cap">trusted</text><path d="M360 48 L595 178" class="rq"/><text x="477" y="107" text-anchor="middle" class="cap">blocked</text><path d="M360 48 L360 218" class="ln"/><rect x="280" y="20" width="160" height="56" rx="8" class="bx"/><text x="360" y="46" text-anchor="middle">Switch</text><text x="360" y="62" text-anchor="middle" class="cap">DHCP Snooping</text><rect x="40" y="150" width="170" height="56" rx="8" class="hst"/><text x="125" y="176" text-anchor="middle" class="on">Real DHCP</text><text x="125" y="192" text-anchor="middle" class="cap">trusted port</text><rect x="510" y="150" width="170" height="56" rx="8" class="wrn"/><text x="595" y="176" text-anchor="middle" class="on">Rogue DHCP</text><text x="595" y="192" text-anchor="middle" class="cap">untrusted</text><rect x="275" y="190" width="170" height="56" rx="8" class="net"/><text x="360" y="216" text-anchor="middle" class="on">Client</text><text x="360" y="232" text-anchor="middle" class="cap">untrusted</text></svg><figcaption>شکل ۲: پورت سرور واقعی Trusted است؛ OFFER از پورت Untrusted مسدود می‌شود.</figcaption></figure>
<p>سوییچ هر پورت را «Trusted» یا «Untrusted» می‌داند. پیام‌های سرور (Offer/ACK) فقط از پورت Trusted عبور می‌کنند. پورت کاربر Untrusted است؛ اگر DHCP Server روی آن دیده شود، مسدود می‌شود. سوییچ همچنین جدول Binding می‌سازد (MAC، IP، VLAN، پورت).</p>
<pre><code>SW1(config)# ip dhcp snooping
SW1(config)# ip dhcp snooping vlan 20,30
SW1(config)# no ip dhcp snooping information option
SW1(config)# interface gi0/10
SW1(config-if)# ip dhcp snooping trust
SW1(config-if)# exit
SW1(config)# interface range gi0/1 - 4
SW1(config-if-range)# ip dhcp snooping limit rate 15</code></pre>
<ul>
<li><code>ip dhcp snooping</code> و <code>vlan</code>: قابلیت را عمومی و برای VLANهای مشخص فعال می‌کند.</li>
<li><code>trust</code>: فقط روی پورت به سمت DHCP Server (یا Uplink به سمت آن) و Trunkهای بین سوییچ‌ها.</li>
<li><code>limit rate</code>: سقف تعداد بسته‌ی DHCP در ثانیه برای جلوگیری از حمله‌ی Starvation.</li>
<li><code>no ... information option</code>: جلوگیری از Option 82 در بعضی سناریوها (مشکل رایج وقتی سرور Option 82 را قبول نمی‌کند).</li>
</ul>
<pre><code>SW1# show ip dhcp snooping
SW1# show ip dhcp snooping binding
SW1# show ip dhcp snooping statistics</code></pre>
<h2><span class="hn">۴.</span> DAI: جعل ARP را متوقف کن</h2>
<p>در ARP Spoofing مهاجم پاسخ ARP جعلی می‌فرستد: «IP Gateway مال MAC من است». <span class="en">DAI</span> هر ARP را با جدول Binding مقایسه می‌کند؛ اگر IP و MAC با هم نخواند، بسته را می‌اندازد.</p>
<pre><code>SW1(config)# ip arp inspection vlan 20,30
SW1(config)# interface gi0/10
SW1(config-if)# ip arp inspection trust
SW1# show ip arp inspection
SW1# show ip arp inspection statistics</code></pre>
<div class="box"><b class="t">شرط DAI</b>DAI به جدول Binding وابسته است؛ پس Snooping باید فعال باشد. برای دستگاه‌هایی با IP ثابت (سرور، پرینتر) باید ورودی دستی در Binding یا ARP ACL بنویسید، وگرنه DAI ترافیکشان را می‌اندازد.</div>
<h2><span class="hn">۵.</span> مثال‌ها</h2>
<h3>ساده</h3>
<pre><code>Client sends DISCOVER on Gi0/1 (untrusted)
Real server replies via Gi0/10 (trusted) -> OFFER passes
Binding: MAC aaaa.0000.0005  IP 10.10.20.50  VLAN 20  Gi0/1</code></pre>
<h3>متوسط: سرور جعلی</h3>
<pre><code>Rogue router on Gi0/3 (untrusted) sends OFFER
Switch drops it  -> client only hears the real server
Log: %DHCP_SNOOPING-5-DHCP_SNOOPING_UNTRUSTED_PORT</code></pre>
<h3>سخت: چرا بعد از فعال‌کردن Snooping هیچ‌کس IP نمی‌گیرد؟</h3>
<pre><code>Cause 1: the port to the DHCP server is NOT trusted -> OFFERs dropped
Cause 2: trunk between switches not trusted
Cause 3: Option 82 inserted and the server rejects it
Fix    : trust server/uplink ports; no ip dhcp snooping information option</code></pre>
<div class="box"><b class="t">صادقانه درباره‌ی Lab</b>طبق Probe اولیه، در vIOSL2 دستورهای DHCP Snooping و DAI فقط «پذیرفته» می‌شوند و ممکن است واقعاً بسته‌ها را بلوک نکنند. در Lab ما، Windows Server DHCP یک VM در ESXi است که در Capstone اصلی کامل می‌شود. اینجا نتیجه‌ی واقعی هر گام را ثبت کنید؛ و مفهوم و دستورها را کامل بدانید.</div>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): نام چهار پیام DORA؟</summary><pre><code>Discover, Offer, Request, Acknowledge</code></pre>
</details>
<details><summary>۲ (ساده): کدام پورت‌ها Trusted می‌شوند؟</summary><pre><code>Ports toward the legitimate DHCP server and inter-switch trunks. Never user ports.</code></pre>
</details>
<details><summary>۳ (متوسط): DAI به چه چیزی وابسته است؟</summary><pre><code>The DHCP Snooping binding table (or static ARP ACL entries).</code></pre>
</details>
<details><summary>۴ (متوسط): کلاینت 169.254.x.x گرفته؛ دو علت محتمل؟</summary><pre><code>1) DHCP server unreachable/down
2) Snooping drops the OFFER (server port not trusted)</code></pre>
</details>
<details><summary>۵ (سخت): چرا سرور با IP ثابت بعد از DAI قطع می‌شود؟</summary><pre><code>It has no DHCP binding entry; DAI drops its ARP packets. Fix: add a static binding / ARP ACL.</code></pre>
</details>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> چطور شبکه‌ی سازمانی را در سه لایه (<span class="en">Access</span>، <span class="en">Distribution</span>، <span class="en">Core</span>) طراحی می‌کنیم، چه زمانی «Collapsed Core» کافی است، عیب‌یابی خرابی‌های هفته ۴ (TS06 تا TS08)، و آزمون عملی Gate G2.</p>
<p><b>چرا لازم است:</b> طراحی بد یعنی گسترش‌ناپذیری و عیب‌یابی سخت. طراحی لایه‌ای (Hierarchical) برای هر سازمان استانداردی است که جواب سؤال «این سوییچ را کجا بگذارم؟» را می‌دهد؛ و Gate G2 تضمین می‌کند Switching را عملی یاد گرفته‌اید.</p>
<ul>
<li><b>در کار روزانه:</b> هر ساختمان یا شعبه با یکی از دو الگوی ۳لایه یا Collapsed Core طراحی می‌شود.</li>
<li><b>در امنیت:</b> لایه‌بندی یعنی نقاط کنترل مشخص (Policy روی Distribution/Core).</li>
<li><b>در Capstone:</b> شعبه‌ی کوچک Collapsed Core و مرکز ۳لایه‌ی ساده دارد.</li>
</ul>

<h2><span class="hn">۱.</span> چرا سه لایه؟</h2>
<p>شهری را تصور کنید که هر خانه مستقیماً به همه‌ی خانه‌ها خیابان دارد؛ ۱۰۰ خانه یعنی ۴۹۵۰ خیابان! لایه‌بندی مثل «کوچه، خیابان، بزرگراه» است: هر لایه کار مشخصی دارد و تعداد اتصال‌ها کم می‌ماند.</p>

<h2><span class="hn">۲.</span> Collapsed Core: وقتی دو لایه کافی است</h2>
<p>در شعبه‌ی کوچک، Distribution و Core را یکی می‌کنیم (دو سوییچ L3 که هم Gateway‌اند و هم هسته). این ارزان‌تر است و برای ۵۰ تا ۲۰۰ کاربر کافی.</p>

<tr><th>معیار</th><th>سه‌لایه</th><th>Collapsed Core</th></tr>
<tr><td>اندازه</td><td>سازمان بزرگ/چند ساختمان</td><td>شعبه‌ی کوچک</td></tr>
<tr><td>هزینه</td><td>بیشتر</td><td>کمتر</td></tr>
<tr><td>پیچیدگی</td><td>بیشتر</td><td>کمتر</td></tr>
<tr><td>گسترش</td><td>آسان‌تر</td><td>محدودتر</td></tr>
</table>
<div class="box"><b class="t">در Capstone ما</b>مرکز: Core/Distribution ساده روی یک جفت سوییچ؛ شعبه‌ها: Collapsed Core. Gateway اصلی همه‌ی VLANها FortiGate است و سوییچ‌ها L2 هستند (طبق تصمیم معماری).</div>
<h2><span class="hn">۳.</span> سه خرابی این هفته (TS06 تا TS08)</h2>
<h3>TS06: Root اشتباه</h3>
<pre><code>Symptom : slow network, traffic path goes through an old switch
Evidence: show spanning-tree -> wrong bridge is root

<h3>TS07: پورت err-disabled با BPDU Guard یا Port Security</h3>
<pre><code>Symptom : user port down, link light on

Verify  : port up, user online</code></pre>
<h3>TS08: EtherChannel Mismatch</h3>
<pre><code>Symptom : Po1(SD) or member ports (s)
Evidence: show etherchannel summary, show interfaces trunk
Fix     : make allowed/native/speed identical, bounce the ports
Verify  : Po1(SU), members (P)</code></pre>
<h2><span class="hn">۴.</span> طراحی خودتان: HLD کوتاه</h2>
<p>برای یک شعبه با ۱۵۰ کاربر، ۱۰ سرور و ۲۰ دستگاه مدیریتی، یک طراحی Collapsed Core بنویسید: چند سوییچ، چه VLANهایی، کجا Root، چه لینک‌هایی EtherChannel.</p>
<pre><code>Branch (Collapsed Core)
- 2 x L3 core/distribution switches (EtherChannel between them)
- 3 x access switches, each uplinked to both cores
- VLAN 20 users, 30 servers, 10 management

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> روتر چطور تصمیم می‌گیرد هر بسته را به کدام سمت بفرستد: خواندن <span class="en">Routing Table</span>، معنی کدها، قانون <span class="en">Longest Prefix Match</span>، و دو معیار انتخاب بین مسیرها یعنی <span class="en">Administrative Distance</span> و <span class="en">Metric</span>.</p>
<p><b>چرا لازم است:</b> تمام ارتباط بین شبکه‌ها (و بین VLANها، شعبه‌ها و اینترنت) به جدول مسیریابی بستگی دارد. اگر آن را درست نخوانید، نمی‌توانید بفهمید چرا یک بسته از مسیر غلط رفت یا اصلاً رد نشد. این درس پایه‌ی کل هفته‌های ۵ و ۶ و فایروال است.</p>
<ul>
<li><b>در کار روزانه:</b> اولین دستور عیب‌یابی هر ارتباط بین شبکه‌ای <code>show ip route</code> است.</li>
<li><b>در امنیت:</b> Route اشتباه یعنی ترافیک از مسیر ناخواسته (مثلاً دور زدن فایروال) می‌رود.</li>

<h2><span class="hn">۱.</span> روتر چه کاری می‌کند؟</h2>
<p>روتر مثل یک اداره‌ی پست است. نامه (بسته) می‌رسد؛ منشی فقط به آدرس مقصد نگاه می‌کند و در دفتر خود می‌بیند «برای این منطقه به کدام اداره بفرستم؟». او کل مسیر را نمی‌داند، فقط «قدم بعدی» (Next-hop) را می‌داند.</p>
<div class="box"><b class="t">دو کار روتر</b>۱) یاد گرفتن مسیرها (دستی یا با پروتکل). ۲) ارسال هر بسته بر اساس جدول مسیرها (Forwarding).</div>
<h2><span class="hn">۲.</span> جدول مسیریابی را بخوانیم</h2>

Codes: C - connected, L - local, S - static, O - OSPF

      10.0.0.0/8 is variably subnetted, 4 subnets, 2 masks
C        10.0.12.0/30 is directly connected, GigabitEthernet0/1
L        10.0.12.1/32 is directly connected, GigabitEthernet0/1
O        10.0.23.0/30 [110/2] via 10.0.12.2, 00:05:10, GigabitEthernet0/1
C        192.168.1.0/24 is directly connected, Loopback10</code></pre>
<p>هر خط یک Route است. با یک خط نمونه آشنا می‌شویم:</p>

<h2><span class="hn">۳.</span> قانون اول: Longest Prefix Match</h2>
<p>اگر چند Route با مقصد جور باشد، آن که Prefix بلندتر دارد (دقیق‌تر است) برنده است. مثل نشانی پستی: «تهران، ولیعصر، پلاک ۱۲» از «تهران» دقیق‌تر است.</p>
<figure class="fig"><svg viewBox="0 0 720 260" role="img" aria-label="topology"><path d="M360 33 L360 116" class="rq"/><path d="M360 116 L360 206" class="rq"/><path d="M360 206 L115 206" class="rp"/><path d="M360 206 L605 206" class="ln"/><rect x="250" y="10" width="220" height="46" rx="8" class="bx"/><text x="360" y="31" text-anchor="middle">Packet arrives</text><text x="360" y="47" text-anchor="middle" class="cap">dst IP = 10.1.1.77</text><rect x="250" y="90" width="220" height="52" rx="8" class="wrn"/><text x="360" y="114" text-anchor="middle" class="on">Routing table lookup</text><text x="360" y="130" text-anchor="middle" class="cap">all matching routes</text><rect x="250" y="180" width="220" height="52" rx="8" class="net"/><text x="360" y="204" text-anchor="middle" class="on">Longest prefix wins</text><text x="360" y="220" text-anchor="middle" class="cap">/24 beats /16 beats /0</text><rect x="520" y="180" width="170" height="52" rx="8" class="bx"/><text x="605" y="204" text-anchor="middle">No match</text><text x="605" y="220" text-anchor="middle" class="cap">default route or drop</text><rect x="30" y="180" width="170" height="52" rx="8" class="hst"/><text x="115" y="204" text-anchor="middle" class="on">Forward</text><text x="115" y="220" text-anchor="middle" class="cap">to next-hop / interface</text></svg><figcaption>شکل ۱: مراحل تصمیم روتر برای هر بسته.</figcaption></figure>
<pre><code>Routing table:
  10.0.0.0/8      via R-A
  10.1.0.0/16     via R-B
  10.1.1.0/24     via R-C
  0.0.0.0/0       via R-D (default)

Packet to 10.1.1.77:
  matches /0, /8, /16, /24  -> longest = /24  -> via R-C
Packet to 10.1.9.5:

<div class="box"><b class="t">نکته</b>اول طول Prefix تعیین می‌کند. فقط وقتی دو Route هم‌طول بودند، AD و Metric وارد می‌شوند.</div>
<h2><span class="hn">۴.</span> قانون دوم: Administrative Distance و Metric</h2>
<p>فرض کنید همان شبکه را دو منبع مختلف (مثلاً Static و OSPF) به روتر معرفی کنند. روتر به منبعی که «معتبرتر» است اعتماد می‌کند. این اعتبار را AD می‌گویند و هرچه کمتر باشد بهتر است:</p>
<table>
<tr><th>منبع</th><th>AD</th></tr>
<tr><td>Connected</td><td>0</td></tr>
<tr><td>Static</td><td>1</td></tr>
<tr><td>EIGRP (داخلی)</td><td>90</td></tr>
<tr><td>OSPF</td><td>110</td></tr>
<tr><td>RIP</td><td>120</td></tr>
</table>
<p>Metric هزینه‌ی مسیر <b>داخل یک پروتکل</b> است (مثلاً Cost در OSPF). Metricهای پروتکل‌های مختلف قابل مقایسه با هم نیستند؛ برای همین AD وجود دارد.</p>
<pre><code>Decision order for the same destination:
1) Longest prefix       (most specific wins)
2) Lowest AD             (most trusted source)
3) Lowest metric         (best path inside one protocol)
4) ECMP                  (equal metric -> load share)</code></pre>
<h2><span class="hn">۵.</span> مثال‌ها (ساده تا سخت)</h2>
<h3>ساده: بسته به شبکه‌ی Connected</h3>
<pre><code>Dest 192.168.1.50 -> matches C 192.168.1.0/24
Router ARPs for the host and delivers directly</code></pre>
<h3>متوسط: Static یا OSPF؟</h3>
<pre><code>Both learn 10.0.23.0/30:
  S  10.0.23.0/30 [1/0]   via 10.0.12.2
  O  10.0.23.0/30 [110/2] via 10.0.12.2
Same prefix -> lower AD (1) wins -> Static is installed</code></pre>
<h3>سخت: دو Route با Prefixهای مختلف</h3>
<pre><code>S  10.0.0.0/8   [1/0]   via 10.9.9.9   (static, AD 1)
O  10.0.23.0/30 [110/2] via 10.0.12.2   (OSPF, AD 110)
Packet to 10.0.23.5:
  both match; /30 is longer than /8 -> OSPF route wins
  (AD is NOT compared here; prefix length decides first)</code></pre>
<p>این خطای ذهنی بسیار رایج است: «Static همیشه برنده است». نه! اول طول Prefix است.</p>

<h2><span class="hn">۱.</span> Static Route چیست؟</h2>
<p>یعنی خودتان به روتر می‌گویید: «برای رسیدن به شبکه X، بسته را به روتر Y بده». مثل اینکه به راننده‌ی تاکسی بگویید «برای رفتن به فرودگاه از این خیابان برو»؛ خودش تصمیم نمی‌گیرد، شما گفته‌اید.</p>
<p>فرمت:</p>
<pre><code>ip route &lt;destination network> &lt;mask> &lt;next-hop | exit-interface> [AD]

Example:
R1(config)# ip route 192.168.3.0 255.255.255.0 10.0.12.2</code></pre>
<p>یعنی «برای شبکه‌ی 192.168.3.0/24، بسته را به 10.0.12.2 بده».</p>
<h2><span class="hn">۲.</span> Next-hop در برابر Exit-interface</h2>
<table>
<tr><th>روش</th><th>مثال</th><th>کاربرد</th></tr>
<tr><td>Next-hop</td><td>ip route 192.168.3.0 255.255.255.0 10.0.12.2</td><td>پیشنهاد اصلی؛ روی اترنت امن است</td></tr>
<tr><td>Exit-interface</td><td>ip route 192.168.3.0 255.255.255.0 gi0/1</td><td>فقط لینک نقطه‌به‌نقطه (Serial)؛ روی اترنت ARP برای هر مقصد</td></tr>
<tr><td>هر دو</td><td>ip route 192.168.3.0 255.255.255.0 gi0/1 10.0.12.2</td><td>دقیق‌ترین (توصیه برای اترنت)</td></tr>
</table>
<div class="box"><b class="t">قانون</b>روی اترنت فقط Exit-interface ننویسید؛ روتر برای هر مقصد ARP می‌زند و به Proxy-ARP وابسته می‌شود. Next-hop (یا هر دو) بنویسید.</div>
<p>«Recursive»: اگر Next-hop را بنویسید، روتر یک جستجوی دوم می‌کند تا Next-hop را از Connected/Route دیگری پیدا کند. به همین دلیل Next-hop باید حتماً در یک شبکه‌ی Connected یا شناخته‌شده باشد.</p>
<h2><span class="hn">۳.</span> مسیر برگشت: مهم‌ترین نکته</h2>
<p>ارتباط دوطرفه است. اگر فقط R1 مسیر رفت را بداند، ولی R3 راه برگشت به 192.168.1.0/24 را نداند، پاسخ هرگز نمی‌رسد و ping شکست می‌خورد.</p>
<pre><code>PC (192.168.1.10) -> R1 -> R2 -> R3 -> Server (192.168.3.10)
Forward path : R1 needs route to 192.168.3.0/24, R2 as well
Return path  : R3 needs route to 192.168.1.0/24, R2 as well
If any hop lacks the return route -> ping fails (one-way)</code></pre>
<h2><span class="hn">۴.</span> خلاصه‌سازی با Static و Null0</h2>
<p>به‌جای چند Route ریز، یک Route کلی می‌نویسیم. مثال: چهار شبکه‌ی 10.1.0.0/24 تا 10.1.3.0/24 را می‌توان با یک /22 خلاصه کرد:</p>
<pre><code>10.1.0.0/24, 10.1.1.0/24, 10.1.2.0/24, 10.1.3.0/24
Third octet: 0,1,2,3 -> block size 4 -> /22
Summary = 10.1.0.0/22</code></pre>
<p>برای جلوگیری از Loop هنگام خلاصه‌سازی روی مرز، گاهی یک Route به Null0 می‌گذارند تا بسته‌ی بی‌صاحب دور ریخته شود:</p>
<pre><code>R2(config)# ip route 10.1.0.0 255.255.252.0 null0 200</code></pre>
<p>AD برابر 200 است تا Routeهای واقعی (دقیق‌تر یا با AD کمتر) را بلوک نکند.</p>
<h2><span class="hn">۵.</span> مثال‌ها</h2>
<h3>ساده: یک مسیر</h3>
<pre><code>R1(config)# ip route 192.168.3.0 255.255.255.0 10.0.12.2
R1# show ip route static
S  192.168.3.0/24 [1/0] via 10.0.12.2</code></pre>
<h3>متوسط: مسیر رفت و برگشت</h3>
<pre><code>R1(config)# ip route 192.168.3.0 255.255.255.0 10.0.12.2
R1(config)# ip route 10.0.23.0 255.255.255.252 10.0.12.2
R2(config)# ip route 192.168.3.0 255.255.255.0 10.0.23.2
R2(config)# ip route 192.168.1.0 255.255.255.0 10.0.12.1
R3(config)# ip route 192.168.1.0 255.255.255.0 10.0.23.1
R3(config)# ip route 10.0.12.0 255.255.255.252 10.0.23.1</code></pre>
<h3>سخت: Next-hop غیرقابل‌دسترس</h3>
<pre><code>R1(config)# ip route 192.168.3.0 255.255.255.0 10.9.9.9
R1# show ip route 192.168.3.0
  -> Route is NOT installed: next-hop 10.9.9.9 is not reachable
Fix: use a next-hop inside a connected network (10.0.12.2)</code></pre>

</details>

</details>

<tr><th>مخفف</th><th>شکل کامل انگلیسی</th><th>معنی فارسی</th></tr>
<tr><td>Default Route</td><td>Default Route</td><td>مسیر 0.0.0.0/0 برای هر مقصد ناشناخته</td></tr>

<h2><span class="hn">۱.</span> Default Route: «هرجا نمی‌دانی، از اینجا برو»</h2>
<p>Default Route همان آدرس ناشناخته در جدول است: مثل تابلوی «بقیه‌ی مسیرها» در بزرگراه. شبکه‌ی /0 همه‌ی آدرس‌ها را می‌پوشاند و چون کوتاه‌ترین Prefix است، فقط وقتی استفاده می‌شود که Route دقیق‌تری نباشد (LPM).</p>
<pre><code>R1(config)# ip route 0.0.0.0 0.0.0.0 10.0.12.2
R1# show ip route
Gateway of last resort is 10.0.12.2 to network 0.0.0.0
S*   0.0.0.0/0 [1/0] via 10.0.12.2</code></pre>
<h2><span class="hn">۲.</span> Floating Static: پشتیبان که «شناور» است</h2>
<p>دو Default Route با دو AD متفاوت می‌نویسیم: اصلی با AD پیش‌فرض (1) و پشتیبان با AD بالاتر (مثلاً 200). روتر فقط Route با AD کمتر را نصب می‌کند؛ اگر آن حذف شد، پشتیبان «بالا می‌آید».</p>

R1(config)# ip route 0.0.0.0 0.0.0.0 198.51.100.1 200
R1# show ip route 0.0.0.0

<h2><span class="hn">۳.</span> مشکل: لینک «بالا» است ولی اینترنت نیست</h2>
<p>Route Static تا وقتی Interface خروجی up/up است در جدول می‌ماند؛ حتی اگر Next-hop (ISP) خراب باشد. پس Floating به‌تنهایی Failover واقعی نیست. باید «سلامت واقعی» مسیر را بسنجیم: IP SLA با ping به Next-hop یا یک آدرس دور.</p>
<pre><code>Interface up/up + ISP dead -> Static route still installed -> no failover
Solution: IP SLA probe + track -> route removed when probe fails</code></pre>
<h2><span class="hn">۴.</span> IP SLA و Track (دستورها خط‌به‌خط)</h2>
<pre><code>R1(config)# ip sla 1
R1(config-ip-sla)# icmp-echo 203.0.113.1 source-interface gi0/1
R1(config-ip-sla-echo)# frequency 5
R1(config-ip-sla-echo)# exit
R1(config)# ip sla schedule 1 life forever start-time now
R1(config)# track 1 ip sla 1 reachability
R1(config)# ip route 0.0.0.0 0.0.0.0 203.0.113.1 track 1
R1(config)# ip route 0.0.0.0 0.0.0.0 198.51.100.1 200</code></pre>
<ul>
<li><code>ip sla 1</code> + <code>icmp-echo</code>: هر ۵ ثانیه ping به Next-hop اول.</li>
<li><code>schedule ... start-time now</code>: پروب را همین الان و برای همیشه شروع می‌کند.</li>
<li><code>track 1 ip sla 1 reachability</code>: شیء Track که وضعیت پروب را می‌داند.</li>
<li><code>ip route ... track 1</code>: این Route فقط وقتی در جدول است که Track بالا باشد.</li>
</ul>
<pre><code>R1# show ip sla statistics
R1# show track 1
R1# show ip route 0.0.0.0</code></pre>
<h2><span class="hn">۵.</span> مثال‌ها</h2>
<h3>ساده</h3>
<pre><code>Single ISP: ip route 0.0.0.0 0.0.0.0 &lt;ISP gateway></code></pre>
<h3>متوسط: Floating</h3>
<pre><code>Primary link fails (interface down)
-> AD 1 route removed
-> AD 200 route installed automatically</code></pre>
<h3>سخت: ISP خراب ولی Interface بالا</h3>
<pre><code>Probe to 203.0.113.1 times out
-> track 1 goes Down
-> primary static removed
-> backup (AD 200) installed
Probe recovers -> primary returns (preempt)</code></pre>
<div class="box"><b class="t">صادقانه درباره‌ی Lab</b>طبق Probe اولیه، IP SLA روی IOS ما کار می‌کند. در Lab، لینک ISP را با قطع کابل (shutdown رو Interface دور) یا حذف Route همسایه شبیه‌سازی کنید و نتیجه‌ی واقعی را ثبت کنید.</div>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): AD پیش‌فرض Static و Floating معمول؟</summary><pre><code>Static default AD = 1; floating backup typically 200 (any value higher than the primary).</code></pre>
</details>
<details><summary>۲ (ساده): چرا 0.0.0.0 0.0.0.0 همه‌ی مقاصد را می‌پوشاند؟</summary><pre><code>Prefix length 0 matches every address; it is only used when nothing longer matches.</code></pre>
</details>
<details><summary>۳ (متوسط): چرا Floating به‌تنهایی کافی نیست؟</summary><pre><code>The static route stays installed while the interface is up, even if the ISP is dead.</code></pre>
</details>
<details><summary>۴ (متوسط): دستور Route وابسته به Track؟</summary><pre><code>ip route 0.0.0.0 0.0.0.0 203.0.113.1 track 1</code></pre>
</details>
<details><summary>۵ (سخت): چه چیزی را باید پروب کنیم؟</summary><pre><code>The next-hop and ideally something beyond it (a reliable remote address) to detect upstream failure.</code></pre>
</details>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> مفهوم پروتکل مسیریابی پویا <span class="en">OSPF</span>: چرا Static در شبکه‌ی بزرگ جواب نمی‌دهد، چطور روترها همسایه می‌شوند، پایگاه داده‌ی مشترک (<span class="en">LSDB</span>) چیست، و هزینه (<span class="en">Cost</span>) چطور مسیر را انتخاب می‌کند.</p>
<p><b>چرا لازم است:</b> در شبکه‌ای با ۵۰ روتر، نوشتن دستی هزاران Static غیرممکن است و با هر تغییر باید همه را اصلاح کنید. OSPF خودش مسیرها را پیدا می‌کند، با خرابی لینک در چند ثانیه مسیر جایگزین می‌سازد و استاندارد سازمان‌هاست.</p>
<ul>
<li><b>در کار روزانه:</b> OSPF رایج‌ترین IGP در سازمان‌هاست.</li>
<li><b>در امنیت:</b> Adjacency بدون Authentication یعنی هر روتر جعلی می‌تواند مسیر تزریق کند.</li>
<li><b>در FortiGate:</b> FortiGate هم OSPF می‌فهمد و در Capstone با Cisco هم‌نشین می‌شود.</li>
</ul>

<h2><span class="hn">۱.</span> چرا مسیریابی پویا؟</h2>
<p>فرض کنید ۱۰ روتر دارید. Static یعنی به هر روتر درباره‌ی هر شبکه بگویید؛ با اضافه‌شدن یک شبکه همه را عوض می‌کنید، و اگر لینکی خراب شود هیچ‌چیز خودکار تغییر نمی‌کند. مسیریابی پویا مثل گوگل‌مپ است: هر روتر وضعیت خودش را اعلام می‌کند و همه با هم نقشه‌ی یکسان می‌سازند.</p>
<h2><span class="hn">۲.</span> OSPF چطور کار می‌کند؟ (سه مرحله)</h2>
<ol>
<li><b>همسایه‌یابی:</b> روترها با پیام Hello همدیگر را پیدا می‌کنند.</li>
<li><b>تبادل نقشه:</b> هر روتر وضعیت لینک‌های خودش (LSA) را با همه‌ی روترهای Area به اشتراک می‌گذارد؛ نتیجه LSDB یکسان در همه است.</li>
<li><b>محاسبه‌ی مسیر:</b> هر روتر با الگوریتم SPF از روی LSDB کوتاه‌ترین مسیر به هر شبکه را حساب می‌کند.</li>
</ol>
<div class="box"><b class="t">تفاوت با RIP</b>OSPF «نقشه‌ی کامل» را دارد (Link-State)، نه فقط «شنیده‌های همسایه» (Distance Vector). برای همین سریع‌تر همگرا می‌شود و حلقه نمی‌سازد.</div>
<h2><span class="hn">۳.</span> همسایگی: از Down تا Full</h2>
<figure class="fig"><svg viewBox="0 0 720 298" role="img" aria-label="sequence"><rect x="115" y="10" width="130" height="34" rx="8" class="bx"/><text x="180" y="32" text-anchor="middle">Router A</text><path d="M180 44 V292" class="ln" stroke-dasharray="4 4"/><rect x="475" y="10" width="130" height="34" rx="8" class="bx"/><text x="540" y="32" text-anchor="middle">Router B</text><path d="M540 44 V292" class="ln" stroke-dasharray="4 4"/><path d="M180 75 H540" class="rq"/><path d="M532 70 l8 5 l-8 5" class="rq"/><text x="360" y="67" text-anchor="middle" class="cap">Hello (I know nobody)</text><path d="M540 113 H180" class="rp"/><path d="M188 108 l-8 5 l8 5" class="rp"/><text x="360" y="105" text-anchor="middle" class="cap">Hello (I saw A)</text><path d="M180 151 H540" class="rq"/><path d="M532 146 l8 5 l-8 5" class="rq"/><text x="360" y="143" text-anchor="middle" class="cap">DBD (database summary)</text><path d="M540 189 H180" class="rp"/><path d="M188 184 l-8 5 l8 5" class="rp"/><text x="360" y="181" text-anchor="middle" class="cap">DBD</text><path d="M180 227 H540" class="rq"/><path d="M532 222 l8 5 l-8 5" class="rq"/><text x="360" y="219" text-anchor="middle" class="cap">LSR / LSU (missing LSAs)</text><path d="M540 265 H180" class="rp"/><path d="M188 260 l-8 5 l8 5" class="rp"/><text x="360" y="257" text-anchor="middle" class="cap">LSAck -> state FULL</text></svg><figcaption>شکل ۱: ساده‌شده‌ی تبادل پیام‌ها تا رسیدن به حالت Full.</figcaption></figure>

<tr><th>حالت</th><th>معنی</th></tr>
<tr><td>Down</td><td>Hello نرسیده</td></tr>
<tr><td>Init</td><td>Hello دریافت شد ولی همسایه هنوز ما را ندیده</td></tr>
<tr><td>2-Way</td><td>دوطرفه دیدیم (روی Broadcast: DR/BDR انتخاب می‌شود)</td></tr>

<tr><td>Exchange</td><td>تبادل خلاصه‌ی پایگاه داده (DBD)</td></tr>

<p>اگر روتری در ExStart یا Exchange گیر کرد، معمولاً MTU یا مشکل پایگاه داده است. اگر در Init می‌ماند، یکی از دو طرف Hello را نمی‌بیند (ACL، Hello/Dead، Subnet).</p>
<h2><span class="hn">۴.</span> شرط‌های تشکیل Adjacency</h2>
<p>برای اینکه دو روتر همسایه شوند، این مقادیر باید یکی باشند:</p>
<ul>
<li>هر دو Interface در یک Subnet با Mask یکسان.</li>
<li>Area یکسان.</li>
<li>Hello و Dead Interval یکسان (پیش‌فرض اترنت: 10 و 40 ثانیه).</li>
<li>Authentication یکسان.</li>
<li>MTU برابر (یا <code>ip ospf mtu-ignore</code> در موارد خاص).</li>
<li>Router ID یکتا.</li>
</ul>
<pre><code>Hello interval (Ethernet) = 10 s
Dead interval  (Ethernet) = 4 x Hello = 40 s
(Non-broadcast: Hello 30 s, Dead 120 s)</code></pre>
<h2><span class="hn">۵.</span> Router ID</h2>
<p>هر روتر یک شناسه‌ی ۳۲ بیتی شبیه IP دارد. اگر دستی تنظیم نکنید، بزرگ‌ترین IP روی Loopbackها، و در نبود Loopback بزرگ‌ترین IP روی Interfaceهای فعال انتخاب می‌شود. توصیه: همیشه دستی تنظیم کنید تا پایدار و قابل‌پیش‌بینی باشد:</p>
<pre><code>R1(config)# router ospf 1
R1(config-router)# router-id 1.1.1.1</code></pre>
<h2><span class="hn">۶.</span> Cost: چطور مسیر انتخاب می‌شود؟</h2>
<p>هر لینک یک هزینه دارد که از پهنای باند به‌دست می‌آید. هزینه‌ی کل یک مسیر مجموع هزینه‌ی لینک‌های خروجی تا مقصد است و کمترین برنده می‌شود:</p>
<pre><code>Cost = Reference bandwidth / Interface bandwidth
Default reference bandwidth = 100 Mbps

 10 Mbps  -> 100 / 10   = 10
100 Mbps  -> 100 / 100  = 1
  1 Gbps  -> 100 / 1000 = 0.1 -> rounded up to 1   (problem!)
 10 Gbps  -> also 1</code></pre>
<div class="box"><b class="t">مشکل شناخته‌شده</b>با مرجع ۱۰۰ مگابیت، لینک‌های ۱ و ۱۰ گیگابیت هزینه‌ی یکسان (۱) دارند؛ پس OSPF سریع‌تر را از کندتر تشخیص نمی‌دهد. راه‌حل: مرجع را بالا ببرید و در همه‌ی روترها یکسان کنید: <code>auto-cost reference-bandwidth 10000</code> (ده گیگ).</div>
<pre><code>Reference 10000 Mbps:
  1 Gbps  -> 10000 / 1000  = 10
 10 Gbps  -> 10000 / 10000 = 1
100 Mbps  -> 10000 / 100   = 100</code></pre>
<h2><span class="hn">۷.</span> مثال‌ها</h2>
<h3>ساده: دو روتر</h3>
<pre><code>R1 Gi0/1 10.0.12.1/30  &lt;->  R2 Gi0/0 10.0.12.2/30, area 0
Hello exchanged -> neighbors -> state FULL
Each learns the other LANs automatically</code></pre>
<h3>متوسط: کدام مسیر؟</h3>
<pre><code>Path A: R1 -> R2 -> R3     cost 10 + 10 = 20
Path B: R1 -> R3 direct     cost 30
SPF picks Path A (20 &lt; 30)</code></pre>
<h3>سخت: چرا Adjacency نمی‌شود؟</h3>
<pre><code>R1: ip ospf hello-interval 5   (dead 20)
R2: default (hello 10, dead 40)
Result: neighbors never reach 2-Way; hello/dead mismatch
Fix: make both sides identical</code></pre>
<h2>تمرین‌ها</h2>
<details><summary>۱ (ساده): سه مرحله‌ی کار OSPF؟</summary><pre><code>1) discover neighbors 2) exchange LSAs to build the same LSDB 3) run SPF to compute best paths</code></pre>
</details>
<details><summary>۲ (ساده): Hello/Dead پیش‌فرض اترنت؟</summary><pre><code>10 s / 40 s</code></pre>
</details>
<details><summary>۳ (متوسط): Cost لینک 1 Gbps با Reference 100 Mbps؟</summary><pre><code>100 / 1000 = 0.1 -> rounded up to 1</code></pre>
</details>
<details><summary>۴ (متوسط): Cost لینک 100 Mbps با Reference 10000؟</summary><pre><code>10000 / 100 = 100</code></pre>
</details>
<details><summary>۵ (سخت): دو روتر در Init مانده‌اند؛ علت‌های محتمل؟</summary><pre><code>Hello not received on one side: ACL blocking, hello/dead mismatch, subnet/mask mismatch, wrong interface in OSPF.</code></pre>
</details>

<p><b>چه چیزی یاد می‌گیریم:</b> روش عیب‌یابی مسیریابی و پنج دلیل رایج تشکیل‌نشدن همسایگی OSPF؛ و آزمون کوچک پایان هفته‌ی ۵.</p>
<p><b>چرا لازم است:</b> «شبکه‌ی دور در دسترس نیست» پرتکرارترین شکایت است و علتش یکی از چند مورد محدود است. اگر روش داشته باشید، ریشه را در چند دقیقه پیدا می‌کنید.</p>
<ul>
<li><b>در کار روزانه:</b> عیب‌یابی مسیریابی مهارت پایه‌ی هر ادمین شبکه است.</li>
<li><b>در امنیت:</b> اشتباه مسیر یعنی ترافیک از مسیر ناخواسته یا نامشخص می‌رود.</li>
<li><b>در مصاحبه:</b> سناریوی «دو روتر همسایه نمی‌شوند» سؤال تکراری مصاحبه‌هاست.</li>
</ul>

<h2><span class="hn">۱.</span> روش سیستماتیک مسیریابی</h2>
<ol>
<li><b>Symptom:</b> از کجا به کجا نمی‌رسد؟ (مبدأ و مقصد دقیق)</li>
<li><b>ping و traceroute:</b> تا کدام Hop می‌رسد؟</li>
<li><b>Route رفت:</b> <code>show ip route &lt;مقصد&gt;</code> روی هر روتر مسیر.</li>
<li><b>Route برگشت:</b> همان کار از سمت مقصد.</li>
<li><b>پروتکل:</b> همسایگی OSPF (<code>show ip ospf neighbor</code>) و فیلتر/ACL.</li>
</ol>
<p>مهم‌ترین قاعده: Hop به Hop بروید و هر روتر را بررسی کنید؛ حدس ممنوع.</p>
<h2><span class="hn">۲.</span> پنج دلیل رایج Adjacency نشدن OSPF</h2>
<h3>۱: Hello/Dead Mismatch</h3>
<pre><code>Symptom : neighbor stuck / flapping
Evidence: show ip ospf interface -> Hello 5 vs 10
Fix     : set the same hello/dead on both ends</code></pre>
<h3>۲: Area Mismatch</h3>
<pre><code>Symptom : no neighbor; log "Mismatched area"
Evidence: show ip ospf interface -> Area 0 vs Area 1
Fix     : use the same area</code></pre>
<h3>۳: Subnet/Mask Mismatch</h3>
<pre><code>Symptom : no neighbor
Evidence: 10.0.12.1/30 vs 10.0.12.2/29 (different masks)
Fix     : same subnet and mask</code></pre>
<h3>۴: Authentication Mismatch</h3>
<pre><code>Symptom : neighbor does not form; log auth failure
Evidence: show ip ospf interface -> auth type/key differs
Fix     : same auth mode and key</code></pre>
<h3>۵: MTU Mismatch</h3>
<pre><code>Symptom : stuck in ExStart/Exchange
Evidence: show interfaces -> MTU 1500 vs 1400
Fix     : same MTU (or ip ospf mtu-ignore as a temporary workaround)</code></pre>
<h2><span class="hn">۳.</span> مسیر برگشت و مسیر نامتقارن</h2>
<p>اگر رفت از R2 و برگشت از R3 باشد (Asymmetric)، فایروال‌ها و NAT اغلب ارتباط را قطع می‌کنند چون Stateful هستند. همیشه مسیر رفت و برگشت را جدا بررسی کنید.</p>
