<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دوره مهندسی شبکه و امنیت سازمانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600;700&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Vazirmatn',Tahoma,sans-serif;
  --font-code:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --fs:17px;
}
/* ---------- Themes ---------- */
[data-theme="dark"]{--bg:#0f141c;--panel:#161d28;--panel2:#1c2533;--text:#e6ebf2;--muted:#9aa7b8;--line:#2a3547;--accent:#5eb0ff;--accent2:#7ee0b4;--code-bg:#0b1018;--code-text:#d7e3f4;--warn:#ffcc66;--danger:#ff7a7a;--ok:#7ee0b4}
[data-theme="light"]{--bg:#f6f8fb;--panel:#ffffff;--panel2:#eef2f8;--text:#1b2430;--muted:#5b687a;--line:#d9e0ea;--accent:#1d6fd8;--accent2:#0f9d6b;--code-bg:#f0f3f8;--code-text:#17212e;--warn:#9a6a00;--danger:#c0392b;--ok:#0f9d6b}
[data-theme="soft"]{--bg:#efe9dd;--panel:#f7f2e8;--panel2:#e7dfcf;--text:#3a3329;--muted:#7a6f5e;--line:#d6ccb7;--accent:#8a5a2b;--accent2:#4f7a5a;--code-bg:#e9e1d0;--code-text:#2f2a21;--warn:#8a5a00;--danger:#a8402f;--ok:#4f7a5a}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:var(--fs);line-height:1.95;transition:background .25s,color .25s}

/* ---------- Top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:58px;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px}
.brand{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.controls{margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.controls label{font-size:.78rem;color:var(--muted)}
select,.themebtn,.menubtn,.navbtn{font:inherit;font-size:.85rem;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer}
select{max-width:150px}
.themes{display:flex;gap:6px}
.themebtn{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:1rem}
.themebtn[aria-pressed="true"]{outline:2px solid var(--accent)}
.menubtn{display:inline-block}
body.menu-hidden .layout{grid-template-columns:minmax(0,1fr)}
body.menu-hidden .sidebar{display:none}

/* ---------- Layout: first grid column = RIGHT side in RTL ---------- */
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);padding-top:58px;min-height:100vh}
.sidebar{position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;overflow-x:hidden;background:var(--panel);border-inline-end:1px solid var(--line);padding:14px 12px 40px}
.sidebar::-webkit-scrollbar{width:8px}.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.progress{font-size:.8rem;color:var(--muted);margin:2px 6px 12px}
.bar{height:6px;border-radius:6px;background:var(--panel2);margin-top:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent2);width:0}
.mod{margin:6px 0}
.mod>button{width:100%;text-align:start;font:inherit;font-weight:700;font-size:.86rem;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.mod>button span:last-child{color:var(--muted);font-weight:400;font-size:.75rem;white-space:nowrap}
.mod ul{list-style:none;margin:6px 0 4px;padding:0 10px 0 0}
.mod li a{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:.84rem;line-height:1.7;overflow-wrap:anywhere}
.mod li a:hover{background:var(--panel2);color:var(--text)}
.mod li a.active{background:var(--accent);color:#fff}
.mod li a.locked{opacity:.55;cursor:default}
.mod li a .dot{flex:none;margin-top:6px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.mod li a.done .dot{background:var(--ok)}
.mod[hidden-list] ul{display:none}

/* ---------- Content ---------- */
.content{padding:30px clamp(16px,4vw,48px) 90px}
article{max-width:860px;margin-inline:auto;overflow-wrap:anywhere;word-break:normal}
article h1{font-size:1.75rem;line-height:1.5;margin:.2em 0 .3em}
article h2{font-size:1.3rem;margin:1.8em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line);color:var(--accent)}
article h3{font-size:1.1rem;margin:1.4em 0 .4em}
article p{margin:.7em 0}
article ul,article ol{padding-inline-start:1.6em}
article a{color:var(--accent)}
.meta{color:var(--muted);font-size:.85rem;display:flex;gap:14px;flex-wrap:wrap}
.tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
/* Latin runs inside Persian text */
.en{direction:ltr;unicode-bidi:isolate;font-family:'IBM Plex Sans Arabic',var(--font-ui);font-size:.95em}
code{direction:ltr;unicode-bidi:isolate;font-family:var(--font-code);font-size:.88em;background:var(--code-bg);color:var(--code-text);padding:1px 7px;border-radius:6px;border:1px solid var(--line);overflow-wrap:anywhere}
pre{direction:ltr;text-align:left;margin:1em 0;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:var(--font-code);font-size:.85rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;overflow-x:hidden}
pre code{background:none;border:0;padding:0;font-size:inherit}
/* tables without horizontal scroll */
table{width:100%;border-collapse:collapse;table-layout:fixed;margin:1em 0;font-size:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border:1px solid var(--line);text-align:start;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
th{background:var(--panel2)}
td,th{unicode-bidi:plaintext}
.hn{unicode-bidi:isolate;direction:rtl;margin-inline-end:.35em}
.fig{margin:1em 0;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.fig svg{width:100%;height:auto;display:block;direction:ltr}
.fig text{fill:var(--text);font-size:13px;font-family:var(--font-ui)}
.fig .cap{font-size:12px;fill:var(--muted)}
.fig text.on+text.cap{fill:#0b1018}
.fig .bx{fill:var(--panel2);stroke:var(--line)}
.fig .net{fill:var(--accent)}.fig .hst{fill:var(--accent2)}.fig .wrn{fill:var(--warn)}
.fig .on{fill:#0b1018;font-weight:700}
.fig .ln{stroke:var(--muted);stroke-width:1.6;fill:none}
.fig .rq{stroke:var(--accent);stroke-width:2.2;fill:none}.fig .rp{stroke:var(--accent2);stroke-width:2.2;fill:none}
figcaption{font-size:.85rem;color:var(--muted);margin-top:6px;text-align:center}

/* callouts */
.box{border:1px solid var(--line);border-inline-start:5px solid var(--accent);background:var(--panel);border-radius:12px;padding:10px 16px;margin:1.1em 0}
.box b.t{display:block;margin-bottom:2px}
.box.warn{border-inline-start-color:var(--warn)}.box.danger{border-inline-start-color:var(--danger)}.box.ok{border-inline-start-color:var(--ok)}
.box.review{border-inline-start-color:var(--accent2);background:var(--panel2)}
details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:.6em 0;padding:6px 14px}
summary{cursor:pointer;font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:40px}
.donebtn{margin-top:26px;display:inline-block}
.review-item{border:1px dashed var(--line);border-radius:10px;padding:8px 14px;margin:.6em 0;background:var(--panel)}
.review-item small{color:var(--muted)}

/* ---------- Mobile ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .menubtn{display:inline-block}
  .sidebar{position:fixed;top:58px;right:0;width:min(86vw,340px);transform:translateX(100%);transition:transform .25s;z-index:25;box-shadow:0 0 30px rgba(0,0,0,.4)}
  body.menu-open .sidebar{transform:translateX(0)}
  .brand{max-width:30vw}.controls label{display:none}
  select{max-width:110px}
}
</style>
</head>

  <div class="controls">

    <select id="fontsel" aria-label="انتخاب فونت">
      <option value="'Vazirmatn',Tahoma,sans-serif">Vazirmatn (وزیرمتن)</option>
      <option value="'IBM Plex Sans Arabic',Tahoma,sans-serif">IBM Plex Sans Arabic</option>
      <option value="'Noto Naskh Arabic',serif">Noto Naskh (نسخ)</option>
      <option value="'Cairo',Tahoma,sans-serif">Cairo</option>
      <option value="'Almarai',Tahoma,sans-serif">Almarai</option>
      <option value="Tahoma,Arial,sans-serif">Tahoma (سیستم)</option>
    </select>
    <label for="sizesel">اندازه</label>
    <select id="sizesel" aria-label="اندازه متن">
      <option value="15">کوچک</option><option value="17" selected>متوسط</option><option value="19">بزرگ</option><option value="21">خیلی بزرگ</option>
    </select>
    <div class="themes" role="group" aria-label="تم">
      <button class="themebtn" data-theme="dark" title="تاریک" aria-pressed="true">🌙</button>
      <button class="themebtn" data-theme="light" title="روشن" aria-pressed="false">☀️</button>
      <button class="themebtn" data-theme="soft" title="ملایم" aria-pressed="false">🌾</button>
    </div>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="فهرست دوره"></aside>
  <main class="content"><article id="lesson"></article></main>
</div>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> آدرس IPv4 چطور ساخته می‌شود، Subnet Mask چه کاری می‌کند، و چطور یک شبکه را به بخش‌های کوچک‌تر تقسیم کنیم.</p>
<p><b>چرا لازم است:</b> هر دستگاه در شبکه (کامپیوتر، سرور، دوربین، فایروال) بدون آدرس IP درست حرف نمی‌زند. شبکه‌ی یک سازمان را بدون برنامه‌ی آدرس‌دهی نمی‌شود طراحی کرد.</p>

<li><b>در طراحی:</b> اگر برای ۵۰ نفر فقط ۳۰ آدرس بدهید، شبکه کم می‌آورد. اگر برای ۵ نفر ۱۰۰۰ آدرس بدهید، آدرس هدر می‌رود و امنیت هم ضعیف می‌شود.</li>
<li><b>در فایروال:</b> قانون‌های FortiGate همه بر پایه‌ی Subnet نوشته می‌شوند؛ بدون این درس نمی‌توانید Policy درست بنویسید.</li>
<li><b>در مصاحبه و آزمون:</b> Subnetting اولین سؤال هر مصاحبه‌ی شبکه و آزمون CCNA است.</li>

<h2>اهداف یادگیری</h2>
<ul>
<li>توضیح دهید آدرس IP چیست و چرا به دو بخش «شبکه» و «میزبان» تقسیم می‌شود.</li>
<li>عدد ده‌دهی را به دودویی و برعکس تبدیل کنید.</li>
<li>برای هر آدرس و <span class="en">Prefix</span>: آدرس شبکه، Broadcast، اولین و آخرین Host و تعداد Host را حساب کنید.</li>
<li>تشخیص دهید دو Host در یک Subnet هستند یا نه، و بگویید ترافیکشان از چه مسیری می‌رود.</li>
<li>مشکل Mask اشتباه را روی یک دستگاه واقعی در PNetLab ببینید و رفع کنید.</li>
</ul>

<h2><span class="hn">۱.</span> آدرس IP چیست؟ یک مثال روزمره</h2>
<p>آدرس پستی «تهران، خیابان ولیعصر، پلاک ۱۲» دو بخش دارد: <b>خیابان</b> (محله‌ای که پست باید برود) و <b>پلاک</b> (کدام خانه در آن خیابان). آدرس IP هم همین‌طور است: بخشی از آن می‌گوید «کدام شبکه» (خیابان) و بخشی می‌گوید «کدام دستگاه در آن شبکه» (پلاک).</p>
<p>مثال: در <code>192.168.10.5</code> اگر شبکه <code>192.168.10.0</code> باشد، <code>.5</code> شماره دستگاه در آن شبکه است. <b>Subnet Mask</b> (که کمی بعد می‌خوانیم) دقیقاً می‌گوید مرز بین «خیابان» و «پلاک» کجاست.</p>
<div class="box"><b class="t">چرا مهم است؟</b>سوییچ و روتر با همین مرز تصمیم می‌گیرند بسته را مستقیم به همسایه بدهند یا به Gateway. اگر مرز را اشتباه بدانید، شبکه «نیمه‌کاره» کار می‌کند؛ همان خرابی‌هایی که در عیب‌یابی (TS13 و TS14) می‌بینید.</div>

<h2><span class="hn">۲.</span> چرا باینری؟</h2>
<p>کامپیوتر فقط 0 و 1 می‌فهمد. آدرس IPv4 یک عدد <b>۳۲ بیتی</b> است. برای خوانایی، ۳۲ بیت را به ۴ گروه ۸ بیتی (هر گروه یک <span class="en">Octet</span>) تقسیم می‌کنیم و هر گروه را به‌صورت ده‌دهی (۰ تا ۲۵۵) می‌نویسیم، با نقطه بین آن‌ها.</p>
<p>هر Octet هشت خانه دارد با ارزش‌های زیر؛ جمع همه برابر 255 است:</p>
<table>
<tr><th>ارزش خانه</th><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
<tr><td>مثال: 192</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>مثال: 168</td><td>1</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>مثال: 10</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td></tr>
<tr><td>مثال: 5</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td></tr>
</table>
<h3>تبدیل ده‌دهی به دودویی (گام‌به‌گام)</h3>
<p>از چپ‌ترین خانه شروع کن و برای هر خانه یک سؤال بپرس: «آیا عدد باقی‌مانده از ارزش این خانه بزرگ‌تر یا مساوی است؟»</p>
<ol>
<li>اگر بله: بیت این خانه 1 است و ارزش خانه را از عدد کم کن.</li>
<li>اگر نه: بیت این خانه 0 است و عدد تغییر نمی‌کند.</li>
<li>تا خانه آخر (ارزش 1) ادامه بده.</li>
</ol>
<p>مثال: تبدیل عدد 168 (هر سطر یک خانه است):</p>
<pre><code>Place value | Question        | Bit | Remainder
128         | 168 >= 128 ?    |  1  | 168-128 = 40
 64         |  40 >=  64 ?    |  0  | 40
 32         |  40 >=  32 ?    |  1  | 40-32 = 8
 16         |   8 >=  16 ?    |  0  | 8
  8         |   8 >=   8 ?    |  1  | 8-8 = 0
  4         |   0 >=   4 ?    |  0  | 0
  2         |   0 >=   2 ?    |  0  | 0
  1         |   0 >=   1 ?    |  0  | 0

Result: 168 = 10101000</code></pre>
<h3>تبدیل دودویی به ده‌دهی</h3>
<p>ارزش خانه‌هایی که بیتشان 1 است را با هم جمع کن:</p>
<pre><code>11000000
= 128 + 64
= 192</code></pre>

<p><b>Mask</b> هم یک عدد ۳۲ بیتی است: از چپ چند بیت 1 (قسمت شبکه) و بقیه 0 (قسمت میزبان). مثلاً Mask با ۲۴ بیت 1 برابر <code>255.255.255.0</code> است. نوشتن «تعداد بیت‌های 1» به شکل <code>/24</code> را <span class="en">Prefix Length</span> می‌گویند. پس <code>192.168.10.5/24</code> یعنی: ۲۴ بیت اول = شبکه، ۸ بیت آخر = میزبان.</p>
<table>
<tr><th>Prefix</th><th>Mask</th><th>تعداد آدرس</th><th>Host قابل‌استفاده</th><th>اندازه بلوک (Octet آخر)</th></tr>
<tr><td>/24</td><td>255.255.255.0</td><td>256</td><td>254</td><td>—</td></tr>
<tr><td>/25</td><td>255.255.255.128</td><td>128</td><td>126</td><td>128</td></tr>
<tr><td>/26</td><td>255.255.255.192</td><td>64</td><td>62</td><td>64</td></tr>
<tr><td>/27</td><td>255.255.255.224</td><td>32</td><td>30</td><td>32</td></tr>
<tr><td>/28</td><td>255.255.255.240</td><td>16</td><td>14</td><td>16</td></tr>
<tr><td>/29</td><td>255.255.255.248</td><td>8</td><td>6</td><td>8</td></tr>
<tr><td>/30</td><td>255.255.255.252</td><td>4</td><td>2</td><td>4</td></tr>
</table>
<p><b>فرمول تعداد آدرس:</b> هر Subnet به‌اندازه‌ی «۲ به توان تعداد بیت‌های میزبان» آدرس دارد. دو آدرس از آن‌ها رزرو است (اولی آدرس شبکه، آخری Broadcast) و به Host داده نمی‌شود.</p>
<pre><code>Total addresses = 2 ^ (32 - Prefix)
Usable hosts    = 2 ^ (32 - Prefix) - 2

Example (/26):
  Host bits = 32 - 26 = 6
  Total     = 2 ^ 6   = 64
  Usable    = 64 - 2  = 62</code></pre>

<h2><span class="hn">۴.</span> محاسبه Subnet: روش گام‌به‌گام</h2>
<p>برای هر آدرس/Prefix چهار پاسخ می‌خواهیم: <b>شبکه</b>، <b>Broadcast</b>، <b>Hostهای قابل‌استفاده (اولی تا آخری)</b>، <b>تعداد Host</b>.</p>
<div class="box"><b class="t">روش «اندازه بلوک» (Block Size)</b>
<ol>
<li>Octet «جالب» را پیدا کن: همان Octetی که Mask آن نه 0 است و نه 255.</li>
<li>اندازه بلوک را با فرمول زیر حساب کن.</li>
<li>عدد Octet آدرس را به نزدیک‌ترین مضرب بلوک (به سمت پایین) گرد کن؛ این می‌شود آدرس شبکه.</li>
<li>Broadcast یک عدد کمتر از شبکه بعدی است.</li>
<li>Hostها: از «شبکه + 1» تا «Broadcast - 1».</li>
</ol></div>
<pre><code>Block size = 256 - (mask value of the interesting octet)
Network    = largest multiple of Block size that is &lt;= octet value
Broadcast  = (next network) - 1
First host = Network + 1
Last host  = Broadcast - 1</code></pre>

<h3>مثال ۱ (ساده): 192.168.1.10/24</h3>
<pre><code>Mask       = 255.255.255.0   (no interesting octet)
Network    = 192.168.1.0
Broadcast  = 192.168.1.255
Hosts      = 192.168.1.1 - 192.168.1.254
Host count = 2^8 - 2 = 254</code></pre>
<p>چون Mask در سه Octet اول 255 است، سه Octet اول بدون تغییر می‌ماند.</p>

<h3>مثال ۲ (متوسط): 10.10.20.77/26</h3>
<pre><code>Mask         = 255.255.255.192
Interesting  = 4th octet (192)
Block size   = 256 - 192 = 64
Blocks       = 0, 64, 128, 192
77 is between 64 and 127
Network      = 10.10.20.64
Next network = 10.10.20.128
Broadcast    = 10.10.20.127
Hosts        = 10.10.20.65 - 10.10.20.126
Host count   = 2^6 - 2 = 62</code></pre>

<h3>مثال ۳ (سخت): 172.16.45.200/20</h3>
<pre><code>/20 = 8 + 8 + 4 bits
Mask         = 255.255.240.0
Interesting  = 3rd octet (240)
Block size   = 256 - 240 = 16
Blocks       = 0, 16, 32, 48 ...
45 is between 32 and 47
Network      = 172.16.32.0
Next network = 172.16.48.0
Broadcast    = 172.16.47.255
Hosts        = 172.16.32.1 - 172.16.47.254
Host count   = 2^12 - 2 = 4094</code></pre>

<h3>مثال ۴ (معکوس): به ۵۰ Host نیاز دارم؛ Prefix چند؟</h3>
<pre><code>Need          = 50 hosts + 2 reserved = 52
Smallest 2^n >= 52  ->  n = 6  (2^6 = 64)
Host bits     = 6
Prefix        = 32 - 6 = /26
Usable hosts  = 64 - 2 = 62   (enough for 50)</code></pre>
<p>همیشه «+2» را فراموش نکن؛ بدون آن جواب اشتباه می‌شود.</p>

<h2>تعداد کل IPهای یک Subnet را با «اندازه بلوک» حساب کنیم</h2>
<p>فقط یک سؤال داریم: <b>یک Subnet روی‌هم چند آدرس دارد؟</b> فعلاً کاری با آدرس شبکه، Broadcast یا Hostها نداریم. هر Octet ۲۵۶ حالت دارد (از 0 تا 255). پس برای شمردن کل آدرس‌ها دو چیز لازم است: اندازه بلوک، و اینکه «Octet جالب» کجاست.</p>
<pre><code>Total IPs = Block size x 256 ^ n

Block size = 256 - (mask value of the interesting octet)
n          = number of octets AFTER the interesting octet</code></pre>
<p>Octet جالب همان Octetی است که Mask آن نه 0 است و نه 255. هر Octet بعد از آن، کاملاً در بخش میزبان است و ضریب ۲۵۶ می‌آورد.</p>
<h3>مثال اول: تغییر در Octet چهارم</h3>
<pre><code>192.168.1.0/26
Mask       = 255.255.255.192
Block size = 256 - 192 = 64
n          = 0   (no octet after the 4th)
Total      = 64 x 256^0 = 64</code></pre>
<h3>مثال دوم: تغییر در Octet سوم</h3>
<pre><code>192.168.0.0/22
Mask       = 255.255.252.0
Block size = 256 - 252 = 4
n          = 1   (the 4th octet)
Total      = 4 x 256 = 1024</code></pre>
<h3>مثال سوم: تغییر در Octet دوم</h3>
<pre><code>10.0.0.0/14
Mask       = 255.252.0.0
Block size = 256 - 252 = 4
n          = 2   (the 3rd and 4th octets)
Total      = 4 x 256 x 256 = 262144</code></pre>
<h3>مثال چهارم: تغییر در Octet اول</h3>
<pre><code>0.0.0.0/6
Mask       = 252.0.0.0
Block size = 256 - 252 = 4
n          = 3   (the 2nd, 3rd and 4th octets)
Total      = 4 x 256 x 256 x 256 = 67108864</code></pre>
<h3>جدول خلاصه</h3>
<table>
<tr><th>محل تغییر</th><th>اندازه بلوک (نمونه)</th><th>محاسبه</th><th>تعداد کل IP</th></tr>
<tr><td>Octet چهارم</td><td>64</td><td>64</td><td>64</td></tr>
<tr><td>Octet سوم</td><td>4</td><td>4 × 256</td><td>1,024</td></tr>
<tr><td>Octet دوم</td><td>4</td><td>4 × 256 × 256</td><td>262,144</td></tr>
<tr><td>Octet اول</td><td>4</td><td>4 × 256 × 256 × 256</td><td>67,108,864</td></tr>
</table>
<div class="box"><b class="t">دو نکته‌ی مهم</b>۱) این عدد «کل آدرس‌ها» است؛ برای Host قابل‌استفاده باید ۲ تا کم کنید (شبکه و Broadcast). ۲) اگر Mask دقیقاً روی مرز Octet بود (مثل /24 یا /16 یا /8)، Octet جالب نداریم؛ ساده‌ترین کار این است که اولین Octet صفر را «بلوک ۲۵۶» بگیرید: برای /24 می‌شود ۲۵۶ و برای /16 می‌شود ۲۵۶ × ۲۵۶ = ۶۵۵۳۶.</div>
<h3>خودآزمایی (آسان تا سخت)</h3>
<details><summary>سؤال ۱: Mask = 255.255.255.224؛ تعداد کل آدرس؟</summary><pre><code>Block size = 256 - 224 = 32
n = 0
Total = 32</code></pre></details>
<details><summary>سؤال ۲: Mask = 255.255.248.0؛ تعداد کل آدرس؟</summary><pre><code>Block size = 256 - 248 = 8
n = 1
Total = 8 x 256 = 2048</code></pre></details>
<details><summary>سؤال ۳: Mask = 255.240.0.0؛ تعداد کل آدرس؟</summary><pre><code>Block size = 256 - 240 = 16
n = 2
Total = 16 x 256 x 256 = 1048576</code></pre></details>
<details><summary>سؤال ۴ (بررسی با روش توان ۲): آیا جواب سؤال ۳ با 2 به توان بیت‌های میزبان می‌خواند؟</summary><pre><code>Mask 255.240.0.0 = /12
Host bits = 32 - 12 = 20
Total = 2 ^ 20 = 1048576   (same answer)</code></pre></details>

<h2>جدول توان‌های ۲ (برای محاسبه‌ی سریع)</h2>
<p>تمام محاسبه‌های Subnetting روی توان‌های ۲ بنا شده‌اند: تعداد آدرس‌ها، اندازه بلوک و تعداد Host. این جدول را چند بار بخوانید تا به‌خاطر بسپارید؛ الگو ساده است: هر ردیف دو برابر ردیف قبلی است.</p>

<p>این جدول همه‌ی Prefixها را از /32 تا /0 کنار هم می‌گذارد. آن را حفظ نکنید؛ بفهمید و هر وقت لازم شد نگاه کنید. دو الگو را ببینید: با هر یک Prefix کمتر، تعداد آدرس‌ها <b>دو برابر</b> می‌شود؛ و ستون «تعداد کل IP» همان ۲ به توان «بیت‌های میزبان» است.</p>

<h2>کامپیوترها چطور می‌فهمند با هم در یک شبکه‌اند؟</h2>
<p>کامپیوتر هیچ «نقشه‌ای» از شبکه ندارد؛ فقط IP و Mask خودش و IP مقصد را می‌داند. با یک عملیات ساده‌ی بیتی به نام <span class="en">AND</span> تصمیم می‌گیرد:</p>
<ol>
<li>IP را به باینری تبدیل می‌کند.</li>
<li>Mask را به باینری تبدیل می‌کند.</li>
<li>بیت‌به‌بیت AND می‌گیرد؛ نتیجه «آدرس شبکه» (Network) است.</li>
<li>همین کار را برای IP مقصد با Mask خودش انجام می‌دهد.</li>
<li>اگر دو آدرس شبکه برابر بود، «هم‌شبکه» هستند و مستقیم (با ARP) ارتباط می‌گیرند؛ وگرنه بسته را به Gateway می‌دهد.</li>
</ol>
<h3>قانون AND (جدول درستی)</h3>
<pre><code>0 AND 0 = 0
0 AND 1 = 0
1 AND 0 = 0
1 AND 1 = 1</code></pre>
<p>فقط وقتی هر دو بیت 1 باشند نتیجه 1 است. چون Mask در بخش شبکه همه 1 است، بیت‌های شبکه حفظ می‌شوند؛ و چون در بخش میزبان همه 0 است، بیت‌های میزبان صفر می‌شوند. به همین دلیل نتیجه‌ی AND همیشه «آدرس شبکه» است.</p>
<h3>مثال ساده: هم‌شبکه</h3>
<p>دو کامپیوتر: A = 192.168.1.10/24 و B = 192.168.1.20/24. سه Octet اول Mask برابر 255 (همه 1) است و بدون تغییر می‌ماند؛ فقط Octet آخر را محاسبه می‌کنیم.</p>
<pre><code>Mask last octet : 0     = 00000000

A last octet    : 10    = 00001010
A AND Mask      :         00000000  = 0
A network       : 192.168.1.0

B last octet    : 20    = 00010100
B AND Mask      :         00000000  = 0
B network       : 192.168.1.0

192.168.1.0 = 192.168.1.0  ->  SAME network</code></pre>
<h3>مثال متوسط: شبیه‌اند ولی هم‌شبکه نیستند</h3>
<p>A = 10.10.20.77/26 و B = 10.10.20.130/26. Mask چهارم برابر 192 است.</p>
<pre><code>Mask last octet : 192   = 11000000

A last octet    : 77    = 01001101
A AND Mask      :         01000000  = 64
A network       : 10.10.20.64

B last octet    : 130   = 10000010
B AND Mask      :         10000000  = 128
B network       : 10.10.20.128

10.10.20.64 != 10.10.20.128  ->  DIFFERENT networks
Result: A sends to its Default Gateway (a router is required)</code></pre>
<div class="box"><b class="t">نتیجه‌ی کلیدی</b>«هم‌شبکه بودن» یعنی آدرس شبکه‌ی دو Host (حاصل IP AND Mask) برابر باشد؛ نه اینکه IPها شبیه هم باشند.</div>

<h2><span class="hn">۵.</span> Packet Flow: آیا دو Host هم‌شبکه‌اند؟</h2>
<p>وقتی Host می‌خواهد بسته بفرستد، با Mask خودش تصمیم می‌گیرد: آدرس مقصد را با Mask <span class="en">AND</span> می‌کند؛ اگر شبکه برابر شبکه خودش بود، مقصد «همین لینک» است و با <span class="en">ARP</span> مستقیم می‌فرستد؛ وگرنه بسته را به <span class="en">Default Gateway</span> می‌دهد.</p>
<pre><code>Host A: 10.10.20.77/26    network 10.10.20.64   (range 64 .. 127)
Host B: 10.10.20.130/26   network 10.10.20.128  (range 128 .. 191)

A wants to send to B:
  Is B in A's network?   130 is greater than 127  ->  NO
  So A sends the packet to its Default Gateway (the router).</code></pre>
<p>نکته جالب: دو آدرس <code>10.10.20.77</code> و <code>10.10.20.130</code> ظاهراً شبیه‌اند ولی در دو Subnet متفاوت‌اند، و بدون Router با هم حرف نمی‌زنند.</p>

<h2>اگر Default Gateway تنظیم نشده باشد چه می‌شود؟</h2>
<p>تصمیم Host همیشه با IP و Mask خودش شروع می‌شود. سپس بسته به نتیجه، یکی از دو مسیر زیر را می‌رود. نکته‌ی مهم این است که <b>ARP در هر دو مسیر انجام می‌شود</b>، ولی برای MAC متفاوت.</p>
<figure class="fig"><svg viewBox="0 0 720 330" role="img" aria-label="send decision flow"><rect x="250" y="10" width="220" height="44" rx="8" class="bx"/><text x="360" y="37" text-anchor="middle">Host wants to send a packet</text><path d="M360 54 V80" class="ln"/><rect x="230" y="80" width="260" height="52" rx="8" class="wrn"/><text x="360" y="103" text-anchor="middle" class="on">Destination in my subnet?</text><text x="360" y="119" text-anchor="middle" class="cap">IP AND Mask = same network ?</text><path d="M230 106 H120 V150" class="rp"/><text x="150" y="98" class="cap">YES</text><path d="M490 106 H600 V150" class="rq"/><text x="540" y="98" class="cap">NO</text><rect x="20" y="150" width="200" height="56" rx="8" class="hst"/><text x="120" y="175" text-anchor="middle" class="on">ARP for destination MAC</text><text x="120" y="191" text-anchor="middle" class="cap">then send directly</text><rect x="500" y="150" width="200" height="52" rx="8" class="wrn"/><text x="600" y="181" text-anchor="middle" class="on">Default Gateway set?</text><path d="M600 202 V232" class="ln"/><path d="M500 176 H430 V250" class="rq"/><text x="460" y="168" class="cap">YES</text><text x="612" y="222" class="cap">NO</text><rect x="330" y="250" width="200" height="56" rx="8" class="net"/><text x="430" y="275" text-anchor="middle" class="on">ARP for gateway MAC</text><text x="430" y="291" text-anchor="middle" class="cap">send to gateway (router)</text><rect x="560" y="232" width="150" height="56" rx="8" class="bx"/><text x="635" y="257" text-anchor="middle">No route</text><text x="635" y="273" text-anchor="middle" class="cap">send fails</text></svg><figcaption>شکل: درخت تصمیم Host هنگام ارسال بسته؛ در هر دو حالت مسیر درست با ARP کامل می‌شود.</figcaption></figure>
<table>
<tr><th>حالت</th><th>ARP برای چه MAC؟</th><th>فریم به کجا می‌رود؟</th></tr>
<tr><td>مقصد در Subnet خودم است</td><td>MAC مقصد نهایی</td><td>مستقیم به مقصد</td></tr>
<tr><td>مقصد در Subnet دیگر است</td><td>MAC Default Gateway</td><td>به روتر، و روتر ادامه می‌دهد</td></tr>
<tr><td>مقصد در Subnet دیگر است و Gateway نیست</td><td>—</td><td>ارتباط برقرار نمی‌شود (جایی برای ارسال نیست)</td></tr>
</table>
<p>پس دو کامپیوتر در دو Subnet متفاوت، بدون Default Gateway (و بدون Route دستی دیگر)، نمی‌توانند با هم ارتباط بگیرند. ARP فقط برای دستگاه‌های «روی همین لینک» جواب می‌دهد؛ هیچ دستگاهی در Subnet دیگر به ARP Request شما پاسخ نمی‌دهد.</p>
<div class="box"><b class="t">قاعده‌ی خلاصه</b>اگر مقصد همسایه است، با ARP خودش را پیدا می‌کنیم. اگر همسایه نیست، بسته را برای دروازه می‌فرستیم و دروازه تصمیم می‌گیرد.</div>

<h2><span class="hn">۸.</span> Lab هدایت‌شده: «Mask چطور تعیین می‌کند چه کسی همسایه است»</h2>
<p>در Lab <code>L00-ImageValidation</code> می‌دانید <code>R1</code> روی <code>Gi0/0.10</code> آدرس <code>10.10.10.1/24</code> و <code>SW1</code> روی <code>Vlan10</code> آدرس <code>10.10.10.2/24</code> دارد و <code>ping</code> کار می‌کند. حالا عمداً Mask را خراب می‌کنیم تا اثرش را ببینید.</p>
<h3>گام ۱: وضعیت سالم</h3>
<pre><code>R1# show ip interface brief
R1# show ip route connected
R1# ping 10.10.10.2</code></pre>
<p><code>show ip route connected</code> باید شبکه <code>10.10.10.0/24</code> را به‌عنوان Connected نشان بدهد؛ <code>ping</code> موفق.</p>
<h3>گام ۲: تغییر آدرس سوییچ به یک Host «بالای نصف»</h3>
<pre><code>SW1# configure terminal
SW1(config)# interface vlan 10
SW1(config-if)# ip address 10.10.10.130 255.255.255.0
SW1(config-if)# end</code></pre>
<h3>گام ۳: تنگ‌کردن Mask روی روتر</h3>
<pre><code>R1# configure terminal
R1(config)# interface gi0/0.10
R1(config-subif)# ip address 10.10.10.1 255.255.255.128
R1(config-subif)# end
R1# show ip route connected
R1# ping 10.10.10.130</code></pre>
<p><b>پیش‌بینی (قبل از اجرا فکر کنید):</b> با Mask جدید، محدوده‌ی «همین لینک» برای روتر کوچک‌تر شده است:</p>
<pre><code>R1 new mask = /25
R1 network  = 10.10.10.0 - 10.10.10.127
SW1 address = 10.10.10.130   -> outside this range
Result      : R1 has no connected route to .130 -> ping fails</code></pre>
<p>نتیجه‌ی واقعی را بنویسید؛ اگر چیز دیگری دیدید همان را ثبت کنید. سمت سوییچ Mask قبلی (/24) را دارد و فکر می‌کند روتر همسایه است؛ پس ارتباط «نیمه‌کاره» می‌شود.</p>
<h3>گام ۴: رفع</h3>
<pre><code>R1(config)# interface gi0/0.10
R1(config-subif)# ip address 10.10.10.1 255.255.255.0
R1(config-subif)# end
R1# ping 10.10.10.130</code></pre>
<p>بعد از رفع، ping موفق می‌شود. سپس آدرس سوییچ را به <code>10.10.10.2</code> برگردانید.</p>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> چطور یک بلوک آدرس را به Subnetهای هم‌اندازه‌ی نامناسب نبُریم، بلکه برای هر بخش سازمان دقیقاً به اندازه نیازش آدرس بدهیم. این کار را <span class="en">VLSM</span> (مخفف <span class="en">Variable Length Subnet Mask</span>، یعنی «ماسک زیرشبکه با طول متغیر») می‌گویند. بعد، نتیجه را در یک «برنامه‌ی آدرس‌دهی» (<span class="en">IP Plan</span>، مخفف <span class="en">IP Addressing Plan</span>) می‌نویسیم.</p>
<p><b>چرا لازم است:</b> تصور کنید یک ساختمان اداری دارید و می‌خواهید طبقه‌ها را تقسیم کنید. اگر همه‌ی اتاق‌ها را به‌اندازه‌ی بزرگ‌ترین اتاق (سالن اجتماعات) بسازید، فضای زیادی هدر می‌رود. در شبکه هم همین است: لینک بین دو روتر فقط به ۲ آدرس نیاز دارد، ولی اگر یک /24 با ۲۵۴ آدرس به آن بدهید، ۲۵۲ آدرس هدر رفته است.</p>
<ul>
<li><b>در کار روزانه:</b> وقتی شعبه‌ی جدید باز می‌شود، باید بدون به‌هم‌ریختن شبکه‌ی فعلی، آدرس تازه بدهید.</li>
<li><b>در امنیت:</b> هر Subnet یک «مرز» برای فایروال است. Subnetهای درست‌اندازه یعنی قانون‌های دقیق‌تر.</li>
<li><b>در دوره‌ی ما:</b> پروژه‌ی نهایی (Capstone) یک مرکز و سه شعبه دارد؛ IP Plan آن را همین هفته می‌سازیم.</li>
</ul>
<div class="box"><b class="t">مسیر درس</b>مشکل (هدررفت) ← ایده‌ی VLSM ← مثال ساده ← مثال متوسط ← مثال سخت (سازمان واقعی) ← تمرین ← Lab ← عیب‌یابی.</div>

<h2><span class="hn">۱.</span> مشکل: تقسیم هم‌اندازه و هدررفت آدرس</h2>
<p>فرض کنید بلوک <code>192.168.10.0/24</code> (۲۵۶ آدرس) دارید و چهار بخش می‌خواهید: فروش (۱۰۰ کامپیوتر)، فنی (۵۰)، مدیریت (۱۲)، و یک لینک بین دو روتر (۲).</p>
<p>اگر ساده‌لوحانه همه را /26 (۶۲ Host) بسازید، فروش جا نمی‌شود (۱۰۰ &gt; ۶۲). اگر همه را /25 (۱۲۶ Host) بسازید، فقط ۲ Subnet می‌گیرید و چهار بخش جا نمی‌شود. یعنی با اندازه‌ی ثابت، نه هدر نمی‌دهیم و نه جا می‌شویم. راه‌حل: <b>اندازه‌ی متغیر</b>.</p>

<h2>سؤال مهم: در شبکه داخلی برای IP پولی نمی‌دهیم، پس چرا اینقدر مراقب هدررفت هستیم؟</h2>
<p>حرف درستی است: آدرس‌های خصوصی (مثل 10.0.0.0/8 یا 192.168.0.0/16) هزینه ندارند و هیچ‌کس برای آن‌ها فاکتور نمی‌فرستد. اما «پول» تنها دلیل VLSM نیست. دلیل‌های اصلی این‌هاست:</p>
<table>
<tr><th>دلیل</th><th>توضیح</th></tr>
<tr><td>۱. بلوک شما محدود است</td><td>معمولاً از یک بلوک مشخص (مثلاً یک /24 یا /22) استفاده می‌کنید. اگر هر لینک دو روتر یک /24 کامل بگیرد، بلوک زود تمام می‌شود.</td></tr>
<tr><td>۲. رشد آینده</td><td>شعبه‌ی جدید و VLAN جدید می‌آید. اگر فضا را هدر داده باشید، مجبور می‌شوید همه‌چیز را عوض کنید.</td></tr>
<tr><td>۳. مدیریت و مستندسازی</td><td>Subnetهای درست‌اندازه و منظم، IP Plan را خوانا و عیب‌یابی را سریع می‌کند.</td></tr>
<tr><td>۴. خلاصه‌سازی مسیرها</td><td>وقتی آدرس‌ها پشت‌سرهم و منظم باشند، می‌شود چند Route را در یک Route خلاصه کرد (جدول Route کوچک‌تر).</td></tr>
<tr><td>۵. جلوگیری از هم‌پوشانی</td><td>در ادغام شرکت‌ها یا اتصال VPN بین دو سایت، بازه‌ها نباید هم‌پوشانی داشته باشند؛ مصرف بی‌حساب بازه این خطر را بالا می‌برد.</td></tr>
<tr><td>۶. امنیت و Broadcast</td><td>Subnet خیلی بزرگ یعنی Broadcast Domain بزرگ و Policy فایروال درشت و نامحدود.</td></tr>
</table>
<div class="box"><b class="t">یک نکته‌ی صادقانه</b>اگر بلوک خیلی بزرگی مثل 10.0.0.0/8 دارید، کمبود آدرس معمولاً مشکل اصلی نیست. آن‌جا دلیل‌های ۳ تا ۶ (نظم، خلاصه‌سازی، هم‌پوشانی و امنیت) مهم‌ترند. VLSM در بلوک‌های کوچک‌تر و در لینک‌های بین روترها اهمیت بیشتری دارد.</div>
<h3>VLSM کجا چقدر مهم است؟</h3>
<table>
<tr><th>محیط</th><th>اهمیت VLSM</th></tr>
<tr><td>شبکه‌ی خانگی کوچک</td><td>کم</td></tr>
<tr><td>شبکه‌ی شرکت کوچک</td><td>متوسط</td></tr>
<tr><td>سازمان بزرگ</td><td>بسیار زیاد</td></tr>
<tr><td>ISP و شبکه‌های گسترده</td><td>بسیار زیاد (IPv4 عمومی محدود و گران است)</td></tr>
<tr><td>لینک بین روترها</td><td>بسیار مهم (فقط ۲ آدرس لازم است)</td></tr>
</table>
<h3>مثال: ۳۰۰ کامپیوتر؛ یک /23 یا سه /24؟</h3>
<pre><code>Option 1: one /23
  Mask          = 255.255.254.0
  Total         = 2 ^ 9 = 512
  Usable        = 512 - 2 = 510
  Spare         = 510 - 300 = 210
  Broadcast domains = 1  (all 300 PCs together)

Option 2: three /24
  Usable each   = 254   (total 762)
  Broadcast domains = 3  (separated)
  Needs a router or L3 switch between them</code></pre>
<p>از نظر ظرفیت، هر دو گزینه کافی است. انتخاب نهایی به طراحی بستگی دارد: اگر واحدهای سازمان باید از هم جدا باشند (امنیت، کاهش Broadcast، Policy جدا)، سه Subnet بهتر است؛ ولی برای ارتباط بینشان به دستگاه لایه ۳ نیاز دارید (روتر یا سوییچ لایه ۳). اگر همه یک گروه یکسان‌اند و نیازی به جداسازی نیست، یک /23 ساده‌تر است.</p>

<h2><span class="hn">۲.</span> ایده‌ی VLSM به زبان ساده</h2>
<p><span class="en">VLSM</span> یعنی «Subnet Mask با طول متغیر» (<span class="en">Variable Length Subnet Mask</span>). مثل برش پیتزا برای مهمان‌ها: به کسی که گرسنه‌تر است برش بزرگ‌تر می‌دهید و به بقیه کوچک‌تر. فقط یک قانون هست: برش‌ها نباید روی هم بیفتند.</p>
<div class="box"><b class="t">سه قانون طلایی VLSM</b>
۱) <b>همیشه از بزرگ‌ترین نیاز شروع کن.</b>
۲) هر Subnet باید روی مرز مضرب اندازه‌ی خودش شروع شود (مثلاً یک /26 باید روی ۰، ۶۴، ۱۲۸ یا ۱۹۲ شروع شود).
۳) هیچ دو Subnet نباید هم‌پوشانی داشته باشند.</div>
<p><b>مراحل کار برای هر بخش:</b> (۱) نیاز را بشمار و ۲ آدرس رزرو (شبکه و Broadcast) اضافه کن. (۲) کوچک‌ترین توان ۲ که کافی باشد را پیدا کن. (۳) Prefix را از آن بساز. (۴) از اولین آدرس آزاد شروع به تخصیص کن. (۵) آدرس بعدی آزاد را یادداشت کن.</p>

<h2><span class="hn">۳.</span> مثال ساده (دو بخش)</h2>
<p>بلوک <code>10.0.0.0/24</code> را داریم. بخش A به ۱۰۰ Host و بخش B به ۲۰ Host نیاز دارد. اول بزرگ‌ترین (A):</p>
<pre><code>A: need = 100 + 2 = 102
   2^7 = 128 >= 102  ->  Prefix = /25
   Network   = 10.0.0.0/25
   Hosts     = 10.0.0.1 - 10.0.0.126
   Broadcast = 10.0.0.127
   Next free = 10.0.0.128</code></pre>
<p>بعد B از اولین آدرس آزاد شروع می‌شود:</p>
<pre><code>B: need = 20 + 2 = 22
   2^5 = 32 >= 22   ->  Prefix = /27
   Network   = 10.0.0.128/27
   Hosts     = 10.0.0.129 - 10.0.0.158
   Broadcast = 10.0.0.159
   Next free = 10.0.0.160  (up to 10.0.0.255 stays free for growth)</code></pre>
<p>باقی‌مانده بلوک (۱۶۰ تا ۲۵۵) برای رشد آینده خالی می‌ماند و هدررفت نیست.</p>

<h2><span class="hn">۴.</span> مثال متوسط (چهار بخش)</h2>
<figure class="fig"><svg viewBox="0 0 720 130" role="img" aria-label="VLSM address bar"><rect x="20.0" y="30" width="340.0" height="46" class="net" stroke="#0b1018"/><text x="190.0" y="58" text-anchor="middle" class="on">Sales /25</text><rect x="360.0" y="30" width="170.0" height="46" class="hst" stroke="#0b1018"/><text x="445.0" y="58" text-anchor="middle" class="on">Tech /26</text><rect x="530.0" y="30" width="42.5" height="46" class="net" stroke="#0b1018"/><text x="551.2" y="58" text-anchor="middle" class="on">Mgmt /28</text><rect x="572.5" y="30" width="10.6" height="46" class="hst" stroke="#0b1018"/><rect x="583.1" y="30" width="116.9" height="46" class="bx" stroke="#0b1018"/><text x="641.6" y="58" text-anchor="middle" class="">Free</text><text x="20.0" y="98" text-anchor="middle" class="cap">.0</text><text x="360.0" y="98" text-anchor="middle" class="cap">.128</text><text x="530.0" y="98" text-anchor="middle" class="cap">.192</text><text x="572.5" y="98" text-anchor="middle" class="cap">.208</text><text x="583.1" y="98" text-anchor="middle" class="cap">.212</text><text x="700.0" y="98" text-anchor="middle" class="cap">.255</text><text x="360" y="122" text-anchor="middle" class="cap">192.168.10.0 → 255 : هر Subnet درست بعد از Broadcast قبلی شروع می‌شود</text></svg><figcaption>شکل ۲: نوار آدرس VLSM؛ بخش بزرگ‌تر اول و بدون هم‌پوشانی.</figcaption></figure>

<p>بلوک <code>192.168.10.0/24</code>؛ همان چهار بخش بخش ۱: فروش ۱۰۰، فنی ۵۰، مدیریت ۱۲، لینک روتر ۲.</p>
<table>
<tr><th>بخش</th><th>نیاز+۲</th><th>اندازه</th><th>Prefix</th><th>شبکه</th><th>Hostها</th><th>Broadcast</th></tr>
<tr><td>فروش</td><td>102</td><td>128</td><td>/25</td><td>192.168.10.0</td><td>.1 – .126</td><td>.127</td></tr>
<tr><td>فنی</td><td>52</td><td>64</td><td>/26</td><td>192.168.10.128</td><td>.129 – .190</td><td>.191</td></tr>
<tr><td>مدیریت</td><td>14</td><td>16</td><td>/28</td><td>192.168.10.192</td><td>.193 – .206</td><td>.207</td></tr>
<tr><td>لینک روتر</td><td>4</td><td>4</td><td>/30</td><td>192.168.10.208</td><td>.209 – .210</td><td>.211</td></tr>
</table>
<p>دقت کنید هر شروع، دقیقاً بعد از Broadcast قبلی است (۱۲۷ ← ۱۲۸، ۱۹۱ ← ۱۹۲، ۲۰۷ ← ۲۰۸). آدرس‌های <code>.212</code> تا <code>.255</code> هنوز آزادند (۴۴ آدرس).</p>
<p><b>نکته:</b> اگر ترتیب را برعکس بگیرید (اول لینک /30 را در <code>.0</code> بگذارید)، بعداً /25 روی مرز ۱۲۸ می‌افتد و دیگر فروش در یک تکه جا نمی‌شود. برای همین «بزرگ‌ترین اول».</p>

<h2>پیش‌نیاز مثال بعدی: بلوک 10.20.0.0/22 یعنی چه؟</h2>
<p>مثال سخت پایین با این جمله شروع می‌شود: «سازمانی بلوک <code>10.20.0.0/22</code> دارد.» اول آن را از پایه باز می‌کنیم.</p>
<h3>گام ۱: معنی /22</h3>
<p>از ۳۲ بیت آدرس، ۲۲ بیت برای «شبکه» است و ۱۰ بیت باقی‌مانده برای «میزبان». هر بیت میزبان دو حالت دارد؛ پس تعداد آدرس‌ها این‌طور حساب می‌شود:</p>
<pre><code>Host bits       = 32 - 22 = 10
Total addresses = 2 ^ 10 = 1024</code></pre>
<h3>گام ۲: چرا آخرین آدرس 10.20.3.255 است؟</h3>
<p>اول /22 را به Subnet Mask تبدیل می‌کنیم:</p>
<pre><code>/22  = 11111111.11111111.11111100.00000000
Mask = 255.255.252.0</code></pre>
<p>Octet سوم «جالب» است (چون 252 نه 0 است و نه 255). اندازه بلوک آن:</p>
<pre><code>Block size = 256 - 252 = 4     (in the 3rd octet)</code></pre>
<p>یعنی شبکه‌های /22 در Octet سوم هر ۴ عدد یک‌بار شروع می‌شوند:</p>
<table>
<tr><th>شماره شبکه</th><th>آدرس شروع</th></tr>
<tr><td>شبکه ۱</td><td>10.20.0.0</td></tr>
<tr><td>شبکه ۲</td><td>10.20.4.0</td></tr>
<tr><td>شبکه ۳</td><td>10.20.8.0</td></tr>
<tr><td>شبکه ۴</td><td>10.20.12.0</td></tr>
</table>
<p>پس شبکه‌ی اول ما از <code>10.20.0.0</code> شروع می‌شود و درست قبل از شبکه‌ی بعدی (<code>10.20.4.0</code>) تمام می‌شود:</p>
<pre><code>Network   = 10.20.0.0
Next net  = 10.20.4.0
Broadcast = 10.20.4.0 - 1 = 10.20.3.255
Range     = 10.20.0.0 - 10.20.3.255</code></pre>
<h3>گام ۳: چهار «تکه»ی داخل بلوک</h3>
<p>Octet سوم در این بلوک چهار مقدار می‌گیرد: 0، 1، 2 و 3. هر مقدار یک تکه‌ی ۲۵۶تایی است:</p>
<pre><code>10.20.0.0 - 10.20.0.255    256 addresses
10.20.1.0 - 10.20.1.255    256 addresses
10.20.2.0 - 10.20.2.255    256 addresses
10.20.3.0 - 10.20.3.255    256 addresses
Total = 4 x 256 = 1024</code></pre>
<figure class="fig"><svg viewBox="0 0 720 150" role="img" aria-label="/22 block"><rect x="20" y="40" width="165" height="50" rx="6" class="net" stroke="#0b1018"/><text x="102" y="63" text-anchor="middle" class="on">10.20.0.0 - .255</text><text x="102" y="80" text-anchor="middle" class="cap">256 addresses</text><rect x="190" y="40" width="165" height="50" rx="6" class="hst" stroke="#0b1018"/><text x="272" y="63" text-anchor="middle" class="on">10.20.1.0 - .255</text><text x="272" y="80" text-anchor="middle" class="cap">256 addresses</text><rect x="360" y="40" width="165" height="50" rx="6" class="net" stroke="#0b1018"/><text x="442" y="63" text-anchor="middle" class="on">10.20.2.0 - .255</text><text x="442" y="80" text-anchor="middle" class="cap">256 addresses</text><rect x="530" y="40" width="165" height="50" rx="6" class="hst" stroke="#0b1018"/><text x="612" y="63" text-anchor="middle" class="on">10.20.3.0 - .255</text><text x="612" y="80" text-anchor="middle" class="cap">256 addresses</text><path d="M20 108 H685" class="ln"/><text x="352" y="130" text-anchor="middle">10.20.0.0/22 = 4 x 256 = 1024 addresses</text></svg><figcaption>شکل: بلوک /22 چهار تکه‌ی ۲۵۶تایی (چهار /24 پشت‌سرهم) است.</figcaption></figure>
<div class="box"><b class="t">نکته‌ی مهم</b>این چهار تکه فعلاً فقط «چهار قسمت از یک بلوک بزرگ» هستند، نه الزاماً چهار Subnet نهایی. در VLSM ما همین ۱۰۲۴ آدرس را به Subnetهایی با اندازه‌های مختلف (مثلاً /23، /25، /26، /27 و /30) تقسیم می‌کنیم؛ همان کاری که در مثال سخت پایین می‌بینید.</div>
<details><summary>سؤال خودآزمایی: در یک /22، هر تکه‌ی «Octet سوم» چند آدرس دارد؟</summary><pre><code>Each value of the 3rd octet = 256 addresses (the last octet has 8 host bits: 2 ^ 8 = 256)
Answer: 256</code></pre></details>

<h2><span class="hn">۵.</span> مثال سخت (سازمان واقعی: مرکز و سه شعبه)</h2>
<p>سازمانی با بلوک <code>10.20.0.0/22</code> (۱۰۲۴ آدرس: <code>10.20.0.0</code> تا <code>10.20.3.255</code>). نیازها:</p>
<table>
<tr><th>بخش</th><th>Host</th></tr>
<tr><td>مرکز: کاربران</td><td>300</td></tr>
<tr><td>مرکز: سرورها</td><td>60</td></tr>
<tr><td>مرکز: مدیریت تجهیزات</td><td>25</td></tr>
<tr><td>شعبه ۱: کاربران</td><td>100</td></tr>
<tr><td>شعبه ۲: کاربران</td><td>50</td></tr>
<tr><td>شعبه ۳: کاربران</td><td>20</td></tr>
<tr><td>سه لینک روتر (هرکدام)</td><td>2</td></tr>
</table>
<p><b>گام ۱ - اندازه هر بخش</b> (هر بخش یک سطر؛ مرتب از بزرگ به کوچک):</p>
<pre><code>Center users    : 300 + 2 = 302 -> 512 -> /23
Branch 1        : 100 + 2 = 102 -> 128 -> /25
Center servers  :  60 + 2 =  62 ->  64 -> /26
Branch 2        :  50 + 2 =  52 ->  64 -> /26
Center mgmt     :  25 + 2 =  27 ->  32 -> /27
Branch 3        :  20 + 2 =  22 ->  32 -> /27
3 links         :   2 + 2 =   4 ->   4 -> /30 (each)</code></pre>
<p><b>گام ۲ - آیا بلوک کافی است؟</b></p>
<pre><code>Total needed = 512 + 128 + 64 + 64 + 32 + 32 + (3 x 4)
             = 844
Available    = 1024  (a /22)
844 &lt;= 1024  ->  OK</code></pre>
<p><b>گام ۳ - تخصیص پشت‌سرهم:</b></p>
<table>
<tr><th>بخش</th><th>Prefix</th><th>شبکه</th><th>Broadcast</th></tr>
<tr><td>مرکز-کاربران</td><td>/23</td><td>10.20.0.0</td><td>10.20.1.255</td></tr>
<tr><td>شعبه ۱</td><td>/25</td><td>10.20.2.0</td><td>10.20.2.127</td></tr>
<tr><td>مرکز-سرورها</td><td>/26</td><td>10.20.2.128</td><td>10.20.2.191</td></tr>
<tr><td>شعبه ۲</td><td>/26</td><td>10.20.2.192</td><td>10.20.2.255</td></tr>
<tr><td>مرکز-مدیریت</td><td>/27</td><td>10.20.3.0</td><td>10.20.3.31</td></tr>
<tr><td>شعبه ۳</td><td>/27</td><td>10.20.3.32</td><td>10.20.3.63</td></tr>
<tr><td>لینک ۱</td><td>/30</td><td>10.20.3.64</td><td>10.20.3.67</td></tr>
<tr><td>لینک ۲</td><td>/30</td><td>10.20.3.68</td><td>10.20.3.71</td></tr>
<tr><td>لینک ۳</td><td>/30</td><td>10.20.3.72</td><td>10.20.3.75</td></tr>
</table>
<p><b>گام ۴ - بررسی:</b> هر شروع باید دقیقاً یک عدد بعد از Broadcast قبلی باشد.</p>
<pre><code>Last used address = 10.20.3.75
Free space        = 10.20.3.76 - 10.20.3.255  (180 addresses, for growth)
Overlap check     : every start = previous broadcast + 1  ->  no overlap</code></pre>

<h2><span class="hn">۶.</span> IP Plan: سند زنده‌ی شبکه</h2>
<p>جدول بالا هنوز «محاسبه» است. IP Plan سندی است که تیم نگه می‌دارد و این ستون‌ها را دارد: نام بخش، VLAN، شبکه/Prefix، Gateway، بازه‌ی DHCP، آدرس‌های ثابت، مالک، توضیح. قاعده‌ی تجربی: <b>Gateway را همیشه اولین Host (.1) بگذارید</b> و سرورها/تجهیزات را از انتهای بازه یا بازه‌ی ثابت جدا کنید، تا همه بدانند «.1 یعنی Gateway».</p>
<p>نمونه برای Lab دوره (در Capstone استفاده می‌شود؛ همین هفته در <code>02-design/ip-plan.md</code> ثبتش کنید):</p>
<table>
<tr><th>VLAN</th><th>نام</th><th>شبکه</th><th>Gateway</th></tr>
<tr><td>10</td><td>مدیریت</td><td>10.10.10.0/24</td><td>10.10.10.1</td></tr>
<tr><td>20</td><td>کاربران</td><td>10.10.20.0/24</td><td>10.10.20.1</td></tr>
<tr><td>30</td><td>سرورها</td><td>10.10.30.0/24</td><td>10.10.30.1</td></tr>
</table>

<h2><span class="hn">۷.</span> تمرین‌های درجه‌بندی‌شده</h2>
<details><summary>۱ (ساده): از 192.168.1.0/24 دو Subnet بساز: ۱۲۰ Host و ۱۰ Host</summary><pre><code>120 + 2 = 122 -> 128 -> /25
  192.168.1.0/25     hosts .1 - .126
10 + 2 = 12 -> 16 -> /28
  192.168.1.128/28   hosts .129 - .142</code></pre></details>
<details><summary>۲ (ساده): لینک بین دو روتر از 10.1.1.0/24</summary><pre><code>Prefix    = /30
Network   = 10.1.1.0/30
Hosts     = 10.1.1.1 - 10.1.1.2
Broadcast = 10.1.1.3</code></pre></details>
<details><summary>۳ (متوسط): از 172.16.0.0/24: ۶۰، ۳۰، ۱۰ Host</summary><pre><code>60 + 2 = 62 -> 64 -> /26
  172.16.0.0/26    hosts .1 - .62
30 + 2 = 32 -> /27
  172.16.0.64/27   hosts .65 - .94
10 + 2 = 12 -> 16 -> /28
  172.16.0.96/28   hosts .97 - .110</code></pre></details>

  10.5.0.0/24
70 + 2 = 72 -> 128 -> /25
  10.5.1.0/25      hosts .1 - .126
30 + 2 = 32 -> /27
  10.5.1.128/27
Link 1 -> 10.5.1.160/30
Link 2 -> 10.5.1.164/30

<h2><span class="hn">۸.</span> Lab هدایت‌شده: اجرای IP Plan روی روتر</h2>
<p>برای دیدن اینکه روتر Subnetها را «می‌شناسد»، روی <code>R1</code> چند Loopback به‌عنوان Subnet مجازی می‌سازیم.</p>
<h3>گام ۱: ساخت سه Subnet از مثال متوسط</h3>
<pre><code>R1# configure terminal
R1(config)# interface loopback 1
R1(config-if)# ip address 192.168.10.1 255.255.255.128
R1(config-if)# interface loopback 2
R1(config-if)# ip address 192.168.10.129 255.255.255.192
R1(config-if)# interface loopback 3
R1(config-if)# ip address 192.168.10.193 255.255.255.240
R1(config-if)# end</code></pre>
<h3>گام ۲: بررسی</h3>
<pre><code>R1# show ip interface brief
R1# show ip route connected</code></pre>
<p>باید سه Route از نوع <code>C</code> ببینید: <code>192.168.10.0/25</code>، <code>192.168.10.128/26</code>، <code>192.168.10.192/28</code>. دقت کنید روتر خودش «آدرس شبکه» را از Mask محاسبه کرده است؛ همان‌طور که شما محاسبه کردید.</p>
<h3>گام ۳: ایجاد عمدی هم‌پوشانی</h3>
<pre><code>R1(config)# interface loopback 4
R1(config-if)# ip address 192.168.10.100 255.255.255.192</code></pre>
<p>پیش‌بینی: IOS معمولاً خطای <code>% 192.168.10.64 overlaps with Loopback1</code> می‌دهد و دستور را نمی‌پذیرد (نتیجه‌ی واقعی را ثبت کنید). همین است که از هم‌پوشانی در یک روتر جلوگیری می‌کند.</p>
<h3>گام ۴: پاک‌سازی</h3>
<pre><code>R1(config)# no interface loopback 1
R1(config)# no interface loopback 2
R1(config)# no interface loopback 3
R1(config)# no interface loopback 4
R1(config)# end</code></pre>

<h2><span class="hn">۱.</span> ساختار آدرس IPv6</h2>
<figure class="fig"><svg viewBox="0 0 720 150" role="img" aria-label="IPv6 anatomy"><rect x="20" y="30" width="330" height="50" class="net" stroke="#0b1018"/><text x="185" y="60" text-anchor="middle" class="on">Routing Prefix (48 bit)</text><rect x="350" y="30" width="80" height="50" class="wrn" stroke="#0b1018"/><text x="390" y="60" text-anchor="middle" class="on">Subnet ID (16)</text><rect x="430" y="30" width="270" height="50" class="hst" stroke="#0b1018"/><text x="565" y="60" text-anchor="middle" class="on">Interface ID (64 bit)</text><text x="190" y="105" text-anchor="middle">2001:0db8:abcd</text><text x="390" y="105" text-anchor="middle">0010</text><text x="565" y="105" text-anchor="middle">0000:0000:0000:0001</text><path d="M20 120 H430" class="ln"/><text x="225" y="140" text-anchor="middle" class="cap">Network = /64</text><path d="M430 120 H700" class="ln"/><text x="565" y="140" text-anchor="middle" class="cap">Host</text></svg><figcaption>شکل ۳: ساختار آدرس IPv6؛ ۶۴ بیت اول شبکه (Prefix + Subnet) و ۶۴ بیت آخر دستگاه.</figcaption></figure>

<p>آدرس IPv6 یک عدد ۱۲۸ بیتی است. آن را به ۸ گروه ۱۶ بیتی تقسیم می‌کنیم و هر گروه را با ۴ رقم شانزده‌شانزدهی (<span class="en">Hex</span>: ارقام ۰ تا ۹ و a تا f) می‌نویسیم، با دونقطه بین گروه‌ها:</p>
<pre><code>2001:0db8:0010:0010:0000:0000:0000:0001</code></pre>
<p>هر رقم Hex معادل ۴ بیت است. پس حساب کل بیت‌ها این‌طور می‌شود:</p>
<pre><code>1 hex digit = 4 bits      (f = 1111 , a = 1010)
1 group     = 4 digits = 16 bits
8 groups    = 8 x 16   = 128 bits</code></pre>
<p>مثل IPv4، آدرس دو بخش دارد: <b>Prefix</b> (شبکه) و <b>Interface ID</b> (دستگاه). در بیشتر شبکه‌ها Prefix برابر <code>/64</code> است: ۶۴ بیت اول شبکه و ۶۴ بیت آخر دستگاه. در IPv6 به‌جای «Subnet Mask» همیشه Prefix می‌نویسیم.</p>

<h2><span class="hn">۲.</span> دو قانون کوتاه‌نویسی</h2>
<p><b>قانون ۱: صفرهای ابتدای هر گروه را حذف کن.</b> مثال: <code>0db8</code> ← <code>db8</code> و <code>0010</code> ← <code>10</code> و <code>0000</code> ← <code>0</code>.</p>
<p><b>قانون ۲: یک (فقط یک) رشته‌ی متوالی از گروه‌های تماماً صفر را با <code>::</code> جایگزین کن.</b></p>
<pre><code>Full   : 2001:0db8:0010:0010:0000:0000:0000:0001
Rule 1 : 2001:db8:10:10:0:0:0:1
Rule 2 : 2001:db8:10:10::1</code></pre>
<div class="box"><b class="t">چرا فقط یک بار ::؟</b>اگر دو بار بنویسید، معلوم نیست هرکدام چند گروه صفر را نشان می‌دهند. پس <code>2001::5::1</code> غلط است. اگر دو رشته‌ی صفر داشتید، <code>::</code> را روی <b>بلندترین</b> رشته بگذارید.</div>

<h2><span class="hn">۳.</span> مثال‌های کوتاه‌نویسی (ساده تا سخت)</h2>
<h3>مثال ساده</h3>
<pre><code>Full  : fe80:0000:0000:0000:0000:0000:0000:0001
Step 1: fe80:0:0:0:0:0:0:1
Step 2: fe80::1</code></pre>
<h3>مثال متوسط (دو رشته صفر)</h3>
<pre><code>Full  : 2001:0db8:0000:0000:0001:0000:0000:0005
Step 1: 2001:db8:0:0:1:0:0:5
Step 2: two zero-runs of equal length -> shorten the FIRST one
Result: 2001:db8::1:0:0:5</code></pre>
<h3>مثال سخت (برعکس: باز کردن)</h3>
<pre><code>Short  : 2001:db8:a::1:2
Groups written = 5  (2001, db8, a, 1, 2)
Missing groups = 8 - 5 = 3   (the :: is 3 zero groups)
Full   : 2001:0db8:000a:0000:0000:0000:0001:0002</code></pre>

<h2><span class="hn">۴.</span> انواع آدرس IPv6</h2>
<table>
<tr><th>نوع</th><th>Prefix</th><th>کاربرد</th><th>معادل در IPv4</th></tr>
<tr><td><span class="en">Global Unicast</span></td><td>2000::/3</td><td>آدرس قابل Route در اینترنت</td><td>آدرس عمومی</td></tr>
<tr><td><span class="en">Unique Local (ULA)</span></td><td>fc00::/7 (عملاً fd00::/8)</td><td>داخل سازمان</td><td>RFC 1918</td></tr>
<tr><td><span class="en">Link-Local</span></td><td>fe80::/10</td><td>فقط روی یک لینک؛ هر Interface حتماً دارد</td><td>APIPA (ولی همیشه فعال و ضروری)</td></tr>
<tr><td><span class="en">Multicast</span></td><td>ff00::/8</td><td>ارسال به گروهی از دستگاه‌ها</td><td>224.0.0.0/4</td></tr>
<tr><td>Loopback</td><td>::1/128</td><td>خود دستگاه</td><td>127.0.0.1</td></tr>
<tr><td>مستندات</td><td>2001:db8::/32</td><td>در آموزش و Lab</td><td>TEST-NET</td></tr>
</table>
<p><b>نکته‌ی مهم:</b> IPv6 <b>Broadcast ندارد</b>. کارهایی که Broadcast می‌کرد (مثل ARP) با Multicast انجام می‌شود. آدرس‌های ff02::1 (همه‌ی گره‌ها) و ff02::2 (همه‌ی روترها) را بشناسید.</p>

<h2><span class="hn">۵.</span> دستگاه‌ها چطور آدرس می‌گیرند؟</h2>
<h3>۵-۱. Link-Local خودکار</h3>
<p>همین که Interface بالا بیاید، دستگاه خودش یک آدرس <code>fe80::</code> می‌سازد. نیازی به DHCP و تنظیم دستی ندارد. تمام ارتباط‌های همسایگی (و Next-Hop روتینگ) با همین آدرس انجام می‌شود.</p>
<h3>۵-۲. EUI-64: ساخت Interface ID از MAC</h3>
<p>MAC آدرس ۴۸ بیتی است؛ ۶۴ بیت لازم داریم. روش: وسط MAC عدد <code>fffe</code> را بگذار و بیت هفتم بایت اول را وارونه کن. مثال: MAC = <code>aabb.cc00.0100</code>:</p>
<pre><code>MAC:            aa bb cc 00 01 00
Step 1 (insert fffe) : aa bb cc ff fe 00 01 00
Step 2 (flip U/L bit) : first byte aa XOR 02 = a8
Interface ID:   a8bb:ccff:fe00:0100</code></pre>
<p>پس آدرس Link-Local می‌شود <code>fe80::a8bb:ccff:fe00:100</code>. (فقط ایده را بدانید: MAC در آدرس «نشت» می‌کند و برای حریم خصوصی، سیستم‌عامل‌های جدید به‌جای EUI-64 مقدار تصادفی می‌سازند.)</p>
<h3>۵-۳. SLAAC و کشف همسایه (NDP)</h3>
<p>روتر هر چند ثانیه (یا به درخواست) پیام <span class="en">Router Advertisement (RA)</span> می‌فرستد که می‌گوید «Prefix این لینک 2001:db8:10:10::/64 است». Host خودش Interface ID می‌سازد و آدرس می‌شود. به این روش <span class="en">SLAAC</span> می‌گویند: بدون DHCP.</p>
<table>
<tr><th>پیام NDP</th><th>معادل</th><th>کار</th></tr>
<tr><td>Router Solicitation (RS)</td><td>—</td><td>Host: «روتر هست؟»</td></tr>
<tr><td>Router Advertisement (RA)</td><td>DHCP قسمتی</td><td>روتر: Prefix و Gateway را اعلام می‌کند</td></tr>
<tr><td>Neighbor Solicitation (NS)</td><td>ARP Request</td><td>«MAC فلان IPv6 چیست؟» (با Multicast)</td></tr>
<tr><td>Neighbor Advertisement (NA)</td><td>ARP Reply</td><td>پاسخ با MAC</td></tr>
</table>
<p>NDP از <span class="en">ICMPv6</span> استفاده می‌کند؛ بنابراین <b>نباید ICMPv6 را در فایروال کاملاً ببندید</b> وگرنه IPv6 کار نمی‌کند (اشتباه رایج).</p>

<h2><span class="hn">۶.</span> مثال کاربردی: Prefix و Subnet در IPv6</h2>
<p>سازمان بلوک <code>2001:db8:abcd::/48</code> دارد. با ۱۶ بیت باقیمانده تا /64 می‌توانیم ۶۵۵۳۶ Subnet /64 بسازیم. محاسبه‌ی Host ندارد! هر VLAN را یک /64 می‌دهیم: <code>2001:db8:abcd:<b>10</b>::/64</code> برای VLAN10، <code>2001:db8:abcd:<b>20</b>::/64</code> برای VLAN20 و غیره. گروه چهارم را همان شماره‌ی VLAN بگذارید تا خوانا باشد.</p>
<p>مقایسه: در IPv4 باید هر بار محاسبه‌ی VLSM کنیم. در IPv6 همه /64 هستند و زندگی ساده است.</p>

<h2><span class="hn">۷.</span> تمرین‌ها</h2>
<details><summary>۱. (ساده) کوتاه کن: 2001:0db8:0000:0000:0000:0000:0000:0001</summary><p><code>2001:db8::1</code></p></details>
<details><summary>۲. (ساده) این چه نوع آدرسی است: fe80::1 ؟ fd12:3456::5 ؟ ff02::1 ؟ 2001:db8::5 ؟</summary><p>Link-Local؛ ULA؛ Multicast (همه‌ی گره‌ها)؛ مستندات/Global.</p></details>
<details><summary>۳. (متوسط) باز کن: 2001:db8:0:1::5</summary><p><code>2001:0db8:0000:0001:0000:0000:0000:0005</code></p></details>
<details><summary>۴. (متوسط) آیا 2001:db8::1 و 2001:db8:0:0:1::1 در یک /64 هستند؟</summary><pre><code>A = 2001:0db8:0000:0000:0000:0000:0000:0001
B = 2001:0db8:0000:0000:0001:0000:0000:0001
First 64 bits of A = 2001:0db8:0000:0000
First 64 bits of B = 2001:0db8:0000:0000
Equal -> same /64</code></pre></details>
<details><summary>۵. (سخت) چرا نمی‌توان 2001::1::2 نوشت؟</summary><p>دو بار :: ابهام می‌سازد؛ نمی‌دانیم هر کدام چند گروه صفر هستند.</p></details>
<details><summary>۶. (سخت) از 2001:db8:abcd::/48 برای ۴ VLAN (۱۰، ۲۰، ۳۰، ۹۹) Prefix بساز.</summary><p>2001:db8:abcd:10::/64، 2001:db8:abcd:20::/64، 2001:db8:abcd:30::/64، 2001:db8:abcd:99::/64.</p></details>

<h2><span class="hn">۸.</span> Lab هدایت‌شده: IPv6 بین R1 و SW1</h2>
<p>شرط: در Lab <code>L00</code> هنوز VLAN10 روی R1 (<code>Gi0/0.10</code>) و SW1 (<code>Vlan10</code>) سالم است.</p>
<h3>گام ۱: فعال‌کردن IPv6 روی روتر</h3>
<pre><code>R1# configure terminal
R1(config)# ipv6 unicast-routing
R1(config)# interface gi0/0.10
R1(config-subif)# ipv6 address 2001:db8:10:10::1/64
R1(config-subif)# end
R1# show ipv6 interface brief</code></pre>
<p>باید دو آدرس ببینید: Link-Local (<code>FE80::...</code>) و آدرسی که دادید. فرمان <code>ipv6 unicast-routing</code> روتر را از «Host» به «روتر IPv6» تبدیل می‌کند و RA می‌فرستد.</p>
<h3>گام ۲: سمت سوییچ</h3>
<pre><code>SW1# configure terminal
SW1(config)# interface vlan 10
SW1(config-if)# ipv6 address 2001:db8:10:10::2/64
SW1(config-if)# end
SW1# show ipv6 interface brief</code></pre>
<p>در سوییچ‌های L2 ممکن است IPv6 فقط در CLI دیده شود. اگر دستور رد شد یا ping نشد، دقیقاً همان را ثبت کنید؛ این همان درس «پذیرفته‌شدن ≠ کارکردن» است.</p>
<h3>گام ۳: Ping و NDP</h3>
<pre><code>R1# ping 2001:db8:10:10::2
R1# show ipv6 neighbors
R1# ping FE80::&lt;LL-SW1&gt;%GigabitEthernet0/0.10</code></pre>
<p>در Ping با Link-Local باید Interface خروجی را مشخص کنید (چون fe80:: روی هر Interface تکراری است). جدول <code>show ipv6 neighbors</code> معادل <code>show ip arp</code> است.</p>
<h3>گام ۴: دیدن RA</h3>
<pre><code>R1# show ipv6 interface gi0/0.10</code></pre>
<p>در خروجی دنبال خط «ND advertised reachable time» و «Hosts use stateless autoconfig» بگردید؛ یعنی روتر Prefix را برای SLAAC اعلام می‌کند.</p>

<h2><span class="hn">۹.</span> Lab مستقل</h2>
<p>برای VLANهای ۱۰ و ۲۰ و ۳۰ Capstone یک Prefix مثل <code>2001:db8:abcd::/48</code> انتخاب و در <code>02-design/ipv6-plan.md</code> بنویسید. روی R1 هر زیرواسط را یک /64 بدهید و <code>show ipv6 route connected</code> را ثبت کنید.</p>

<h2><span class="hn">۱۰.</span> عیب‌یابی</h2>
<table>
<tr><th>Symptom</th><td>Ping IPv6 جواب نمی‌دهد ولی IPv4 کار می‌کند</td></tr>
<tr><th>سرنخ‌ها</th><td>۱) <code>ipv6 unicast-routing</code> فعال است؟<br>۲) Prefix دو طرف یکی است؟<br>۳) ACL یا فایروال ICMPv6 را بسته؟<br>۴) فقط Link-Local کار می‌کند؟</td></tr>
<tr><th>رفع</th><td>تصحیح Prefix یا اجازه‌ی ICMPv6</td></tr>
</table>

<h2><span class="hn">۱۱.</span> سؤال‌های مرور</h2>
<details><summary>چرا IPv6 Broadcast ندارد؟</summary><p>با Multicast جایگزین شده تا فقط دستگاه‌های مربوطه پردازش کنند.</p></details>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> کار حرفه‌ای با خط فرمان سیسکو (<span class="en">CLI</span>): حالت‌ها، کمک‌گیری، تفاوت پیکربندی در حال اجرا و ذخیره‌شده، و مهم‌تر از همه <b>پشتیبان‌گیری و بازگشت (Rollback)</b>.</p>
<p><b>چرا لازم است:</b> در دنیای واقعی بزرگ‌ترین ترس هر مدیر شبکه این است: «یک دستور زدم و ارتباط همه قطع شد، حالا چه کنم؟». کسی که بکاپ و Rollback بلد است، با آرامش کار می‌کند؛ کسی که بلد نیست، ساعت‌ها در قطعی می‌ماند.</p>
<ul>
<li><b>در کار روزانه:</b> قبل از هر تغییر، نسخه‌ی فعلی را ذخیره می‌کنید و بعد از تغییر اگر خراب شد، در چند ثانیه برمی‌گردید.</li>
<li><b>در امنیت:</b> پیکربندی بکاپ‌شده سند حسابرسی است؛ می‌توانید ثابت کنید «چه چیزی، کی تغییر کرد».</li>
<li><b>در دوره:</b> Capstone مرحله‌ی «CHG (درخواست تغییر)» دارد که بدون Rollback پذیرفته نمی‌شود.</li>
</ul>

<h2><span class="hn">۱.</span> حالت‌های CLI (چهار اتاق یک ساختمان)</h2>
<p>CLI سیسکو مثل ساختمانی با چند اتاق است که هرکدام اجازه‌ی کار متفاوتی دارد:</p>
<table>
<tr><th>حالت</th><th>Prompt</th><th>چه کاری می‌شود کرد</th><th>ورود/خروج</th></tr>
<tr><td>User EXEC</td><td><code>R1&gt;</code></td><td>مشاهده‌ی محدود، ping</td><td>ورود: <code>enable</code></td></tr>
<tr><td>Privileged EXEC</td><td><code>R1#</code></td><td>همه‌ی show، کپی فایل، reload</td><td>خروج: <code>disable</code></td></tr>
<tr><td>Global Config</td><td><code>R1(config)#</code></td><td>تغییر تنظیمات کل دستگاه</td><td>ورود: <code>configure terminal</code> ؛ خروج: <code>end</code> یا <code>exit</code></td></tr>
<tr><td>Interface/Line Config</td><td><code>R1(config-if)#</code></td><td>تنظیم یک Interface یا Line</td><td>ورود: <code>interface ...</code></td></tr>
</table>
<div class="box"><b class="t">قاعده‌ی طلایی</b>دستورهای <code>show</code>، <code>ping</code>، <code>copy</code>، <code>monitor capture</code> و <code>reload</code> در EXEC هستند. دستورهای تنظیمی در Config. اگر در Config دستور show بزنید، با <code>do</code> جلو آن می‌توانید اجرا کنید: <code>do show ip route</code>.</div>

<h2><span class="hn">۲.</span> کمک‌گیری و میان‌بُرها (سرعت یک مهندس)</h2>
<ul>
<li><code>?</code> بعد از هر کلمه: گزینه‌های ممکن. مثال: <code>show ip ?</code></li>
<li><code>Tab</code>: کامل‌کردن. <code>sh run</code> هم کافی است (مخفف یکتا).</li>
<li><code>show running-config | section interface</code>: فیلتر خروجی. <code>| include</code> و <code>| begin</code> هم داریم.</li>
<li>فلش بالا: دستور قبلی. <code>Ctrl+A</code> ابتدای خط و <code>Ctrl+E</code> انتهای خط. <code>Ctrl+Shift+6</code> قطع دستور گیرکرده.</li>
</ul>
<p>مثال: به‌جای خواندن ۲۰۰ خط config فقط این را بزنید:</p>
<pre><code>R1# show running-config | section interface Gi0/0
R1# show ip interface brief | include up</code></pre>

<h2><span class="hn">۳.</span> تنظیمات پایه‌ی یک دستگاه حرفه‌ای</h2>
<pre><code>R1(config)# hostname R1
R1(config)# no ip domain-lookup
R1(config)# service timestamps log datetime msec
R1(config)# line console 0
R1(config-line)# logging synchronous
R1(config-line)# exec-timeout 10 0
R1(config-line)# exit
R1(config)# banner motd # Authorized access only #
R1(config)# enable secret &lt;PASSWORD&gt;
R1(config)# end</code></pre>
<p>خط‌به‌خط:</p>
<ul>
<li><code>no ip domain-lookup</code>: جلوی «Translating…» را می‌گیرد (اشتباهی که قبلاً دیدید).</li>
<li><code>logging synchronous</code>: پیام‌های Log وسط تایپ شما نمی‌پرند.</li>
<li><code>exec-timeout 10 0</code>: بعد از ۱۰ دقیقه بی‌کاری Session بسته می‌شود (امنیت).</li>
<li><code>enable secret</code>: رمز ورود به Privileged با Hash قوی. <b>هرگز</b> <code>enable password</code> (متن ساده) نه. رمز واقعی را در Git نگذارید؛ اینجا فقط جانگهدار است.</li>
</ul>

<h2><span class="hn">۴.</span> Running-config و Startup-config</h2>
<p>دو نسخه از تنظیمات در دستگاه هست:</p>
<ul>
<li><b>running-config</b>: در RAM، همین الان فعال است؛ با خاموش‌شدن می‌پرد.</li>
<li><b>startup-config</b>: در NVRAM، در بوت بعدی بارگذاری می‌شود.</li>
</ul>
<p>تشبیه: running مثل «متنی که در Word تایپ کرده‌اید و ذخیره نکرده‌اید»؛ startup همان فایل ذخیره‌شده است.</p>
<pre><code>R1# show running-config
R1# show startup-config
R1# copy running-config startup-config      (or: write memory)
R1# show archive                              (if supported)</code></pre>
<p>اشتباه رایج: بعد از تغییر ذخیره نمی‌کنید و بعد از Reload همه‌چیز می‌پرد. جلوگیری: عادت کنید هر تغییر موفق ← <code>copy run start</code>.</p>

<h2><span class="hn">۵.</span> بکاپ و Rollback (قلب درس)</h2>
<h3>۵-۱. بکاپ محلی روی Flash</h3>
<pre><code>R1# copy running-config flash:R1-before-change.cfg
R1# dir flash:</code></pre>
<h3>۵-۲. بکاپ روی سرور (TFTP/SCP)</h3>
<pre><code>R1# copy running-config tftp://10.10.10.50/R1-2026-11-07.cfg</code></pre>
<p>برای سرور بکاپ از یک VM لینوکسی استفاده می‌کنیم (در درس‌های بعد، با SCP امن). نام فایل = نام دستگاه + تاریخ. فایل‌های بکاپ <b>رمزِ هش‌شده</b> دارند ولی باز هم در جای امن (خارج از Git) نگه‌دارید.</p>
<h3>۵-۳. Rollback با Configure Replace</h3>
<p>اگر Image شما قابلیت Archive دارد، می‌توانید کل تنظیمات را با یک فایل بکاپ جایگزین کنید (فقط تفاوت‌ها اعمال می‌شود):</p>
<pre><code>R1# configure replace flash:R1-before-change.cfg list
R1# configure replace flash:R1-before-change.cfg force</code></pre>
<p>گزینه‌ی <code>list</code> فقط تفاوت‌ها را نشان می‌دهد (Dry-run). اگر دستور در Image شما نبود، روش جایگزین: <code>copy flash:R1-before-change.cfg startup-config</code> و سپس <code>reload</code>.</p>
<h3>۵-۴. «Reload in»: شبکه‌ی ایمنی</h3>
<pre><code>R1# reload in 10
... risky change ...
R1# reload cancel        (if it worked)</code></pre>
<p>مثل ماشین‌هایی که ده دقیقه بعد خودشان خاموش می‌شوند. اگر تغییر ارتباط شما را قطع کرد، دستگاه بعد از ۱۰ دقیقه به startup-config قبلی بر می‌گردد. این تکنیک نجات‌بخش است؛ مخصوصاً در تغییرات راه دور.</p>

<h2><span class="hn">۶.</span> مثال‌ها (ساده تا سخت)</h2>
<details open><summary>ساده</summary><p>اسم دستگاه را عوض کنید و ذخیره کنید: <code>hostname R1-HQ</code> ← <code>end</code> ← <code>copy run start</code> ← <code>show startup-config | include hostname</code>.</p></details>
<details open><summary>متوسط</summary><p>قبل از تغییر IP یک Interface، بکاپ به Flash بگیرید؛ آدرس را تغییر دهید؛ ping کنید؛ اگر قطع شد با <code>configure replace</code> برگردید.</p></details>
<details open><summary>سخت</summary><p>تغییر راه دور: با <code>reload in 5</code> شبکه‌ی ایمنی بگذارید؛ Mask یک Subinterface را تغییر دهید؛ اگر ارتباط قطع شد، ۵ دقیقه صبر می‌کنید و دستگاه با startup قبلی بالا می‌آید؛ اگر موفق بود <code>reload cancel</code> و <code>copy run start</code>.</p></details>

<h2><span class="hn">۷.</span> تمرین‌ها</h2>
<details><summary>۱. Prompt زیر در کدام حالت است؟ R1(config-if)#</summary><p>Interface Config (زیرمجموعه‌ی Global Config).</p></details>
<details><summary>۲. تفاوت running و startup چیست؟</summary><p>running در RAM و فعال؛ startup در NVRAM و برای بوت بعدی.</p></details>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> مدیریت امن دستگاه‌ها از راه دور با <span class="en">SSH</span>، جایگزین قدیمی و ناامن <span class="en">Telnet</span>. یاد می‌گیریم SSH چطور کار می‌کند، چطور روی روتر و سوییچ فعالش کنیم و چطور دسترسی را فقط به سیستم‌های مجاز محدود کنیم.</p>
<p><b>چرا لازم است:</b> Telnet همه‌چیز (از جمله رمز) را به‌صورت متن ساده می‌فرستد. هر کسی در مسیر با Wireshark می‌تواند رمز ادمین را بخواند. SSH همین ارتباط را رمزگذاری می‌کند. در هر ممیزی امنیتی، فعال‌بودن Telnet یک «یافته‌ی جدی» است.</p>
<ul>
<li><b>در کار روزانه:</b> ۹۹٪ مدیریت از راه دور با SSH انجام می‌شود.</li>
<li><b>در امنیت:</b> رمزگذاری، احراز هویت با کاربر و محدودیت مبدأ، سه لایه‌ی اولیه‌ی ایمنی مدیریت هستند.</li>
<li><b>در FortiGate:</b> همین مفاهیم برای مدیریت فایروال (فقط HTTPS و SSH از Subnet مدیریت) به‌کار می‌رود.</li>
</ul>
<div class="box"><b class="t">مسیر درس</b>چرا Telnet ناامن است ← SSH چطور کار می‌کند ← پیکربندی گام‌به‌گام ← محدودکردن دسترسی ← مثال ساده/متوسط/سخت ← Lab ← عیب‌یابی.</div>

<h2><span class="hn">۱.</span> Telnet در برابر SSH</h2>
<table>
<tr><th>ویژگی</th><th>Telnet</th><th>SSH</th></tr>
<tr><td>رمزگذاری</td><td>ندارد (متن ساده)</td><td>دارد</td></tr>
<tr><td>پورت</td><td>TCP 23</td><td>TCP 22</td></tr>
<tr><td>احراز هویت دستگاه</td><td>ندارد</td><td>دارد (Host Key)</td></tr>
<tr><td>استفاده‌ی امروزی</td><td>ممنوع</td><td>استاندارد</td></tr>
</table>
<p>مثال ملموس: Telnet مثل فریاد زدن رمز کارت بانکی وسط بازار است؛ SSH مثل گفتن آن در یک اتاق قفل‌شده.</p>

<h2><span class="hn">۲.</span> SSH چطور کار می‌کند؟ (ساده)</h2>
<figure class="fig"><svg viewBox="0 0 720 260" role="img" aria-label="SSH handshake"><rect x="80" y="14" width="120" height="36" rx="8" class="bx"/><text x="140" y="37" text-anchor="middle">Client</text><path d="M140 50 V250" class="ln" stroke-dasharray="4 4"/><rect x="560" y="14" width="120" height="36" rx="8" class="bx"/><text x="620" y="37" text-anchor="middle">Server (SW1)</text><path d="M620 50 V250" class="ln" stroke-dasharray="4 4"/><path d="M140 80 H620" class="rq"/><path d="M612 75 l8 5 l-8 5" class="rq"/><text x="380" y="72" text-anchor="middle">1  TCP 22 connect</text><path d="M620 120 H140" class="rp"/><path d="M148 115 l-8 5 l8 5" class="rp"/><text x="380" y="112" text-anchor="middle">2  Host Key + Fingerprint</text><path d="M140 160 H620" class="rq"/><path d="M612 155 l8 5 l-8 5" class="rq"/><text x="380" y="152" text-anchor="middle">3  Key exchange → session key</text><path d="M140 200 H620" class="rq"/><path d="M612 195 l8 5 l-8 5" class="rq"/><text x="380" y="192" text-anchor="middle">4  Login (user + password/key)</text><path d="M620 240 H140" class="rp"/><path d="M148 235 l-8 5 l8 5" class="rp"/><text x="380" y="232" text-anchor="middle">5  Encrypted session</text></svg><figcaption>شکل ۵: مراحل برقراری SSH؛ مرحله ۲ همان جایی است که «Host key changed» نشان می‌دهد.</figcaption></figure>

<ol>
<li><b>اتصال:</b> Client به پورت ۲۲ سرور وصل می‌شود.</li>
<li><b>هویت سرور:</b> سرور <span class="en">Host Key</span> خود را نشان می‌دهد. Client اولین بار از شما می‌پرسد «اعتماد دارید؟» و اثرانگشت (Fingerprint) را ذخیره می‌کند. دفعه‌های بعد اگر عوض شد، هشدار می‌دهد (احتمال حمله‌ی Man-in-the-Middle).</li>
<li><b>کلید جلسه:</b> دو طرف با یک الگوریتم تبادل کلید (مثل Diffie-Hellman) یک کلید مشترک می‌سازند که هیچ‌کس در مسیر نمی‌داند.</li>
<li><b>احراز هویت کاربر:</b> رمز یا کلید عمومی.</li>
<li><b>ارتباط رمزشده</b> شروع می‌شود.</li>
</ol>
<div class="box"><b class="t">یادآوری از هفته ۱</b>هشدار «Host key changed» در برنامه‌ی SSH را قبلاً دیدید. آن‌جا هویت را با <code>ssh-keyscan</code> از یک مسیر مستقل تأیید کردیم. این دقیقاً همین مکانیزم است.</div>

<h2><span class="hn">۳.</span> پیکربندی SSH روی روتر/سوییچ (گام‌به‌گام)</h2>
<pre><code>R1(config)# hostname R1
R1(config)# ip domain-name lab.local
R1(config)# crypto key generate rsa modulus 2048
R1(config)# ip ssh version 2
R1(config)# username admin privilege 15 secret &lt;PASSWORD&gt;
R1(config)# line vty 0 4
R1(config-line)# login local
R1(config-line)# transport input ssh
R1(config-line)# exec-timeout 10 0
R1(config-line)# end</code></pre>
<p>چرا هرکدام؟</p>
<ul>
<li><code>hostname</code> و <code>ip domain-name</code>: بدون این دو، کلید RSA ساخته نمی‌شود (خطای رایج: «Please define a hostname other than Router»).</li>
<li><code>crypto key generate rsa modulus 2048</code>: ساخت جفت‌کلید. ۱۰۲۴ ضعیف است؛ حداقل ۲۰۴۸.</li>
<li><code>ip ssh version 2</code>: نسخه‌ی ۱ آسیب‌پذیر است.</li>
<li><code>username ... secret</code>: کاربر محلی با Hash. رمز واقعی را در Git نگذارید.</li>
<li><code>login local</code>: ورود با نام‌کاربری و رمز (نه فقط رمز Line).</li>
<li><code>transport input ssh</code>: Telnet را می‌بندد.</li>
</ul>
<p>بررسی:</p>
<pre><code>R1# show ip ssh
R1# show ssh
R1# show crypto key mypubkey rsa</code></pre>
<p>در <code>show ip ssh</code> باید «SSH Enabled - version 2.0» ببینید.</p>

<h2><span class="hn">۴.</span> محدودکردن دسترسی (امنیت لایه‌ای)</h2>
<p>فقط Subnet مدیریت (VLAN10) اجازه‌ی SSH داشته باشد:</p>
<pre><code>R1(config)# ip access-list standard MGMT-ONLY
R1(config-std-nacl)# permit 10.10.10.0 0.0.0.255
R1(config-std-nacl)# deny any log
R1(config-std-nacl)# exit
R1(config)# line vty 0 4
R1(config-line)# access-class MGMT-ONLY in
R1(config-line)# end</code></pre>
<p><code>0.0.0.255</code> یک <span class="en">Wildcard Mask</span> است؛ یعنی معکوسِ Subnet Mask. بیت 0 یعنی «باید مطابقت داشته باشد» و بیت 1 یعنی «مهم نیست».</p>
<pre><code>Subnet mask   : 255.255.255.0
Wildcard mask : 0.0.0.255     (= 255.255.255.255 - 255.255.255.0)</code></pre>
<p><code>access-class</code> فقط ترافیک ورودی به VTY (دسترسی مدیریتی) را فیلتر می‌کند، نه ترافیک عبوری.</p>
<p>تنظیمات تکمیلی مفید: <code>ip ssh time-out 60</code> و <code>ip ssh authentication-retries 3</code>.</p>
<div class="box"><b class="t">هشدار: قفل‌شدن از دستگاه</b>قبل از <code>access-class</code>، مطمئن شوید آدرس خودتان در ACL مجاز است؛ وگرنه خودتان بیرون می‌مانید. از <code>reload in 5</code> (درس قبل) به‌عنوان شبکه‌ی ایمنی استفاده کنید.</div>

<h2><span class="hn">۱.</span> فریم، بسته و لایه‌ها (ساده)</h2>
<p>مثل نامه‌ای که داخل پاکت و آن داخل یک بسته‌ی پستی است. داده را لایه‌به‌لایه می‌پیچند:</p>
<pre><code>[ Ethernet: dst MAC | src MAC ]   Layer 2 (frame)
   [ IP: src IP | dst IP ]          Layer 3 (packet)
      [ ICMP or TCP/UDP ]           Layer 4 and above
         [ data ]</code></pre>
<p>سوییچ با <b>MAC</b> تصمیم می‌گیرد (فریم)، روتر با <b>IP</b> (بسته). این تفاوت را همیشه به یاد داشته باشید.</p>

<h2><span class="hn">۲.</span> ARP: «این IP مال کیست؟»</h2>
<figure class="fig"><svg viewBox="0 0 720 230" role="img" aria-label="ARP flow"><rect x="60" y="20" width="120" height="44" rx="8" class="bx"/><text x="120" y="40" text-anchor="middle">Host A</text><text x="120" y="56" text-anchor="middle" class="cap">10.10.10.1</text><path d="M120 64 V215" class="ln" stroke-dasharray="4 4"/><rect x="330" y="20" width="120" height="44" rx="8" class="bx"/><text x="390" y="40" text-anchor="middle">Switch</text><text x="390" y="56" text-anchor="middle" class="cap"></text><path d="M390 64 V215" class="ln" stroke-dasharray="4 4"/><rect x="600" y="20" width="120" height="44" rx="8" class="bx"/><text x="660" y="40" text-anchor="middle">Host B</text><text x="660" y="56" text-anchor="middle" class="cap">10.10.10.2</text><path d="M660 64 V215" class="ln" stroke-dasharray="4 4"/><path d="M120 100 H660" class="rq"/><path d="M652 94 l8 6 l-8 6" class="rq"/><text x="390" y="92" text-anchor="middle">① ARP Request (Broadcast ff:ff:ff:ff:ff:ff): who has 10.10.10.2 ?</text><path d="M660 160 H120" class="rp"/><path d="M128 154 l-8 6 l8 6" class="rp"/><text x="390" y="152" text-anchor="middle">② ARP Reply (Unicast): 10.10.10.2 is at MAC-B</text><text x="390" y="200" text-anchor="middle">③ ICMP Echo Request / Reply  (ping)</text></svg><figcaption>شکل ۴: ping اول چرا کندتر است؟ چون اول ARP انجام می‌شود.</figcaption></figure>

<p>Host فقط IP مقصد را می‌داند ولی فریم به MAC نیاز دارد. ARP این نگاشت را پیدا می‌کند:</p>
<ol>
<li><b>ARP Request</b> (Broadcast به <code>ff:ff:ff:ff:ff:ff</code>): «چه کسی 10.10.10.2 را دارد؟ به 10.10.10.1 بگو.»</li>
<li>همه‌ی دستگاه‌های VLAN دریافت می‌کنند؛ فقط صاحب IP جواب می‌دهد.</li>
<li><b>ARP Reply</b> (Unicast): «10.10.10.2 در MAC فلان است.»</li>
<li>جواب در <span class="en">ARP Cache</span> ذخیره می‌شود (چند دقیقه).</li>
</ol>
<p>به همین دلیل اولین ping همیشه کندتر است یا گاهی یک بسته از دست می‌رود (<code>.!!!!</code>): اول باید ARP انجام شود.</p>
<p>مشاهده روی روتر: <code>show ip arp</code></p>

<h2><span class="hn">۳.</span> ICMP: ابزار تشخیص</h2>
<table>
<tr><th>Type</th><th>معنی</th><th>کجا می‌بینیم</th></tr>
<tr><td>8</td><td>Echo Request</td><td>ping رفت</td></tr>
<tr><td>0</td><td>Echo Reply</td><td>ping برگشت</td></tr>
<tr><td>3</td><td>Destination Unreachable</td><td>مسیر/پورت وجود ندارد (<code>U</code> در ping سیسکو)</td></tr>
<tr><td>11</td><td>Time Exceeded</td><td>TTL تمام شد (traceroute)</td></tr>
</table>
<p><b>TTL:</b> هر روتر آن را ۱ کم می‌کند؛ اگر صفر شد بسته دور ریخته می‌شود تا در حلقه نماند. Windows معمولاً ۱۲۸ و لینوکس ۶۴ می‌فرستد؛ از روی TTL دریافتی می‌توان حدس زد بسته چند روتر رد شده.</p>

<h2><span class="hn">۴.</span> گرفتن Capture در PNetLab</h2>
<ul>

<li>جایگزین روی خود IOS (در حالت EXEC، نه Config):</li>
</ul>
<pre><code>R1# monitor capture CAP1 interface gi0/0 both

R1# monitor capture CAP1 stop

<p>اگر دستور روی Image شما فقط «پذیرفته می‌شود ولی بسته‌ای نمی‌گیرد» (در Probe هفته ۱ دیدیم)، از Capture لینک PNetLab استفاده کنید. باز هم: پذیرفته‌شدن ≠ کارکردن.</p>

<h2><span class="hn">۵.</span> فیلترهای Wireshark (مهم‌ترین مهارت)</h2>
<table>
<tr><th>فیلتر</th><th>معنی</th></tr>
<tr><td><code>arp</code></td><td>فقط ARP</td></tr>
<tr><td><code>icmp</code></td><td>فقط ping</td></tr>
<tr><td><code>ip.addr == 10.10.10.2</code></td><td>هر بسته‌ی مربوط به این IP</td></tr>
<tr><td><code>eth.addr == aa:bb:cc:00:01:00</code></td><td>بر اساس MAC</td></tr>
<tr><td><code>icmp.type == 8</code></td><td>فقط Echo Request</td></tr>
<tr><td><code>arp or icmp</code></td><td>ترکیب با or/and</td></tr>
<tr><td><code>!arp</code></td><td>همه به‌جز ARP</td></tr>
</table>
<div class="box"><b class="t">دو نوع فیلتر</b><b>Capture Filter</b> (قبل از شروع، سبک‌تر، سینتکس BPF مثل <code>host 10.10.10.2</code>) و <b>Display Filter</b> (بعد از گرفتن، قدرتمندتر؛ جدول بالا).</div>

<h2><span class="hn">۶.</span> مثال‌ها</h2>
<details open><summary>ساده: ping اول</summary><p>Capture را شروع کنید، <code>clear arp</code> بزنید، <code>ping 10.10.10.2</code>. با فیلتر <code>arp or icmp</code> ببینید: اول ARP Request (Broadcast) و ARP Reply، بعد ۵ جفت Echo Request/Reply.</p></details>
<details open><summary>متوسط: ping بیرون از Subnet</summary><p>از R1 به آدرسی در Subnet دیگر بزنید و ببینید MAC مقصد فریم، MAC Gateway است، نه MAC مقصد نهایی (ولی IP مقصد همان مقصد نهایی است). این مهم‌ترین نکته‌ی روتینگ است.</p></details>
<details open><summary>سخت: عیب‌یابی با Capture</summary><p>Mask یک طرف را عمداً اشتباه کنید (درس ۲-۱) و Capture بگیرید: خواهید دید ARP Requestهای بدون جواب یا Echo Requestهای بدون Reply. یعنی مشکل در لایه ۲/۳ همان‌جاست و نه در برنامه.</p></details>

<h2>این درس درباره چیست و چرا باید یاد بگیریم؟</h2>
<p><b>چه چیزی یاد می‌گیریم:</b> سوییچ چطور تصمیم می‌گیرد فریم را از کدام پورت بفرستد؛ یعنی جدول <span class="en">MAC Address Table</span> (که به آن <span class="en">CAM Table</span> هم می‌گویند)، و چهار رفتار اصلی سوییچ: یاد‌گرفتن، پخش‌کردن، ارسال هدفمند و پاک‌کردن.</p>
<p><b>چرا لازم است:</b> تمام ایده‌ی VLAN، Trunk و STP که در دو هفته‌ی آینده می‌خوانید، روی همین جدول بنا شده است. کسی که نداند سوییچ چطور فکر می‌کند، مشکلاتی مثل «ترافیک روی پورت‌های بی‌ربط دیده می‌شود» یا «MAC بین دو پورت پرش می‌کند» را نمی‌فهمد.</p>
<ul>
<li><b>در کار روزانه:</b> پیدا کردن اینکه یک کامپیوتر به کدام پورت وصل است (<code>show mac address-table</code>) روزانه‌ترین کار یک ادمین شبکه است.</li>
<li><b>در امنیت:</b> حمله‌های <span class="en">MAC Flooding</span> و <span class="en">MAC Spoofing</span> همین جدول را هدف می‌گیرند؛ فهمیدنش پایه‌ی Port Security (هفته ۴) است.</li>
<li><b>در عیب‌یابی:</b> «Unknown Unicast Flooding» یکی از دلایل کندی شبکه است و فقط با فهم CAM قابل تشخیص است.</li>
</ul>

<h2><span class="hn">۱.</span> هاب در برابر سوییچ (یک مثال روزمره)</h2>
<p>فرض کنید در یک سالن، یک نفر می‌خواهد با شخصی در آن صحبت کند. <b>هاب (Hub)</b> مثل داد زدن وسط سالن است: همه می‌شنوند، حتی کسانی که ربطی ندارند. <b>سوییچ (Switch)</b> مثل منشی‌ای است که اول یاد می‌گیرد هر شخص کجا نشسته و بعد پیام را فقط به همان میز می‌برد.</p>
<p>هاب‌ها امروز منسوخ‌اند. سوییچ این کار را با یک جدول انجام می‌دهد: «هر MAC پشت کدام پورت است؟»</p>

<h2><span class="hn">۲.</span> چهار رفتار سوییچ</h2>
<figure class="fig"><svg viewBox="0 0 720 250" role="img" aria-label="switch MAC learning"><rect x="290" y="20" width="140" height="60" rx="8" class="bx"/><text x="360" y="50" text-anchor="middle">Switch</text><text x="360" y="66" text-anchor="middle" class="cap">MAC table</text><rect x="30" y="170" width="140" height="56" rx="8" class="bx"/><text x="100" y="198" text-anchor="middle">PC-A</text><text x="100" y="214" text-anchor="middle" class="cap">MAC-A</text><path d="M100 170 L320 80" class="ln"/><text x="125" y="132" text-anchor="middle" class="cap">Gi0/1</text><rect x="290" y="170" width="140" height="56" rx="8" class="bx"/><text x="360" y="198" text-anchor="middle">PC-B</text><text x="360" y="214" text-anchor="middle" class="cap">MAC-B</text><path d="M360 170 L360 80" class="ln"/><text x="360" y="132" text-anchor="middle" class="cap">Gi0/2</text><rect x="550" y="170" width="140" height="56" rx="8" class="bx"/><text x="620" y="198" text-anchor="middle">PC-C</text><text x="620" y="214" text-anchor="middle" class="cap">MAC-C</text><path d="M620 170 L400 80" class="ln"/><text x="595" y="132" text-anchor="middle" class="cap">Gi0/3</text><path d="M100 170 L330 80" class="rq"/><text x="150" y="118" class="cap">frame A to B</text></svg><figcaption>شکل ۱: سوییچ و سه کامپیوتر؛ هر کامپیوتر به یک پورت وصل است.</figcaption></figure>
<ol>
<li><b>Learning (یادگیری):</b> هر فریمی که وارد می‌شود، سوییچ به MAC مبدأ آن نگاه می‌کند و در جدول می‌نویسد «این MAC پشت این پورت است».</li>
<li><b>Flooding (پخش):</b> اگر MAC مقصد در جدول نبود (یا Broadcast بود)، فریم از همه‌ی پورت‌ها به‌جز پورت ورودی فرستاده می‌شود.</li>
<li><b>Forwarding (ارسال هدفمند):</b> اگر MAC مقصد در جدول بود، فریم فقط از همان پورت می‌رود.</li>
<li><b>Aging (فراموشی):</b> ردیفی که ۳۰۰ ثانیه فریم جدیدی از آن نیامد، پاک می‌شود تا جدول پر و کهنه نشود.</li>
</ol>
<div class="box"><b class="t">یک قاعده‌ی مهم</b>سوییچ فقط MAC <b>مبدأ</b> را یاد می‌گیرد، هرگز MAC مقصد را. و Broadcast هیچ‌وقت مبدأ نیست؛ پس هرگز در جدول نمی‌آید.</div>

<h2><span class="hn">۳.</span> مثال ساده: اولین ارتباط A با B</h2>
<p>جدول سوییچ در ابتدا خالی است. A (پورت Gi0/1) به B (پورت Gi0/2) فریم می‌فرستد:</p>
<pre><code>Step 1: frame arrives on Gi0/1, src = MAC-A, dst = MAC-B
Step 2: learn  -> table: MAC-A = Gi0/1
Step 3: MAC-B is unknown -> FLOOD to Gi0/2 and Gi0/3
Step 4: B answers: src = MAC-B, dst = MAC-A  (arrives on Gi0/2)
Step 5: learn  -> table: MAC-B = Gi0/2
Step 6: MAC-A is known -> FORWARD only to Gi0/1</code></pre>
<p>نتیجه: PC-C فقط فریم اول را می‌بیند. از پیام دوم به بعد، ارتباط A و B خصوصی می‌شود.</p>

<h2><span class="hn">۴.</span> مثال متوسط: ARP و Broadcast</h2>
<p>در عمل، قبل از ping باید ARP انجام شود (درس ۲-۶). ARP Request یک Broadcast است:</p>
<pre><code>ARP Request : dst = ff:ff:ff:ff:ff:ff  -> always flooded to all ports
ARP Reply   : dst = MAC-A (unicast)     -> forwarded only to Gi0/1
Then ping   : unicast both directions   -> no flooding anymore</code></pre>
<p>یعنی هر ارتباط تازه با یک موج Flooding شروع می‌شود و بعد آرام می‌گیرد.</p>

<h2><span class="hn">۵.</span> مثال سخت: چند MAC پشت یک پورت و پرش MAC</h2>
<p>سناریو ۱: پورت Gi0/3 به یک سوییچ دیگر وصل است. پشت آن ۲۰ کامپیوتر هست. نتیجه:</p>
<pre><code>show mac address-table dynamic
  VLAN  Mac Address       Type     Ports
  1     aaaa.0000.0001    DYNAMIC  Gi0/3
  1     aaaa.0000.0002    DYNAMIC  Gi0/3
  ... 20 MACs on the same port (normal on an uplink)</code></pre>
<p>سناریو ۲ (خطرناک): اگر یک MAC یک ثانیه از پورت Gi0/1 و ثانیه‌ی بعد از Gi0/2 بیاید، سوییچ پیام <code>%SW_MATM-4-MACFLAP_NOTIF</code> می‌دهد. این تقریباً همیشه نشانه‌ی <b>Loop</b> (حلقه) در شبکه است. در هفته ۴ (STP) می‌فهمید چرا و چطور جلویش را بگیریم.</p>

<h2><span class="hn">۶.</span> دستورهای کلیدی (خط‌به‌خط)</h2>
<pre><code>SW1# show mac address-table
SW1# show mac address-table dynamic
SW1# show mac address-table address aaaa.0000.0001
SW1# show mac address-table interface gi0/1
SW1# show mac address-table aging-time
SW1# clear mac address-table dynamic</code></pre>
<ul>
<li><code>dynamic</code>: فقط ردیف‌هایی که سوییچ خودش یاد گرفته (در برابر <code>static</code> که دستی نوشته می‌شود).</li>
<li><code>address</code> و <code>interface</code>: جستجو برای یک MAC یا یک پورت، مثل «پیدا کردن کامپیوتر گم‌شده».</li>
<li><code>clear ... dynamic</code>: جدول را پاک می‌کند (در Lab برای دیدن دوباره‌ی یادگیری). در شبکه‌ی واقعی با احتیاط، چون Flooding موقت ایجاد می‌کند.</li>
</ul>
