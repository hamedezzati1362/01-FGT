<h2><span class="hn">۲.</span> شرط Up شدن SVI (مهم‌ترین نکته)</h2>
<p>SVI فقط وقتی <code>up/up</code> می‌شود که همه‌ی شرط‌های زیر برقرار باشند:</p>
<ol>
<li>VLAN روی سوییچ ساخته شده باشد (<code>show vlan brief</code>).</li>
<li>حداقل یک پورت در آن VLAN فعال باشد (Access Port بالا، یا Trunk که VLAN را عبور می‌دهد).</li>
<li>SVI با <code>no shutdown</code> روشن شده باشد.</li>
</ol>
<div class="box"><b class="t">TS09: SVI Down/Down</b>اگر VLAN 30 هیچ پورت فعالی ندارد، <code>Vlan30</code> در حالت down/down می‌ماند و Gateway آن VLAN کار نمی‌کند، حتی اگر آدرس درست باشد. اول پورت را بالا بیاورید.</div>

<h2><span class="hn">۳.</span> مقایسه‌ی RoAS و SVI</h2>
<table>
<tr><th>معیار</th><th>Router-on-a-Stick</th><th>SVI (L3 Switch)</th></tr>
<tr><td>محل Gateway</td><td>روتر بیرونی</td><td>خود سوییچ</td></tr>
<tr><td>تعداد کابل</td><td>یک Trunk</td><td>بدون کابل اضافه</td></tr>
<tr><td>سرعت</td><td>محدود به لینک و CPU روتر</td><td>سخت‌افزاری، سریع</td></tr>
<tr><td>گلوگاه</td><td>دارد (یک لینک)</td><td>ندارد</td></tr>
<tr><td>مناسب برای</td><td>شعبه‌ی کوچک</td><td>هسته‌ی سازمان</td></tr>
</table>

<h2><span class="hn">۴.</span> دستورها (خط‌به‌خط)</h2>
<pre><code>SW1(config)# ip routing
SW1(config)# interface vlan 20
SW1(config-if)# ip address 10.10.20.1 255.255.255.0
SW1(config-if)# no shutdown
SW1(config-if)# interface vlan 30
SW1(config-if)# ip address 10.10.30.1 255.255.255.0
SW1(config-if)# no shutdown
SW1(config-if)# end
SW1# show ip interface brief
SW1# show ip route connected</code></pre>
<ul>
<li><code>ip routing</code>: سوییچ را از «فقط لایه ۲» به «مسیریاب» تبدیل می‌کند. بدون آن SVI آدرس دارد ولی بین VLANها Route نمی‌کند.</li>
<li><code>interface vlan 20</code>: SVI همان VLAN را می‌سازد (VLAN باید از قبل موجود باشد).</li>
<li><code>no shutdown</code>: SVI به‌طور پیش‌فرض خاموش است در بعضی نسخه‌ها؛ حتماً بزنید.</li>
</ul>

<h2><span class="hn">۵.</span> مثال ساده: ping به SVI</h2>
<pre><code>PC1&gt; ping 10.10.20.1    -> success (SVI Vlan20)</code></pre>
<h2><span class="hn">۶.</span> مثال متوسط: ping بین VLAN</h2>
<pre><code>PC1&gt; ping 10.10.30.11   -> success (routed inside SW1)
SW1# show ip route connected  -> 10.10.20.0/24 via Vlan20, 10.10.30.0/24 via Vlan30</code></pre>
<h2><span class="hn">۷.</span> مثال سخت: TS09 و دو Gateway همزمان</h2>
<pre><code>Symptom   : Vlan30 shows down/down
Check     : show vlan brief          -> VLAN 30 has no active port
            show ip interface brief  -> Vlan30 down/down
Fix       : bring up Gi0/3 (the server port) or allow VLAN 30 on the trunk
Verify    : Vlan30 up/up, ping works

Conflict  : R1 Gi0/0.30 AND SW1 Vlan30 both = 10.10.30.1
Result    : duplicate IP, intermittent failures
Rule      : exactly one gateway per VLAN (shut down the other)</code></pre>

<h2><span class="hn">۸.</span> تمرین‌ها</h2>

<details><summary>۲ (ساده): سه شرط Up شدن SVI</summary><pre><code>1) VLAN exists
2) at least one active port in the VLAN

<h2><span class="hn">۱.</span> روش سیستماتیک: از پایین به بالا</h2>
<p>مثل بررسی خرابی یک ماشین: اول ببین بنزین دارد (لایه ۱)، بعد استارت می‌خورد (لایه ۲)، بعد جاده را بلد است (لایه ۳). از پایین شروع کنید چون اگر کابل قطع باشد، بقیه‌ی چیزها بی‌معنی است.</p>
<figure class="fig"><svg viewBox="0 0 720 250" role="img" aria-label="troubleshooting ladder"><rect x="30" y="20" width="160" height="44" rx="8" class="net"/><text x="110" y="47" text-anchor="middle" class="on">L1 Physical</text><text x="210" y="37" class="cap">link up? cable, port shutdown</text><text x="210" y="54">show interfaces status</text><rect x="30" y="75" width="160" height="44" rx="8" class="net"/><text x="110" y="102" text-anchor="middle" class="on">L2 Data-link</text><text x="210" y="92" class="cap">VLAN, trunk, MAC</text><text x="210" y="109">show vlan brief / trunk / mac</text><rect x="30" y="130" width="160" height="44" rx="8" class="hst"/><text x="110" y="157" text-anchor="middle" class="on">L3 Network</text><text x="210" y="147" class="cap">IP, mask, gateway, route</text><text x="210" y="164">show ip int brief / route</text><rect x="30" y="185" width="160" height="44" rx="8" class="wrn"/><text x="110" y="212" text-anchor="middle" class="on">L4+ Service</text><text x="210" y="202" class="cap">port, firewall, app</text><text x="210" y="219">telnet/ssh test, logs</text></svg><figcaption>شکل ۱: نردبان عیب‌یابی؛ از لایه ۱ شروع کنید و فقط وقتی لایه پایین سالم بود بالاتر بروید.</figcaption></figure>

<h3>چارچوب پنج‌مرحله‌ای</h3>
<ol>
<li><b>Symptom:</b> دقیقاً چه چیزی خراب است و برای چه کسی؟ (علامت، نه حدس)</li>
<li><b>Scope:</b> چند نفر؟ یک VLAN؟ همه؟</li>
<li><b>Hypothesis:</b> از پایین‌ترین لایه، یک فرضیه بساز.</li>
<li><b>Test:</b> با یک دستور show آن را بسنج.</li>
<li><b>Fix and Verify:</b> رفع، تأیید، ثبت در گزارش (RCA).</li>
</ol>

<h2><span class="hn">۲.</span> پنج سناریوی این هفته</h2>
<h3>TS01: Interface Shutdown (ساده)</h3>
<pre><code>Symptom  : PC on Gi0/1 has no link
Evidence : show interfaces status -> Gi0/1 disabled / administratively down
Fix      : interface gi0/1 / no shutdown
Verify   : link up, ping works</code></pre>
<h3>TS02: Duplex/Speed Mismatch (مفهومی)</h3>
<pre><code>Symptom  : link is up but very slow, many CRC/late collisions
Cause    : one side half-duplex, the other full-duplex
Check    : show interfaces gi0/1 -> duplex, speed, errors
Fix      : set both sides to auto (or both manually identical)</code></pre>
<p>در شبیه‌ساز، تنظیم Duplex ممکن است اثر واقعی نداشته باشد؛ این سناریو را مفهومی بدانید و در تجهیز واقعی تمرین کنید.</p>
<h3>TS03: VLAN اشتباه روی Access Port</h3>
<pre><code>Symptom  : PC cannot reach its gateway
Evidence : show vlan brief -> port is in the wrong VLAN
Fix      : switchport access vlan 20</code></pre>
<h3>TS04: Allowed VLAN حذف‌شده روی Trunk</h3>
<pre><code>Symptom  : one VLAN lost across the trunk
Evidence : show interfaces trunk -> VLAN missing in "allowed"
Fix      : switchport trunk allowed vlan add 30</code></pre>
<h3>TS05: Human Error — جایگزینی Allowed List</h3>
<pre><code>Cause    : "allowed vlan 40" typed without "add"
Impact   : all VLANs except 40 are down on the trunk
Fix      : restore from backup or re-add: allowed vlan 10,20,30,40
Lesson   : always "add"; backup + review show before and after</code></pre>

<h2><span class="hn">۳.</span> مثال ساده/متوسط/سخت</h2>
<h3>ساده</h3>
<p>کاربر می‌گوید «شبکه قطع است». اول <code>show interfaces status</code>: اگر پورت <code>disabled</code> است، TS01.</p>
<h3>متوسط</h3>
<p>کاربر به سرور نمی‌رسد ولی به Gateway می‌رسد. لایه ۱ و ۲ سالم است؛ پس <code>show ip route</code> و Gateway سرور را ببینید (لایه ۳).</p>
<h3>سخت</h3>
<p>«فقط VLAN 30 از شعبه قطع است، بقیه خوب». نردبان: لینک Trunk up است (L1)، VLAN 30 در allowed نیست (L2) ⇒ TS04. در RCA: چه کسی/کی/چرا تغییر داد؟ چطور جلوگیری شود؟</p>

<h2><span class="hn">۴.</span> تمرین‌ها</h2>
<details><summary>۱ (ساده): اولین لایه‌ای که چک می‌کنیم چیست؟</summary><pre><code>Layer 1 (physical): cable, link, shutdown.</code></pre></details>
<details><summary>۲ (ساده): پنج مرحله‌ی چارچوب عیب‌یابی را بنویس</summary><pre><code>Symptom, Scope, Hypothesis, Test, Fix and Verify.</code></pre></details>
<details><summary>۳ (متوسط): «ping به Gateway OK ولی به اینترنت نه»؛ کدام لایه؟</summary><pre><code>Layer 3 or above: routing/default route/NAT/firewall (L1 and L2 are fine).</code></pre></details>
<details><summary>۴ (سخت): یک Trunk بعد از «allowed vlan 40» همه را قطع کرد؛ سه اقدام بعدی</summary><pre><code>1) restore from backup
2) allowed vlan add 10,20,30
3) verify with show interfaces trunk and ping, then write the RCA</code></pre></details>

<h2><span class="hn">۵.</span> Lab هدایت‌شده: همه‌ی TSها را بسازید و رفع کنید</h2>
<p>برای هر سناریو: (۱) بکاپ، (۲) خراب‌کردن عمدی، (۳) نوشتن Symptom و Evidence، (۴) رفع، (۵) Verify.</p>
<ol>
<li>TS01: <code>shutdown</code> روی پورت PC1 و رفع.</li>
<li>TS03: بردن پورت PC2 به VLAN اشتباه و رفع.</li>
<li>TS04: <code>allowed vlan remove 30</code> روی Trunk و رفع با <code>add 30</code>.</li>
<li>TS05: <code>allowed vlan 40</code> (بدون add)، سپس برگرداندن از بکاپ.</li>
<li>TS09: <code>shutdown</code> پورت سرور و دیدن SVI down/down.</li>
</ol>

<h2><span class="hn">۴.</span> مفهوم و مسیر Packet</h2>
<p><b>Port Group</b> (گروه پورت) در ESXi مجموعه تنظیمات یک شبکه مجازی است؛ <b>VLAN 4095</b> یعنی «همه VLANها بدون حذف برچسب (Tag)» عبور کنند. چون سوییچ‌ها و FortiGate داخل PNetLab VLANها را می‌سازند، ESXi فقط یک لوله ایزوله می‌دهد.</p>
<p>مسیر ترافیک مدیریتی: PC شما → WireGuard → MikroTik → LAN → <code>vmnic0</code> → <code>vSwitch0</code> → Port Group <code>VM Network</code> → کارت VM → <code>pnet0</code> → سرویس وب/SSH PNetLab. ترافیک Lab فقط روی <code>pnet1</code> و <code>vSwitch-FGT</code> می‌ماند و به شبکه واقعی نمی‌رسد (چون Uplink ندارد).</p>
<p>سه گزینه Security روی <code>PG-FGT-TRUNK</code> (<span class="en">Promiscuous، MAC address changes، Forged transmits</span>) چون PNetLab چند MAC مجازی پشت یک کارت دارد، باید «Accept» باشند.</p>

<li>مشکل لینک را پیدا کردید و با <code>CHG-0001</code> رفع کردید.</li>

<details><summary>چرا نباید فرض کنیم eth0 همان Adapter 1 است؟</summary><p>ترتیب نام‌گذاری لینوکس ممکن است با ترتیب ESXi فرق کند؛ MAC مرجع است.</p></details>
<details><summary>سه چیزی که هر تغییر لازم دارد؟</summary><p>Backup، Rollback Plan، تأیید صریح.</p></details>

<h2><span class="hn">۲.</span> قرارداد نوشتن فارسی و انگلیسی</h2>
<p>برای اینکه متن راست‌به‌چپ به‌هم نریزد، هر عبارت انگلیسی (مثل VLAN یا <span class="en">Spanning Tree Protocol</span>) در یک قطعه چپ‌به‌راست جدا نمایش داده می‌شود. دستورات همیشه در بلوک کد و چپ‌به‌راست هستند:</p>
<pre><code>Switch&gt; enable
Switch# configure terminal
Switch(config)# hostname HQ-ACC-SW1
HQ-ACC-SW1(config)# end</code></pre>
<p>هر اصطلاح انگلیسی در اولین استفاده با معادل فارسی و کاربرد فنی توضیح داده می‌شود؛ مثلاً <span class="en">Trunk</span> یعنی «لینکی که چند VLAN را با برچسب جابه‌جا می‌کند».</p>

<script>
(function(){
  const D=window.COURSE;
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  /* ---------- Settings ---------- */
  function applyFont(v){document.documentElement.style.setProperty('--font-ui',v);store.set('c_font',v)}
  function applySize(v){document.documentElement.style.setProperty('--fs',v+'px');store.set('c_size',v)}
  function applyTheme(t){document.documentElement.setAttribute('data-theme',t);$$('.themebtn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===t));store.set('c_theme',t)}
  const fs=$('#fontsel'),ss=$('#sizesel');
  const sf=store.get('c_font',fs.value); if([...fs.options].some(o=>o.value===sf)){fs.value=sf} applyFont(fs.value);
  ss.value=store.get('c_size','17'); applySize(ss.value);
  applyTheme(store.get('c_theme','dark'));
  fs.onchange=()=>applyFont(fs.value); ss.onchange=()=>applySize(ss.value);
  $$('.themebtn').forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme));
  $('#menubtn').onclick=()=>document.body.classList.toggle('menu-open');

  /* ---------- Progress ---------- */
  const done=new Set(JSON.parse(store.get('c_done','[]')));
  const saveDone=()=>store.set('c_done',JSON.stringify([...done]));
  const all=D.modules.flatMap(m=>m.lessons);
  const ready=all.filter(l=>l.ready);

  /* ---------- Sidebar ---------- */
  function buildMenu(cur){
    const sb=$('#sidebar'); const pct=ready.length?Math.round(100*ready.filter(l=>done.has(l.id)).length/ready.length):0;
    let h=`<div class="progress">پیشرفت: <b>${pct}٪</b> از درس‌های آماده<div class="bar"><i style="width:${pct}%"></i></div>
           <div style="margin-top:4px">نسخه فایل: <span class="en">${D.version}</span> · ${D.updated}</div></div>`;
    D.modules.forEach(m=>{
      const open=m.lessons.some(l=>l.id===cur)||m.lessons.some(l=>l.ready);
      h+=`<div class="mod" data-m="${m.id}"${open?'':' hidden-list'}><button type="button"><span>${m.title}</span><span>${m.lessons.length}</span></button><ul>`;
      m.lessons.forEach(l=>{
        h+=`<li><a href="#/${l.id}" class="${l.id===cur?'active':''} ${l.ready?'':'locked'} ${done.has(l.id)?'done':''}" data-id="${l.id}"><span class="dot"></span><span>${l.title}${l.ready?'':' — به‌زودی'}</span></a></li>`;
      });
      h+='</ul></div>';
    });
    sb.innerHTML=h;
    $$('.mod>button').forEach(b=>b.onclick=()=>b.parentElement.toggleAttribute('hidden-list'));
    $$('.mod li a.locked').forEach(a=>a.onclick=e=>e.preventDefault());
    $$('.mod li a').forEach(a=>a.addEventListener('click',()=>document.body.classList.remove('menu-open')));
    const act=sb.querySelector('a.active'); if(act) act.scrollIntoView({block:'nearest'});
  }

  /* ---------- Persian/English separation (auto) ---------- */
  const LATIN=/[A-Za-z0-9][A-Za-z0-9_\-\.\/:@#%+=&*]*(?:\s+[A-Za-z0-9][A-Za-z0-9_\-\.\/:@#%+=&*]*)*/g;
  function wrapLatin(root){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
      const p=n.parentElement; if(!p||p.closest('pre,code,.en,script,style,svg,summary-nolatin')) return NodeFilter.FILTER_REJECT;
      return /[A-Za-z]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      const t=n.nodeValue; if(!/[؀-ۿ]/.test(t)&&t.trim().split(/\s+/).length>8) return; // long pure-English text: leave
      const frag=document.createDocumentFragment(); let last=0,m; LATIN.lastIndex=0;
      while((m=LATIN.exec(t))){
        const s=m[0]; if(!/[A-Za-z]/.test(s)) continue;
        if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
        const sp=document.createElement('span'); sp.className='en'; sp.textContent=s; frag.appendChild(sp); last=m.index+s.length;
      }
      if(last===0) return;
      if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
      n.parentNode.replaceChild(frag,n);
    });
  }

  /* ---------- Render ---------- */
  function reviewBlock(){
    const items=D.review.filter(r=>r.type!=='sample');
    const list=(items.length?items:D.review).map(r=>`<div class="review-item"><small>${r.type==='sample'?'نمونه':(r.type==='mistake'?'اشتباه':'سؤال')} · ${r.lesson}</small><p><b>${r.q}</b></p><p>${r.a}</p></div>`).join('');
    return `<h1>اشتباهات و سؤال‌های من (مرور دوره‌ای)</h1><p>هر سؤال یا اشتباه شما در درس بعدی داخل «یادآوری» می‌آید و اینجا جمع می‌شود. قبل از هر آزمون Gate این صفحه را مرور کنید.</p>${list}`;
  }
  function render(){
    const id=(location.hash.replace(/^#\//,'')||ready[0].id);
    const meta=all.find(l=>l.id===id)||ready[0];
    const art=$('#lesson'); let html;
    if(meta.id==='review') html=reviewBlock();
    else{
      const L=D.lessons[meta.id];
      html=`<h1>${meta.title}</h1>${L&&L.sub?`<p class="meta">${L.sub}</p>`:''}${L?L.html:'<p>این درس هنوز آماده نشده است.</p>'}`;
      if(meta.ready) html+=`<button class="navbtn donebtn" id="donebtn">${done.has(meta.id)?'✔ مطالعه شد (لغو)':'علامت‌گذاری به‌عنوان مطالعه‌شده'}</button>`;
    }
    const idx=ready.findIndex(l=>l.id===meta.id);
    const prev=ready[idx-1],next=ready[idx+1];
    html+=`<div class="nav"><span>${prev?`<a class="navbtn" href="#/${prev.id}">→ ${prev.title}</a>`:''}</span><span>${next?`<a class="navbtn" href="#/${next.id}">${next.title} ←</a>`:''}</span></div>`;
    art.innerHTML=html; wrapLatin(art);
    const db=$('#donebtn'); if(db) db.onclick=()=>{done.has(meta.id)?done.delete(meta.id):done.add(meta.id);saveDone();render()};
    buildMenu(meta.id); document.title=meta.title+' | دوره شبکه و امنیت'; window.scrollTo(0,0); $('.content').scrollTop=0;
  }
  window.addEventListener('hashchange',render); render();
})();
</script>
